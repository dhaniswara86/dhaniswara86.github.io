<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>QR Generator Kegiatan</title>
<link rel="stylesheet" href="qr-menu.css">
</head>
<body>

<div class="container">
<h1>QR Generator Kegiatan</h1>
<p>Pilih kegiatan untuk membuat QR Daftar Hadir + Pretest dan Posttest + Evaluasi.</p>

<div class="card">
<label>Kegiatan</label>
<select id="eventSelect">
<option>Memuat kegiatan...</option>
</select>

<button onclick="generateQR()">Generate QR</button>
</div>

<div class="card">
<h3>QR yang tersedia</h3>

<div class="item">
<strong>01. Daftar Hadir + Pretest</strong>
<p>Link awal kegiatan</p>
<button>Generate</button>
</div>

<div class="item">
<strong>02. Posttest + Evaluasi</strong>
<p>Link akhir kegiatan</p>
<button>Generate</button>
</div>

</div>
</div>

<script src="qr-menu.js"></script>
</body>
</html>
