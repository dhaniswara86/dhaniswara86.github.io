<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabayan Admin - QR Generator</title>
<link rel="stylesheet" href="qr-menu.css">
</head>
<body>

<div class="container">

<h1>QR Generator Kegiatan</h1>
<p>Pilih kegiatan yang akan dibuatkan QR formulir.</p>

<div class="card">

<label>Kegiatan</label>
<select id="eventSelect">
<option>Memuat kegiatan...</option>
</select>

<button onclick="generateQR()">Generate QR</button>

</div>


<div class="grid">

<div class="card">
<h3>01. Daftar Hadir + Pretest</h3>
<input id="link1" readonly>
<div id="qr1"></div>
</div>

<div class="card">
<h3>02. Posttest + Evaluasi</h3>
<input id="link2" readonly>
<div id="qr2"></div>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../library/qrcode.js"></script>
<script src="qr-menu.js"></script>

</body>
</html>
