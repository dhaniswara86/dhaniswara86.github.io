<style>
:root{--ink:#111318;--muted:#707985;--blue:#0a66ff;--navy:#102655;--yellow:#f7c948;--line:#dfe6ef;--bg:#f5f8fc;--green:#067647;--red:#b42318;--orange:#b54708}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,rgba(10,102,255,.07),transparent 28%),radial-gradient(circle at 95% 10%,rgba(247,201,72,.10),transparent 30%),#f7f9fc;letter-spacing:-.015em}
a{color:inherit}.wrap{width:min(1220px,calc(100% - 28px));margin:auto;padding:22px 0 44px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 18px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:850}.brand img{width:42px;height:34px;object-fit:contain}
.pill{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;background:#eef5ff;color:var(--blue);font-size:9px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}
.btn{min-height:42px;border:1px solid transparent;border-radius:999px;padding:10px 15px;font:inherit;font-size:12px;font-weight:760;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn-yellow{background:var(--yellow);color:#191919}.btn-blue{background:#111827;color:#fff}.btn-outline{background:#fff;border-color:#d9e2ec;color:#263649}.btn-red{background:#b42318;color:#fff}.btn-green{background:#067647;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 16px 38px rgba(20,42,70,.06)}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.field{display:grid;gap:6px}.field label{font-size:10px;font-weight:780;color:#77818c}.field input,.field textarea,.field select{width:100%;border:1px solid #dce3ea;border-radius:12px;padding:11px 12px;background:#fff;font:inherit;font-size:12px;outline:none}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#a8c7ef;box-shadow:0 0 0 4px rgba(10,102,255,.06)}
.msg{display:none;margin-top:10px;border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.5}.msg.show{display:block}.msg.ok{background:#ecfdf3;color:var(--green)}.msg.err{background:#fff1f0;color:var(--red)}
.tablewrap{overflow:auto;border:1px solid #e5eaf0;border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 12px;border-bottom:1px solid #eef1f4;text-align:left;font-size:10.5px;vertical-align:top}.table th{background:#f8fafc;color:#6f7b88;font-size:9px;letter-spacing:.06em;text-transform:uppercase}.table tr:last-child td{border-bottom:0}
.status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}.draft{background:#f2f4f7;color:#667085}.published{background:#ecfdf3;color:#067647}.closed{background:#fff1f0;color:#b42318}.phase-open{background:#ecfdf3;color:#067647}.phase-closed{background:#fff7ed;color:#b54708}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hero h1{margin:10px 0 8px;font-size:clamp(38px,5vw,72px);line-height:.94;letter-spacing:-.065em}.hero p{margin:0;max-width:760px;color:#717c88;line-height:1.65;font-size:14px}
.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid #dde5ee;background:#fff;padding:9px 12px;border-radius:999px;font:inherit;font-size:10px;font-weight:780;cursor:pointer}.tab.active{background:#111827;color:#fff;border-color:#111827}
.linkbox{padding:12px;border-radius:13px;background:#f6f8fb;border:1px solid #e3e8ef;font-size:10px;word-break:break-all}.section-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.section-title h2{margin:0;font-size:24px;letter-spacing:-.045em}.section-title p{margin:5px 0 0;color:#7a8490;font-size:11px}
@media(max-width:820px){.two,.three{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.wrap{width:min(100% - 18px,1220px)}}

.shell{width:min(900px,100%);margin:auto}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.step{padding:13px;border:1px solid #e0e7ef;border-radius:16px;background:#fff;opacity:.42;transition:.2s ease}.step.active{opacity:1;border-color:#f2c94c;background:#fff8db;box-shadow:0 0 0 3px rgba(247,201,72,.18)}.step.done{opacity:1;border-color:#cee7d7;background:#fbfffc}.step b{display:block;font-size:11px}.step span{display:block;margin-top:4px;color:#7a8591;font-size:9px}.question{padding:16px;border:1px solid #e5eaf0;border-radius:16px;background:#fff;margin-top:10px}.question h3{margin:0 0 12px;font-size:13px;line-height:1.45}.option{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:12px;background:#f8fafc;margin-top:7px;font-size:11px}.rating{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.rating label{display:grid;place-items:center;width:42px;height:42px;border:1px solid #dce4ed;border-radius:999px;background:#f8fafc;font-size:11px;font-weight:800;cursor:pointer}.rating input{display:none}.rating label:has(input:checked){background:#111827;color:#fff;border-color:#111827}.donebox{text-align:center;padding:30px}.donebox h2{font-size:36px;letter-spacing:-.05em;margin:12px 0}@media(max-width:650px){.progress{grid-template-columns:1fr}}

.eval-intro{padding:15px;border-radius:16px;background:#fff8db;border:1px solid #f2c94c;margin:14px 0;font-size:11px;line-height:1.65}
.eval-section{margin-top:18px}
.eval-section h3{margin:0 0 8px;font-size:17px;letter-spacing:-.03em}
.matrix-wrap{overflow-x:auto;border:1px solid #e1e7ee;border-radius:16px;margin-top:12px}
.matrix{width:100%;border-collapse:collapse;min-width:760px;background:#fff}
.matrix th,.matrix td{padding:12px 10px;border-bottom:1px solid #edf0f4;text-align:center;font-size:10.5px}
.matrix th:first-child,.matrix td:first-child{text-align:left;width:42%;min-width:270px}
.matrix th{background:#f8fafc;font-size:9px;color:#667085}
.matrix tr:last-child td{border-bottom:none}
.matrix input[type="radio"]{width:18px;height:18px;accent-color:#d8a900}
.eval-choice{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid #e1e7ee;border-radius:13px;background:#fbfcfe;margin-top:8px;font-size:11px;cursor:pointer}
.eval-choice:has(input:checked){background:#fff8db;border-color:#f2c94c}
.eval-choice input{accent-color:#d8a900}
.eval-text{width:100%;min-height:100px;border:1px solid #dce3ea;border-radius:12px;padding:11px;font:inherit;font-size:12px}
.conditional{display:none}
.conditional.show{display:block}
.req{color:#d92d20}
</style></head>
<body><div class="wrap"><div class="shell">
<div class="topbar"><a class="brand" href="../index.html"><img src="assets/logo-kabayan.svg"><span>Kabayan / Tahap Akhir</span></a></div>
<section class="hero"><span class="pill">Link 2</span><h1 id="eventTitle">Tahap Akhir.</h1><p id="eventMeta">Posttest + Evaluasi + Sertifikat</p></section>
<div class="progress"><div class="step active" id="s1"><b>03 Posttest</b><span>Evaluasi akhir</span></div><div class="step" id="s2"><b>04 Evaluasi</b><span>Umpan balik kegiatan</span></div><div class="step" id="s3"><b>05 Sertifikat</b><span>Terbit otomatis</span></div></div>
<div class="card" id="content"><div class="muted">Memuat...</div></div><div class="msg err" id="err"></div>
</div></div>
<script src="supabase-config.js"></script>
<script>
let sb=null,eventData=null,token=null,progress=null,certificateData=null,preparedQrData=null,preparedCertificateJpeg=null;const $=id=>document.getElementById(id),code=new URLSearchParams(location.search).get('kode')||'';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function loadScript(url){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=url;
    s.async=true;
    s.onload=()=>resolve(true);
    s.onerror=()=>reject(new Error('Gagal memuat '+url));
    document.head.appendChild(s);
  });
}

async function ensureJsPdf(){
  if(window.jspdf?.jsPDF) return true;

  const sources=[
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
    'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'
  ];

  for(const url of sources){
    try{
      await loadScript(url);
      if(window.jspdf?.jsPDF) return true;
    }catch(e){
      console.warn(e);
    }
  }

  return false;
}

function err(t){$('err').textContent=t;$('err').className='msg show err'}
function steps(n){for(let i=1;i<=3;i++){const el=$('s'+i);el.classList.toggle('done',i<n);el.classList.toggle('active',i===n)}}
async function init(){try{if(!code)throw new Error('Kode kegiatan tidak tersedia.');sb=window.KabayanKegiatanSupabase.getClient();const {data,error}=await sb.rpc('public_get_external_event',{p_code:code});if(error)throw error;if(!data?.length)throw new Error('Kegiatan tidak ditemukan atau belum dipublish.');eventData=data[0];$('eventTitle').textContent=eventData.title;$('eventMeta').textContent=[eventData.event_date,eventData.issuer,'Posttest + Evaluasi + Sertifikat'].filter(Boolean).join(' • ');if(!eventData.final_phase_open)return renderClosed();token=localStorage.getItem('kabayan_edukasi_'+eventData.event_id)||null;if(token){try{await refresh();return}catch{token=null}}renderIdentify()}catch(e){err(e.message);$('content').innerHTML='<div class="muted">Tidak dapat membuka tahap akhir.</div>'}}
function renderClosed(){$('content').innerHTML='<div class="donebox"><span class="pill">Belum Dibuka</span><h2>Tahap Akhir Belum Dibuka.</h2><p class="muted">Posttest, Evaluasi, dan Sertifikat akan tersedia setelah dibuka oleh panitia.</p></div>'}
function renderIdentify(){steps(1);$('content').innerHTML=`<span class="pill">Identifikasi Peserta</span><h2 style="font-size:30px;letter-spacing:-.045em;margin:14px 0 8px">Lanjutkan Kegiatan.</h2><p class="muted" style="font-size:11px">Masukkan email yang sama dengan yang Anda gunakan pada Daftar Hadir / Pretest.</p><div class="field" style="margin-top:16px"><label>Email</label><input id="resumeEmail" type="email" placeholder="nama@email.com"></div><button class="btn btn-yellow" id="resumeBtn" style="margin-top:14px">Lanjut →</button>`;$('resumeBtn').onclick=resume}
async function resume(){try{const email=$('resumeEmail').value.trim();if(!email)throw new Error('Email wajib diisi.');const {data,error}=await sb.rpc('public_resume_external_participant',{p_event_code:code,p_email:email});if(error)throw error;token=data;localStorage.setItem('kabayan_edukasi_'+eventData.event_id,token);await refresh()}catch(e){err(e.message)}}
async function fetchCertificate(){
  const {data,error}=await sb.rpc('public_get_external_certificate_by_token',{p_token:token});
  if(error) throw error;
  if(data?.length){
    certificateData=data[0];
    return certificateData;
  }
  certificateData=null;
  return null;
}

async function refresh(){
  const {data,error}=await sb.rpc('public_get_external_progress',{p_token:token});
  if(error) throw error;
  if(!data?.length) throw new Error('Data peserta tidak ditemukan.');

  progress=data[0];

  if(!progress.attendance_completed || (progress.pretest_required && !progress.pretest_completed))
    throw new Error('Tahap awal belum lengkap.');

  if(progress.posttest_required && !progress.posttest_completed)
    return loadPosttest();

  if(progress.evaluation_required && !progress.evaluation_completed)
    return loadEvaluation();

  const cert = await fetchCertificate();
  if(cert) return renderCertificate();

  const minScore=Number(progress.minimum_posttest_score??70);
  const postScore=Number(progress.posttest_score??0);

  if(progress.posttest_completed && postScore<minScore)
    return renderNotEligible();

  return renderPendingCertificate();
}

async function loadPosttest(){try{steps(1);const {data,error}=await sb.rpc('public_get_external_questions',{p_token:token,p_test_type:'posttest'});if(error)throw error;if(!data?.length)throw new Error('Posttest belum tersedia. Hubungi panitia.');$('content').innerHTML=`<span class="pill">Tahap 3</span><h2 style="font-size:30px;letter-spacing:-.045em;margin:14px 0 8px">Posttest</h2><p class="muted" style="font-size:11px">Jawab seluruh soal untuk melanjutkan ke Evaluasi. Sertifikat hanya diberikan jika nilai Posttest memenuhi batas minimum kegiatan.</p><form id="testForm">${data.map((q,i)=>`<div class="question"><h3>${i+1}. ${esc(q.question_text)}</h3>${[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].map(o=>`<label class="option"><input type="radio" name="q_${q.id}" value="${o[0]}"> <span><b>${o[0]}.</b> ${esc(o[1])}</span></label>`).join('')}</div>`).join('')}<button class="btn btn-yellow" style="margin-top:15px">Kirim Posttest →</button></form>`;$('testForm').onsubmit=e=>submitPosttest(e,data)}catch(e){err(e.message)}}
async function submitPosttest(e,questions){e.preventDefault();try{const ans={};for(const q of questions){const v=document.querySelector(`input[name="q_${q.id}"]:checked`)?.value;if(!v)throw new Error('Semua soal wajib dijawab.');ans[q.id]=v}const {error}=await sb.rpc('public_submit_external_test',{p_token:token,p_test_type:'posttest',p_answers:ans});if(error)throw error;await refresh()}catch(e){err(e.message)}}

const Q11_ROWS = ["Materi penyuluhan yang disampaikan sesuai dengan kebutuhan", "Materi penyuluhan yang disampaikan mudah dipahami", "Penyuluh mampu berkomunikasi dengan baik dan menjelaskan materi dengan jelas dan efektif", "Penyuluh mampu menjawab pertanyaan yang ada dengan baik", "Penyuluh memiliki sikap dan etika yang profesional", "Kegiatan penyuluhan dilakukan dengan lancar dan efektif", "Kegiatan penyuluhan membantu saya memahami perpajakan dengan lebih baik"];
const Q14_ROWS = ["Saya pikir bahwa saya akan lebih sering menggunakan Coretax DJP", "Saya menemukan bahwa Coretax DJP tidak harus dibuat serumit ini", "Saya merasa penggunaan Coretax DJP mudah", "Saya membutuhkan bantuan dari orang yang memiliki kemampuan teknis untuk dapat menggunakan Coretax DJP", "Saya merasa fitur-fitur dalam Coretax DJP terintegrasi dengan baik", "Saya merasa ada banyak hal yang belum konsisten pada Coretax DJP", "Saya merasa mayoritas pengguna akan dapat mempelajari Coretax DJP dengan cepat", "Saya merasa Coretax DJP membingungkan untuk digunakan", "Saya merasa percaya diri mampu menggunakan Coretax DJP", "Saya perlu mempelajari banyak hal terlebih dahulu sebelum dapat menggunakan Coretax DJP"];

function matrixHTML(prefix,rows){
  const headers=[['5','Sangat Setuju'],['4','Setuju'],['3','Cukup Setuju'],['2','Kurang Setuju'],['1','Tidak Setuju']];
  return `
    <div class="matrix-wrap">
      <table class="matrix">
        <thead>
          <tr>
            <th>Pernyataan</th>
            ${headers.map(h=>`<th>${h[0]}<br><span style="font-weight:500">${h[1]}</span></th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${rows.map((text,i)=>`
            <tr>
              <td>${esc(text)}</td>
              ${[5,4,3,2,1].map(n=>`
                <td><input type="radio" name="${prefix}_${i+1}" value="${n}" aria-label="${n}"></td>
              `).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function loadEvaluation(){
  try{
    steps(2);
    $('content').innerHTML=`
      <span class="pill">Tahap 4</span>
      <h2 style="font-size:30px;letter-spacing:-.045em;margin:14px 0 8px">Evaluasi Kegiatan</h2>

      <div class="eval-intro">
        <b>Pernyataan terkait Kegiatan Penyuluhan yang Diikuti</b><br>
        Pilih angka yang paling merepresentasikan pendapat Anda:<br>
        <b>5 = Sangat Setuju</b> · <b>4 = Setuju</b> · 3 = Cukup Setuju · 2 = Kurang Setuju · 1 = Tidak Setuju
      </div>

      <form id="evalForm">
        <section class="eval-section">
          <h3>11. Pernyataan <span class="req">*</span></h3>
          ${matrixHTML('q11',Q11_ROWS)}
        </section>

        <section class="eval-section">
          <h3>12. Saran dan Masukan terkait Kegiatan Penyuluhan yang Diikuti <span class="req">*</span></h3>
          <textarea class="eval-text" id="q12" placeholder="Tuliskan saran dan masukan Anda"></textarea>
        </section>

        <section class="eval-section">
          <h3>13. Apakah Bapak/Ibu pernah menggunakan Coretax DJP? <span class="req">*</span></h3>
          <label class="eval-choice"><input type="radio" name="q13" value="Ya"><span>Ya</span></label>
          <label class="eval-choice"><input type="radio" name="q13" value="Tidak"><span>Tidak</span></label>
        </section>

        <div id="coretaxConditional" class="conditional">
          <section class="eval-section">
            <h3>14. Pernyataan <span class="req">*</span></h3>
            <div class="eval-intro" style="margin-top:8px">
              Berikan penilaian atas pengalaman menggunakan Coretax DJP dengan skala 5 = Sangat Setuju sampai 1 = Tidak Setuju.
            </div>
            ${matrixHTML('q14',Q14_ROWS)}
          </section>

          <section class="eval-section">
            <h3>15. Mohon Bapak/Ibu dapat memberikan usulan untuk menyempurnakan Coretax DJP menjadi aplikasi sistem perpajakan modern yang bersifat SIMPATI (Simpel/Mudah, Pasti, Andal, dan Terintegrasi) <span class="req">*</span></h3>
            <textarea class="eval-text" id="q15" placeholder="Tuliskan usulan Anda"></textarea>
          </section>

          <section class="eval-section">
            <h3>16. Apakah Bapak/Ibu pernah melaporkan SPT Tahunan PPh melalui Coretax DJP? <span class="req">*</span></h3>
            <label class="eval-choice"><input type="radio" name="q16" value="Ya"><span>Ya</span></label>
            <label class="eval-choice"><input type="radio" name="q16" value="Tidak"><span>Tidak</span></label>
          </section>

          <section class="eval-section">
            <h3>17. Dalam melaporkan SPT Tahunan PPh melalui Coretax DJP, apakah Bapak/Ibu dibimbing/diasistensi secara langsung oleh petugas pajak? <span class="req">*</span></h3>
            <label class="eval-choice"><input type="radio" name="q17" value="Ya"><span>Ya</span></label>
            <label class="eval-choice"><input type="radio" name="q17" value="Tidak"><span>Tidak</span></label>
          </section>
        </div>

        <button class="btn btn-yellow" style="margin-top:18px">Kirim Evaluasi & Lanjut →</button>
      </form>
    `;

    document.querySelectorAll('input[name="q13"]').forEach(el=>{
      el.addEventListener('change',()=>{
        $('coretaxConditional').classList.toggle('show',el.checked && el.value==='Ya');
      });
    });

    $('evalForm').onsubmit=submitStructuredEvaluation;
  }catch(e){
    err(e.message);
  }
}

async function submitStructuredEvaluation(e){
  e.preventDefault();
  try{
    const q11={};
    for(let i=1;i<=Q11_ROWS.length;i++){
      const v=document.querySelector(`input[name="q11_${i}"]:checked`)?.value;
      if(!v) throw new Error('Semua pernyataan nomor 11 wajib diisi.');
      q11[`q11_${i}`]=Number(v);
    }

    const q12=$('q12').value.trim();
    if(!q12) throw new Error('Saran dan masukan nomor 12 wajib diisi.');

    const q13=document.querySelector('input[name="q13"]:checked')?.value;
    if(!q13) throw new Error('Pertanyaan nomor 13 wajib diisi.');

    const answers={q11,q12,q13};

    if(q13==='Ya'){
      const q14={};
      for(let i=1;i<=Q14_ROWS.length;i++){
        const v=document.querySelector(`input[name="q14_${i}"]:checked`)?.value;
        if(!v) throw new Error('Semua pernyataan nomor 14 wajib diisi.');
        q14[`q14_${i}`]=Number(v);
      }

      const q15=$('q15').value.trim();
      if(!q15) throw new Error('Usulan nomor 15 wajib diisi.');

      const q16=document.querySelector('input[name="q16"]:checked')?.value;
      if(!q16) throw new Error('Pertanyaan nomor 16 wajib diisi.');

      const q17=document.querySelector('input[name="q17"]:checked')?.value;
      if(!q17) throw new Error('Pertanyaan nomor 17 wajib diisi.');

      Object.assign(answers,{q14,q15,q16,q17});
    }

    const {data,error}=await sb.rpc('public_submit_structured_evaluation',{
      p_token:token,
      p_answers:answers
    });

    if(error) throw error;
    await refresh();
  }catch(e){
    err(e.message);
  }
}

function renderNotEligible(){
  steps(3);
  const minScore=Number(progress.minimum_posttest_score??70);
  const postScore=Number(progress.posttest_score??0);
  $('content').innerHTML=`<div class="donebox">
    <span class="pill">Tahap Selesai</span>
    <h2>Terima Kasih.</h2>
    <p class="muted">
      Seluruh tahapan kegiatan telah selesai.<br><br>
      Nilai Posttest Anda: <b>${postScore}</b><br>
      Nilai minimum sertifikat: <b>${minScore}</b><br><br>
      Sertifikat belum dapat diterbitkan karena nilai Posttest belum mencapai batas minimum.
    </p>
  </div>`;
}

const CERT_TEMPLATE_URL='assets/template-sertifikat.png';
const CERT_FONT='"Montserrat", Arial, sans-serif';
const CERT_POS={
  titleX:127,titleY:276,
  numberX:127,numberY:319,
  labelX:127,labelY:395,
  nameX:127,nameY:452,
  institutionX:127,institutionY:502,
  detailX:127,detailY:534,
  dateX:127,dateY:630,
  qrX:130,qrY:753,
  signerX:125,signerY:888
};

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error('Gagal memuat gambar: '+src));
    img.src=src;
  });
}

function fitCanvasText(ctx,text,maxWidth,startPx,minPx,weight='700'){
  let size=startPx;
  ctx.font=`${weight} ${size}px ${CERT_FONT}`;
  while(size>minPx && ctx.measureText(text).width>maxWidth){
    size-=1;
    ctx.font=`${weight} ${size}px ${CERT_FONT}`;
  }
  return size;
}

function wrapCanvasLines(ctx,text,maxWidth,fontPx,weight='700',maxLines=6){
  ctx.font=`${weight} ${fontPx}px ${CERT_FONT}`;
  const words=String(text||'').split(/\s+/).filter(Boolean);
  const lines=[];
  let line='';

  for(const word of words){
    const test=line?line+' '+word:word;
    if(ctx.measureText(test).width<=maxWidth){
      line=test;
    }else{
      if(line) lines.push(line);
      line=word;
      if(lines.length>=maxLines-1) break;
    }
  }

  if(line && lines.length<maxLines) lines.push(line);
  return lines;
}

function formatCertificateDate(value){
  if(!value) return '';
  try{
    const d=new Date(value+'T00:00:00');
    const txt=new Intl.DateTimeFormat('id-ID',{
      weekday:'long',day:'numeric',month:'long',year:'numeric'
    }).format(d);
    return txt.charAt(0).toUpperCase()+txt.slice(1);
  }catch(e){
    return String(value);
  }
}

async function prepareCertificateQr(){
  preparedQrData=null;
  const c=certificateData || {};
  const verifyCode=c.verification_code || progress?.verification_code || '';
  if(!verifyCode) return null;

  const verify=new URL('verifikasi.html?id='+verifyCode,location.href).href;

  try{
    if(window.QRCode && typeof QRCode.toDataURL==='function'){
      preparedQrData=await QRCode.toDataURL(verify,{margin:1,width:320});
    }
  }catch(e){
    console.warn('QR gagal dibuat.',e);
    preparedQrData=null;
  }

  return preparedQrData;
}

async function prepareOfficialCertificate(){
  preparedCertificateJpeg=null;

  const c=certificateData || {};
  const recipient=c.recipient_name || progress?.participant_name || '';
  const certNumber=c.certificate_number || progress?.certificate_number || '';
  const eventName=c.event_name || progress?.event_name || '';
  const eventDate=c.event_date || progress?.event_date || '';
  const issuer=c.issuer || progress?.issuer || '';
  const taxpayerName=c.taxpayer_name || '';
  const signerName=c.signer_name || '';
  const signerTitle=c.signer_title || '';
  const verifyCode=c.verification_code || progress?.verification_code || '';

  if(!recipient || !certNumber || !verifyCode){
    throw new Error('Data sertifikat belum lengkap.');
  }

  if(document.fonts?.ready){
    try{
      await document.fonts.load('700 28px Montserrat');
      await document.fonts.load('800 57px Montserrat');
      await document.fonts.ready;
    }catch(e){
      console.warn('Font Montserrat belum siap, memakai fallback.',e);
    }
  }

  const bg=await loadImage(CERT_TEMPLATE_URL);
  await prepareCertificateQr();

  const canvas=document.createElement('canvas');
  canvas.width=1440;
  canvas.height=1018;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(bg,0,0,canvas.width,canvas.height);

  const navy='#012449';
  const gold='#c6912b';
  ctx.textBaseline='alphabetic';

  // Judul
  ctx.fillStyle=gold;
  ctx.font=`800 57px ${CERT_FONT}`;
  ctx.fillText('Sertifikat',CERT_POS.titleX,CERT_POS.titleY);

  // Nomor
  ctx.fillStyle=navy;
  ctx.font=`700 28px ${CERT_FONT}`;
  ctx.fillText('Nomor : '+certNumber,CERT_POS.numberX,CERT_POS.numberY);

  // Label penerima
  ctx.font=`700 27px ${CERT_FONT}`;
  ctx.fillText('diberikan kepada',CERT_POS.labelX,CERT_POS.labelY);

  // Nama penerima
  const nameSize=fitCanvasText(ctx,recipient,980,41,25,'700');
  ctx.font=`700 ${nameSize}px ${CERT_FONT}`;
  ctx.fillText(recipient,CERT_POS.nameX,CERT_POS.nameY);
  const nameW=Math.min(ctx.measureText(recipient).width,980);
  ctx.fillRect(CERT_POS.nameX,CERT_POS.nameY+5,nameW,2);

  // Nama WP / instansi
  const institution=(taxpayerName && taxpayerName.toLowerCase()!==recipient.toLowerCase())
    ? taxpayerName
    : '';
  if(institution){
    const instSize=fitCanvasText(ctx,institution,920,28,20,'700');
    ctx.font=`700 ${instSize}px ${CERT_FONT}`;
    ctx.fillText(institution,CERT_POS.institutionX,CERT_POS.institutionY);
  }

  // Detail sertifikat
  let detail='Sebagai Peserta dalam Kegiatan '+eventName;
  if(issuer) detail+=' yang diselenggarakan oleh '+issuer;

  let detailSize=21;
  let lines=wrapCanvasLines(ctx,detail,760,detailSize,'700',5);
  if(lines.length>=5 && detail.length>250){
    detailSize=19;
    lines=wrapCanvasLines(ctx,detail,760,detailSize,'700',6);
  }

  ctx.font=`700 ${detailSize}px ${CERT_FONT}`;
  const lineHeight=detailSize+10;
  lines.forEach((line,i)=>{
    ctx.fillText(line,CERT_POS.detailX,CERT_POS.detailY+i*lineHeight);
  });

  // Tanggal
  const formattedDate=formatCertificateDate(eventDate);
  if(formattedDate){
    const naturalY=CERT_POS.detailY+lines.length*lineHeight;
    ctx.font=`700 22px ${CERT_FONT}`;
    ctx.fillText('pada '+formattedDate,CERT_POS.dateX,Math.max(CERT_POS.dateY,naturalY));
  }

  // QR
  if(preparedQrData){
    try{
      const qrImg=await loadImage(preparedQrData);
      ctx.drawImage(qrImg,CERT_POS.qrX,CERT_POS.qrY,108,110);
    }catch(e){
      console.warn('QR tidak dapat ditempelkan.',e);
    }
  }

  // Penandatangan
  if(signerName || signerTitle){
    ctx.fillStyle='#000000';
    ctx.font=`700 12px ${CERT_FONT}`;
    ctx.fillText('Ditandatangani secara elektronik',CERT_POS.signerX,CERT_POS.signerY);

    ctx.fillStyle='#1b2952';

    if(signerName){
      const signerSize=fitCanvasText(ctx,signerName,610,23,18,'700');
      ctx.font=`700 ${signerSize}px ${CERT_FONT}`;
      ctx.fillText(signerName,CERT_POS.signerX,CERT_POS.signerY+29);
    }

    if(signerTitle){
      const titleSize=fitCanvasText(ctx,signerTitle,610,23,17,'700');
      ctx.font=`700 ${titleSize}px ${CERT_FONT}`;
      ctx.fillText(signerTitle,CERT_POS.signerX,CERT_POS.signerY+61);
    }
  }

  preparedCertificateJpeg=canvas.toDataURL('image/jpeg',0.94);
  return preparedCertificateJpeg;
}

async function renderCertificate(){
  steps(3);

  const c=certificateData || {};
  const recipient=c.recipient_name || progress?.participant_name || '';
  const certNumber=c.certificate_number || progress?.certificate_number || '';
  const verifyCode=c.verification_code || progress?.verification_code || '';

  $('content').innerHTML=`<div class="donebox">
    <span class="pill">Selesai ✓</span>
    <h2>Sertifikat Anda Terbit.</h2>
    <p class="muted">
      ${esc(recipient)}<br>
      <b>${esc(certNumber)}</b>
    </p>

    <div class="actions" style="justify-content:center;margin-top:18px">
      <button class="btn btn-yellow" id="pdfBtn" disabled>Menyiapkan Sertifikat...</button>
      <a class="btn btn-outline" target="_blank"
         href="verifikasi.html?id=${encodeURIComponent(verifyCode)}">
         Verifikasi Sertifikat
      </a>
    </div>

    <div id="pdfMsg" style="margin-top:12px;font-size:10px;color:#7a8591">
      Menyiapkan PDF dengan template sertifikat internal...
    </div>

    <div style="margin-top:7px;font-size:10px;color:#7a8591">
      Kode verifikasi: ${esc(verifyCode)}
    </div>
  </div>`;

  const pdfReady=await ensureJsPdf();

  if(!pdfReady){
    $('pdfBtn').disabled=true;
    $('pdfBtn').textContent='PDF belum siap';
    $('pdfMsg').textContent='Library PDF gagal dimuat. Silakan refresh halaman.';
    return;
  }

  try{
    await prepareOfficialCertificate();
    $('pdfBtn').disabled=false;
    $('pdfBtn').textContent='Unduh Sertifikat PDF';
    $('pdfMsg').textContent='PDF siap diunduh dengan desain sertifikat internal.';
    $('pdfBtn').onclick=downloadCertificate;
  }catch(e){
    console.error(e);
    $('pdfBtn').disabled=true;
    $('pdfBtn').textContent='PDF belum siap';
    $('pdfMsg').textContent='Gagal menyiapkan template sertifikat: '+e.message;
  }
}

function downloadCertificate(){
  try{
    if(!window.jspdf?.jsPDF){
      throw new Error('Library PDF belum termuat.');
    }
    if(!preparedCertificateJpeg){
      throw new Error('Sertifikat belum selesai disiapkan.');
    }

    const c=certificateData || {};
    const recipient=c.recipient_name || progress?.participant_name || 'sertifikat';

    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({
      orientation:'landscape',
      unit:'mm',
      format:'a4',
      compress:true
    });

    pdf.addImage(
      preparedCertificateJpeg,
      'JPEG',
      0,0,297,210,
      undefined,
      'FAST'
    );

    const safeName=recipient
      .replace(/[^a-z0-9]+/gi,'-')
      .replace(/^-+|-+$/g,'')
      .toLowerCase() || 'sertifikat';

    pdf.save('sertifikat-'+safeName+'.pdf');

    if($('pdfMsg')){
      $('pdfMsg').textContent='Perintah unduh sertifikat telah dikirim ke browser.';
    }
  }catch(e){
    console.error(e);
    err('Gagal mengunduh PDF: '+e.message);
    if($('pdfMsg')) $('pdfMsg').textContent='Gagal membuat PDF. '+e.message;
  }
}

init();
