<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabayan QR Generator - Supabase</title>
<style>
body{font-family:Arial;background:#f7f9fc;color:#17345f;padding:40px}
.container{max-width:1000px;margin:auto}
.card{background:white;border:1px solid #dbe5f2;border-radius:24px;padding:25px;margin-bottom:20px}
select,input{width:100%;padding:14px;border-radius:12px;border:1px solid #ccd6e5}
button{background:#ffc83d;border:0;border-radius:20px;padding:12px 20px;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.qr{min-height:300px;display:flex;align-items:center;justify-content:center}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="container">

<h1>Kabayan QR Form Generator</h1>
<p>Pilih kegiatan dari database Supabase.</p>

<div class="card">
<label>Kegiatan</label>
<select id="eventSelect">
<option>Memuat kegiatan...</option>
</select>

<button onclick="generateSelected()">Generate QR</button>
</div>

<div class="grid">

<div class="card">
<h2>Daftar Hadir + Pretest</h2>
<input id="link1" readonly>
<div class="qr" id="qr1"></div>
</div>

<div class="card">
<h2>Posttest + Evaluasi</h2>
<input id="link2" readonly>
<div class="qr" id="qr2"></div>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../library/qrcode.js"></script>
<script src="qr-supabase.js"></script>

</body>
</html>
