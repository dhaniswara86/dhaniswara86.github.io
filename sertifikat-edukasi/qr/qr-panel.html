<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabayan QR Form Generator</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f7f9fc;
    color:#17345f;
}
.container{
    max-width:1100px;
    margin:60px auto;
    padding:20px;
}
h1{
    font-size:36px;
}
.subtitle{
    color:#64748b;
    margin-bottom:30px;
}
.card{
    background:white;
    border:1px solid #dbe5f2;
    border-radius:24px;
    padding:28px;
    margin-bottom:25px;
}
.input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #cbd5e1;
    box-sizing:border-box;
    font-size:16px;
}
button{
    background:#ffc83d;
    border:none;
    padding:12px 22px;
    border-radius:999px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}
.qr-box{
    min-height:320px;
    display:flex;
    justify-content:center;
    align-items:center;
}
.qr-box canvas{
    max-width:100%;
}
.action{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}
.info{
    background:#eef5ff;
    padding:20px;
    border-radius:18px;
}
@media(max-width:800px){
.grid{
grid-template-columns:1fr;
}
}
</style>

</head>

<body>

<div class="container">

<h1>Kabayan QR Form Generator</h1>
<div class="subtitle">
Generate QR Code untuk Daftar Hadir, Pretest, Posttest, dan Evaluasi.
</div>


<div class="card">

<label>Kode Kegiatan</label>

<input id="eventCode"
class="input"
value="EDU-001">

<button onclick="generateAll()">
Generate QR
</button>

</div>



<div class="grid">


<div class="card">

<h2>01. Daftar Hadir + Pretest</h2>

<input id="link1" class="input" readonly>

<div class="qr-box" id="qr1"></div>

<div class="action">

<button onclick="downloadQR('qr1','Daftar-Hadir-Pretest')">
Download PNG
</button>

<button onclick="printQR('qr1','Daftar Hadir + Pretest')">
Cetak QR
</button>

<button onclick="copyLink('link1')">
Copy Link
</button>

</div>

</div>




<div class="card">

<h2>02. Posttest + Evaluasi</h2>

<input id="link2" class="input" readonly>

<div class="qr-box" id="qr2"></div>


<div class="action">

<button onclick="downloadQR('qr2','Posttest-Evaluasi')">
Download PNG
</button>

<button onclick="printQR('qr2','Posttest + Evaluasi')">
Cetak QR
</button>

<button onclick="copyLink('link2')">
Copy Link
</button>

</div>


</div>


</div>


<div class="info">
QR Sertifikat tidak dibuat di halaman ini.
QR Sertifikat dibuat otomatis ketika peserta memenuhi syarat penerbitan sertifikat.
</div>


</div>


<script src="../library/qrcode.js"></script>
<script src="qr-generator.js"></script>

</body>
</html>
