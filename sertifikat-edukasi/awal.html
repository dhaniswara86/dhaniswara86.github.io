<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tahap Awal Sertifikat Edukasi | Kabayan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#111318;--muted:#707985;--blue:#0a66ff;--navy:#102655;--yellow:#f7c948;--line:#dfe6ef;--bg:#f5f8fc;--green:#067647;--red:#b42318;--orange:#b54708}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,rgba(10,102,255,.07),transparent 28%),radial-gradient(circle at 95% 10%,rgba(247,201,72,.10),transparent 30%),#f7f9fc;letter-spacing:-.015em}
a{color:inherit}.wrap{width:min(1220px,calc(100% - 28px));margin:auto;padding:22px 0 44px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 18px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:850}.brand img{width:42px;height:34px;object-fit:contain}
.pill{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;background:#eef5ff;color:var(--blue);font-size:9px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}
.btn{min-height:42px;border:1px solid transparent;border-radius:999px;padding:10px 15px;font:inherit;font-size:12px;font-weight:760;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn-yellow{background:var(--yellow);color:#191919}.btn-blue{background:#111827;color:#fff}.btn-outline{background:#fff;border-color:#d9e2ec;color:#263649}.btn-red{background:#b42318;color:#fff}.btn-green{background:#067647;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 16px 38px rgba(20,42,70,.06)}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.field{display:grid;gap:6px}.field label{font-size:10px;font-weight:780;color:#77818c}.field input,.field textarea,.field select{width:100%;border:1px solid #dce3ea;border-radius:12px;padding:11px 12px;background:#fff;font:inherit;font-size:12px;outline:none}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#a8c7ef;box-shadow:0 0 0 4px rgba(10,102,255,.06)}
.msg{display:none;margin-top:10px;border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.5}.msg.show{display:block}.msg.ok{background:#ecfdf3;color:var(--green)}.msg.err{background:#fff1f0;color:var(--red)}
.tablewrap{overflow:auto;border:1px solid #e5eaf0;border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 12px;border-bottom:1px solid #eef1f4;text-align:left;font-size:10.5px;vertical-align:top}.table th{background:#f8fafc;color:#6f7b88;font-size:9px;letter-spacing:.06em;text-transform:uppercase}.table tr:last-child td{border-bottom:0}
.status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}.draft{background:#f2f4f7;color:#667085}.published{background:#ecfdf3;color:#067647}.closed{background:#fff1f0;color:#b42318}.phase-open{background:#ecfdf3;color:#067647}.phase-closed{background:#fff7ed;color:#b54708}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hero h1{margin:10px 0 8px;font-size:clamp(38px,5vw,72px);line-height:.94;letter-spacing:-.065em}.hero p{margin:0;max-width:760px;color:#717c88;line-height:1.65;font-size:14px}
.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid #dde5ee;background:#fff;padding:9px 12px;border-radius:999px;font:inherit;font-size:10px;font-weight:780;cursor:pointer}.tab.active{background:#111827;color:#fff;border-color:#111827}
.linkbox{padding:12px;border-radius:13px;background:#f6f8fb;border:1px solid #e3e8ef;font-size:10px;word-break:break-all}.section-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.section-title h2{margin:0;font-size:24px;letter-spacing:-.045em}.section-title p{margin:5px 0 0;color:#7a8490;font-size:11px}
@media(max-width:820px){.two,.three{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.wrap{width:min(100% - 18px,1220px)}}

.shell{width:min(900px,100%);margin:auto}.progress{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.step{padding:13px;border:1px solid #e0e7ef;border-radius:16px;background:#fff;opacity:.42}.step.active{opacity:1;border-color:#a9caf4;background:#f8fbff}.step.done{opacity:1;border-color:#cee7d7;background:#fbfffc}.step b{display:block;font-size:11px}.step span{display:block;margin-top:4px;color:#7a8591;font-size:9px}.question{padding:16px;border:1px solid #e5eaf0;border-radius:16px;background:#fff;margin-top:10px}.question h3{margin:0 0 12px;font-size:13px;line-height:1.45}.option{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:12px;background:#f8fafc;margin-top:7px;font-size:11px}.donebox{text-align:center;padding:30px}.donebox h2{font-size:36px;letter-spacing:-.05em;margin:12px 0}
</style></head>
<body><div class="wrap"><div class="shell">
<div class="topbar"><a class="brand" href="../index.html"><img src="assets/logo-kabayan.svg"><span>Kabayan / Tahap Awal</span></a></div>
<section class="hero"><span class="pill">Link 1</span><h1 id="eventTitle">Tahap Awal.</h1><p id="eventMeta">Daftar Hadir + Pretest</p></section>
<div class="progress"><div class="step active" id="s1"><b>01 Daftar Hadir</b><span>Identitas peserta</span></div><div class="step" id="s2"><b>02 Pretest</b><span>Evaluasi awal</span></div></div>
<div class="card" id="content"><div class="muted">Memuat...</div></div><div class="msg err" id="err"></div>
</div></div>
<script src="supabase-config.js"></script>
<script>
let sb=null,eventData=null,token=null,progress=null;const $=id=>document.getElementById(id),code=new URLSearchParams(location.search).get('kode')||'';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function err(t){$('err').textContent=t;$('err').className='msg show err'}
function steps(n){for(let i=1;i<=2;i++){const el=$('s'+i);el.classList.toggle('done',i<n);el.classList.toggle('active',i===n)}}
async function init(){try{if(!code)throw new Error('Kode kegiatan tidak tersedia.');sb=window.KabayanKegiatanSupabase.getClient();const {data,error}=await sb.rpc('public_get_external_event',{p_code:code});if(error)throw error;if(!data?.length)throw new Error('Kegiatan tidak ditemukan atau belum dipublish.');eventData=data[0];$('eventTitle').textContent=eventData.title;$('eventMeta').textContent=[eventData.event_date,eventData.issuer,'Daftar Hadir + Pretest'].filter(Boolean).join(' • ');if(!eventData.initial_phase_open)return renderClosed();token=localStorage.getItem('kabayan_edukasi_'+eventData.event_id)||null;if(token)await refresh();else renderAttendance()}catch(e){err(e.message);$('content').innerHTML='<div class="muted">Tidak dapat membuka tahap awal.</div>'}}
function renderClosed(){$('content').innerHTML='<div class="donebox"><span class="pill">Ditutup</span><h2>Tahap Awal Belum Dibuka.</h2><p class="muted">Silakan menunggu informasi dari panitia.</p></div>'}
function renderAttendance(){steps(1);$('content').innerHTML=`<span class="pill">Tahap 1</span><h2 style="font-size:30px;letter-spacing:-.045em;margin:14px 0 8px">Daftar Hadir</h2><p class="muted" style="font-size:11px">Gunakan email yang sama nanti saat membuka Link Akhir.</p><div class="grid two" style="margin-top:16px"><div class="field"><label>Nama lengkap</label><input id="pName"></div><div class="field"><label>Email</label><input id="pEmail" type="email"></div><div class="field"><label>Instansi / Nama WP</label><input id="pInstitution"></div><div class="field"><label>No. HP (opsional)</label><input id="pPhone"></div></div><button class="btn btn-yellow" id="attendanceBtn" style="margin-top:14px">Simpan & Lanjut Pretest →</button>`;$('attendanceBtn').onclick=submitAttendance}
async function submitAttendance(){try{const name=$('pName').value.trim(),email=$('pEmail').value.trim();if(!name||!email)throw new Error('Nama dan email wajib diisi.');const {data,error}=await sb.rpc('public_start_external_participant',{p_event_code:code,p_name:name,p_email:email,p_institution:$('pInstitution').value.trim()||null,p_phone:$('pPhone').value.trim()||null});if(error)throw error;token=data;localStorage.setItem('kabayan_edukasi_'+eventData.event_id,token);await refresh()}catch(e){err(e.message)}}
async function refresh(){const {data,error}=await sb.rpc('public_get_external_progress',{p_token:token});if(error)throw error;if(!data?.length){localStorage.removeItem('kabayan_edukasi_'+eventData.event_id);return renderAttendance()}progress=data[0];if(progress.pretest_required&&!progress.pretest_completed)return loadPretest();renderDone()}
async function loadPretest(){try{steps(2);const {data,error}=await sb.rpc('public_get_external_questions',{p_token:token,p_test_type:'pretest'});if(error)throw error;if(!data?.length)throw new Error('Pretest belum tersedia. Hubungi panitia.');$('content').innerHTML=`<span class="pill">Tahap 2</span><h2 style="font-size:30px;letter-spacing:-.045em;margin:14px 0 8px">Pretest</h2><p class="muted" style="font-size:11px">Jawab seluruh soal untuk menyelesaikan Tahap Awal.</p><form id="testForm">${data.map((q,i)=>`<div class="question"><h3>${i+1}. ${esc(q.question_text)}</h3>${[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].map(o=>`<label class="option"><input type="radio" name="q_${q.id}" value="${o[0]}"> <span><b>${o[0]}.</b> ${esc(o[1])}</span></label>`).join('')}</div>`).join('')}<button class="btn btn-yellow" style="margin-top:15px">Kirim Pretest</button></form>`;$('testForm').onsubmit=e=>submitTest(e,data)}catch(e){err(e.message)}}
async function submitTest(e,questions){e.preventDefault();try{const ans={};for(const q of questions){const v=document.querySelector(`input[name="q_${q.id}"]:checked`)?.value;if(!v)throw new Error('Semua soal wajib dijawab.');ans[q.id]=v}const {error}=await sb.rpc('public_submit_external_test',{p_token:token,p_test_type:'pretest',p_answers:ans});if(error)throw error;await refresh()}catch(e){err(e.message)}}
function renderDone(){steps(3);$('content').innerHTML=`<div class="donebox"><span class="pill">Tahap Awal Selesai ✓</span><h2>Terima Kasih.</h2><p class="muted">Daftar hadir dan Pretest Anda telah selesai.<br><br><b>Posttest, Evaluasi, dan Sertifikat tidak tersedia pada link ini.</b><br>Link Tahap Akhir akan diberikan oleh panitia setelah kegiatan selesai.</p></div>`}
init();
</script></body></html>
