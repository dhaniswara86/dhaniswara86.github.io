<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifikasi Sertifikat Kegiatan | Kabayan</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#111318;--muted:#707985;--blue:#0a66ff;--navy:#102655;--yellow:#f7c948;--line:#dfe6ef;--bg:#f5f8fc;--green:#067647;--red:#b42318}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,rgba(10,102,255,.07),transparent 28%),radial-gradient(circle at 95% 10%,rgba(247,201,72,.10),transparent 30%),#f7f9fc;letter-spacing:-.015em}
a{color:inherit}.wrap{width:min(1220px,calc(100% - 28px));margin:auto;padding:22px 0 44px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 18px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:850}.brand img{width:42px;height:34px;object-fit:contain}.pill{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;background:#eef5ff;color:var(--blue);font-size:9px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.btn{min-height:42px;border:1px solid transparent;border-radius:999px;padding:10px 15px;font:inherit;font-size:12px;font-weight:760;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn-yellow{background:var(--yellow);color:#191919}.btn-blue{background:#111827;color:#fff}.btn-outline{background:#fff;border-color:#d9e2ec;color:#263649}.btn-red{background:#b42318;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 16px 38px rgba(20,42,70,.06)}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.two{grid-template-columns:1fr 1fr}.field{display:grid;gap:6px}.field label{font-size:10px;font-weight:780;color:#77818c}.field input,.field textarea,.field select{width:100%;border:1px solid #dce3ea;border-radius:12px;padding:11px 12px;background:#fff;font:inherit;font-size:12px;outline:none}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#a8c7ef;box-shadow:0 0 0 4px rgba(10,102,255,.06)}.msg{display:none;margin-top:10px;border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.5}.msg.show{display:block}.msg.ok{background:#ecfdf3;color:var(--green)}.msg.err{background:#fff1f0;color:var(--red)}.tablewrap{overflow:auto;border:1px solid #e5eaf0;border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 12px;border-bottom:1px solid #eef1f4;text-align:left;font-size:10.5px;vertical-align:top}.table th{background:#f8fafc;color:#6f7b88;font-size:9px;letter-spacing:.06em;text-transform:uppercase}.table tr:last-child td{border-bottom:0}.status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}.draft{background:#f2f4f7;color:#667085}.published{background:#ecfdf3;color:#067647}.closed{background:#fff1f0;color:#b42318}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hero h1{margin:10px 0 8px;font-size:clamp(38px,5vw,72px);line-height:.94;letter-spacing:-.065em}.hero p{margin:0;max-width:680px;color:#717c88;line-height:1.65;font-size:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid #dde5ee;background:#fff;padding:9px 12px;border-radius:999px;font:inherit;font-size:10px;font-weight:780;cursor:pointer}.tab.active{background:#111827;color:#fff;border-color:#111827}@media(max-width:820px){.two{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.wrap{width:min(100% - 18px,1220px)}} 
.verify{width:min(680px,100%);margin:55px auto}.big{font-size:46px;line-height:.95;letter-spacing:-.055em;margin:15px 0}.rows{display:grid;gap:8px;margin-top:18px}.row{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #eef1f4;font-size:11px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="topbar"><a class="brand" href="../index.html"><img src="assets/logo-kabayan.svg"><span>Kabayan / Verifikasi</span></a></div><div class="verify card" id="box"><div class="muted">Memeriksa sertifikat...</div></div></div><script src="supabase-config.js"></script><script>
const code=new URLSearchParams(location.search).get('id')||'';const box=document.getElementById('box');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
(async()=>{try{if(!code)throw new Error('Kode verifikasi tidak tersedia.');const sb=window.KabayanKegiatanSupabase.getClient();const {data,error}=await sb.rpc('public_verify_external_certificate',{p_code:code});if(error)throw error;if(!data?.length){box.innerHTML='<span class="pill">Tidak ditemukan</span><h1 class="big">Sertifikat tidak ditemukan.</h1><p class="muted">Periksa kembali QR atau tautan verifikasi.</p>';return}const c=data[0],valid=c.status==='valid';box.innerHTML=`<span class="pill">${valid?'VALID':'DIBATALKAN'}</span><h1 class="big">${valid?'Sertifikat Valid.':'Sertifikat Dibatalkan.'}</h1><div class="rows"><div class="row"><b>Nomor</b><span>${esc(c.certificate_number)}</span></div><div class="row"><b>Nama</b><span>${esc(c.recipient_name)}</span></div><div class="row"><b>Kegiatan</b><span>${esc(c.event_name)}</span></div><div class="row"><b>Tanggal</b><span>${esc(c.event_date||'-')}</span></div><div class="row"><b>Penerbit</b><span>${esc(c.issuer||'-')}</span></div></div>`}catch(e){box.innerHTML=`<span class="pill">Error</span><h1 class="big">Verifikasi gagal.</h1><p class="muted">${esc(e.message)}</p>`}})();
</script></body></html>
