<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Kabayan by Angga Sukma Dhaniswara menyediakan buku digital, formulir, aplikasi, kalkulator, converter, dan materi pembelajaran perpajakan." />
<meta name="author" content="Angga Sukma Dhaniswara" />
<meta property="og:title" content="Kabayan by Angga Sukma Dhaniswara" />
<meta property="og:description" content="Buku, formulir, aplikasi, template, dan artikel perpajakan dalam satu tempat yang praktis dan gratis." />
<meta property="og:url" content="https://dhaniswara86.id/" />
<meta property="og:type" content="website" />
<link rel="canonical" href="https://dhaniswara86.id/" />
<title>Kabayan by Angga Sukma Dhaniswara</title>

<!--
  Bazil-inspired typography.
  Headline memakai Roboto Condensed Black, dipadukan dengan Roboto Condensed
  untuk navigasi/body. Keduanya disajikan melalui Google Fonts agar hasil
  deployment konsisten lintas perangkat.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

<style>
:root {
  --paper: #ffffff;
  --ink: #141414;
  --muted: #5d5d5d;
  --hairline: rgba(20, 20, 20, 0.18);
  --blue: #0b84ff;
  --yellow: #ffad19;
  --pink: #ff3c76;
  --brand-blue: #0046f3;
  --header-h: 118px;
  --page-x: clamp(24px, 3vw, 54px);
  --ease: cubic-bezier(.22,1,.36,1);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { background: var(--paper); }
body {
  min-width: 320px;
  overflow-x: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: "Roboto Condensed", "Arial Narrow", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}
body.menu-open { overflow: hidden; }
a { color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; }

/* =========================================================
   HEADER — logo kiri, menu asli Kabayan di kanan
   ========================================================= */
.site-header {
  position: fixed;
  z-index: 100;
  top: 0;
  right: 0;
  left: 0;
  height: var(--header-h);
  background: #ffffff;
}
.header-inner {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 36px;
  padding: 27px var(--page-x) 0;
}

.kabayan-logo {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  align-items: flex-start;
  color: var(--ink);
  text-decoration: none;
  line-height: .78;
}
.kabayan-logo-word {
  font-size: clamp(42px, 3.5vw, 61px);
  font-weight: 900;
  letter-spacing: -0.075em;
}
.logo-accent {
  position: absolute;
  pointer-events: none;
}
.logo-accent.blue {
  top: 8px;
  right: -12px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--blue);
}
.logo-accent.pink {
  right: -18px;
  bottom: -2px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--pink);
}
.logo-accent.yellow {
  top: -11px;
  left: 7px;
  width: 18px;
  height: 8px;
  border: 2px solid var(--yellow);
  border-radius: 999px;
}
.logo-accent.yellow::after {
  position: absolute;
  top: -2px;
  left: 9px;
  width: 18px;
  height: 8px;
  border: 2px solid var(--yellow);
  border-radius: 999px;
  content: "";
}

.desktop-nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: clamp(18px, 2.4vw, 38px);
  margin-top: 10px;
}
.desktop-nav a {
  position: relative;
  padding: 7px 0 8px;
  color: #262626;
  font-size: clamp(14px, 1.16vw, 18px);
  font-weight: 300;
  letter-spacing: -0.015em;
  text-decoration: none;
  white-space: nowrap;
}
.desktop-nav a::after {
  position: absolute;
  right: 0;
  bottom: 1px;
  left: 0;
  height: 1.5px;
  background: var(--ink);
  content: "";
  transform: scaleX(0);
  transform-origin: right center;
  transition: transform .3s var(--ease);
}
.desktop-nav a:hover::after,
.desktop-nav a:focus-visible::after,
.desktop-nav a[aria-current="page"]::after {
  transform: scaleX(1);
  transform-origin: left center;
}
.desktop-nav .hotnews-link { font-weight: 500; }
.desktop-nav .hotnews-link::before {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin: 0 5px 2px 0;
  border-radius: 50%;
  background: var(--pink);
  content: "";
}

.nav-cta {
  min-width: 130px;
  min-height: 48px;
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
  margin-left: 3px;
  padding: 10px 22px !important;
  border: 1px solid var(--ink);
  border-radius: 3px;
  background: var(--ink);
  color: #fff !important;
  font-weight: 300 !important;
  transition: background .22s ease, color .22s ease;
}
.nav-cta::after { display: none; }
.nav-cta:hover { background: #fff; color: var(--ink) !important; }

.mobile-toggle {
  width: 44px;
  height: 44px;
  display: none;
  place-items: center;
  margin-top: 2px;
  padding: 0;
  border: 1px solid var(--ink);
  border-radius: 50%;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
  font-size: 22px;
  line-height: 1;
}
.mobile-menu {
  position: fixed;
  z-index: 90;
  inset: 0;
  display: none;
  padding: calc(var(--header-h) + 28px) 28px 32px;
  background: #fff;
}
.mobile-menu.open { display: block; }
.mobile-menu a {
  display: block;
  padding: 4px 0;
  font-size: clamp(40px, 12vw, 66px);
  font-weight: 800;
  letter-spacing: -0.055em;
  line-height: .98;
  text-decoration: none;
}
.mobile-menu a:last-child { margin-top: 22px; color: var(--pink); }

/* =========================================================
   ONE-SCREEN HERO — tidak ada section bawah
   ========================================================= */
.hero {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  background: #ffffff;
  isolation: isolate;
}
.hero-inner {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  padding: var(--header-h) var(--page-x) 28px;
}

.hero-intro {
  position: absolute;
  z-index: 5;
  top: clamp(145px, 18vh, 198px);
  left: 50%;
  margin: 0;
  color: #333;
  font-size: clamp(18px, 1.55vw, 25px);
  font-weight: 300;
  letter-spacing: -0.025em;
  transform: translateX(-50%);
  white-space: nowrap;
}
.hero-intro strong { font-weight: 500; }

.headline {
  position: absolute;
  z-index: 2;
  top: 48.5%;
  left: 50%;
  width: min(1260px, calc(100vw - 76px));
  display: flex;
  align-items: center;
  flex-direction: column;
  justify-content: center;
  transform: translate(-50%, -47%);
}
.headline-line {
  position: relative;
  width: max-content;
  max-width: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: "Roboto Condensed", "Arial Narrow", Arial, sans-serif;
  font-size: clamp(102px, 13.1vw, 216px);
  font-weight: 900;
  letter-spacing: -0.075em;
  line-height: .80;
  text-align: center;
  cursor: default;
  transition: color .32s var(--ease), -webkit-text-stroke-color .32s var(--ease), opacity .32s var(--ease);
}
.headline-line.secondary {
  font-size: clamp(82px, 10.7vw, 176px);
}

/* state default: atas solid, bawah outline */
.headline[data-active="primary"] .primary {
  color: var(--ink);
  -webkit-text-stroke: 0 transparent;
}
.headline[data-active="primary"] .secondary {
  color: transparent;
  -webkit-text-stroke: clamp(1px, .095vw, 1.6px) var(--ink);
}
/* state kedua seperti interaksi Bazil */
.headline[data-active="secondary"] .primary {
  color: transparent;
  -webkit-text-stroke: clamp(1px, .095vw, 1.6px) var(--ink);
}
.headline[data-active="secondary"] .secondary {
  color: var(--ink);
  -webkit-text-stroke: 0 transparent;
}

.hero-side-note {
  position: absolute;
  z-index: 5;
  left: max(var(--page-x), calc(50% - 565px));
  bottom: clamp(132px, 16.5vh, 185px);
  margin: 0;
  color: #333;
  font-size: clamp(17px, 1.45vw, 24px);
  font-weight: 300;
  letter-spacing: -0.028em;
}

.category-signature {
  position: absolute;
  z-index: 2;
  right: max(var(--page-x), calc(50% - 565px));
  bottom: clamp(140px, 17vh, 192px);
  display: flex;
  align-items: center;
  gap: 17px;
  color: #8b8b8b;
  font-size: clamp(10px, .75vw, 12px);
  font-weight: 600;
  letter-spacing: .02em;
  text-transform: uppercase;
}
.category-signature span { opacity: .82; }

/* =========================================================
   GEDUNG SATE — inline vector, monochrome, foreground hero
   ========================================================= */
.gedung-sate-wrap {
  position: absolute;
  z-index: 4;
  bottom: -64px;
  left: 50%;
  width: clamp(350px, 30vw, 500px);
  max-height: 84vh;
  pointer-events: none;
  transform: translateX(-50%);
  transition: transform .5s var(--ease);
  will-change: transform;
}
.gedung-sate {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
  filter: drop-shadow(0 20px 19px rgba(0,0,0,.06));
}
.gedung-sate .shade { fill: #efefef; }
.gedung-sate .shade-2 { fill: #dcdcdc; }
.gedung-sate .white { fill: #fafafa; }
.gedung-sate .ink { fill: #202020; }
.gedung-sate .stroke { stroke: #9a9a9a; stroke-width: 1.5; }
.gedung-sate .window { fill: #7d7d7d; opacity: .78; }
.gedung-sate .line { stroke: #b8b8b8; stroke-width: 1.15; fill: none; }
.kabayan-character {
  width: 100%;
  height: auto;
  max-height: 84vh;
  display: block;
  object-fit: contain;
  object-position: center bottom;
  filter: drop-shadow(0 18px 16px rgba(0,0,0,.045));
}


.explore-orb {
  position: absolute;
  z-index: 7;
  top: 55%;
  left: 50%;
  width: clamp(48px, 4.25vw, 67px);
  height: clamp(48px, 4.25vw, 67px);
  display: grid;
  place-items: center;
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  background: #fff;
  color: var(--ink);
  box-shadow: 0 8px 18px rgba(0,0,0,.12);
  font-size: clamp(23px, 2vw, 31px);
  text-decoration: none;
  transform: translate(-50%, -50%);
  transition: transform .25s var(--ease), background .2s ease, color .2s ease;
}
.explore-orb:hover,
.explore-orb:focus-visible {
  background: var(--ink);
  color: #fff;
  transform: translate(-50%, -50%) rotate(45deg) scale(1.06);
}

.hero-actions {
  position: absolute;
  z-index: 8;
  bottom: clamp(28px, 3.5vh, 43px);
  left: 50%;
  display: flex;
  align-items: center;
  gap: 14px;
  transform: translateX(-50%);
}
.hero-button {
  min-height: 47px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px clamp(18px, 1.7vw, 25px);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  font-size: clamp(14px, 1.02vw, 17px);
  font-weight: 300;
  letter-spacing: -0.018em;
  text-decoration: none;
  white-space: nowrap;
  transition: background .22s ease, color .22s ease, transform .22s ease;
}
.hero-button.primary { background: var(--ink); color: #fff; }
.hero-button.secondary { background: #fff; color: var(--ink); }
.hero-button:hover { transform: translateY(-2px); }
.hero-button.primary:hover { background: #fff; color: var(--ink); }
.hero-button.secondary:hover { background: var(--ink); color: #fff; }

/* small color detail, tetap jauh lebih restrained dari desain sebelumnya */
.corner-mark {
  position: absolute;
  z-index: 1;
  right: var(--page-x);
  bottom: 27px;
  display: flex;
  gap: 5px;
}
.corner-mark i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.corner-mark i:nth-child(1) { background: var(--yellow); }
.corner-mark i:nth-child(2) { background: var(--blue); }
.corner-mark i:nth-child(3) { background: var(--pink); }

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 1200px) {
  :root { --header-h: 102px; }
  .desktop-nav { gap: 18px; }
  .desktop-nav a { font-size: 14px; }
  .nav-cta { min-width: 108px; min-height: 42px; padding-inline: 16px !important; }
  .hero-intro { top: 134px; }
  .headline { width: calc(100vw - 54px); transform: translate(-50%, -46%); }
  .gedung-sate-wrap { width: clamp(330px, 31vw, 470px); bottom: -54px; }
}

@media (max-width: 960px) {
  :root { --header-h: 88px; }
  .header-inner { align-items: center; padding-top: 0; }
  .kabayan-logo-word { font-size: 45px; }
  .desktop-nav { display: none; }
  .mobile-toggle { display: grid; }
  .hero-intro { top: 122px; font-size: 18px; }
  .headline {
    top: 46%;
    width: calc(100vw - 36px);
    transform: translate(-50%, -50%);
  }
  .headline-line { font-size: clamp(78px, 15.5vw, 146px); }
  .headline-line.secondary { font-size: clamp(64px, 12.8vw, 122px); }
  .gedung-sate-wrap { bottom: -28px; width: clamp(310px, 43vw, 430px); }
  .hero-side-note { bottom: 115px; left: 26px; font-size: 17px; }
  .category-signature { display: none; }
}

@media (max-width: 680px) {
  :root { --header-h: 78px; --page-x: 18px; }
  .header-inner { padding-inline: 20px; }
  .kabayan-logo-word { font-size: 38px; }
  .logo-accent.blue { top: 5px; right: -9px; width: 6px; height: 6px; }
  .logo-accent.pink { right: -13px; width: 8px; height: 8px; }
  .logo-accent.yellow { top: -8px; transform: scale(.72); transform-origin: left bottom; }
  .mobile-toggle { width: 40px; height: 40px; font-size: 19px; }

  .hero-inner { padding-inline: 14px; }
  .hero-intro {
    top: 105px;
    width: calc(100% - 32px);
    font-size: 16px;
    text-align: center;
    white-space: normal;
  }
  .headline {
    top: 36%;
    width: calc(100vw - 18px);
    transform: translate(-50%, -50%);
  }
  .headline-line {
    font-size: clamp(64px, 19vw, 104px);
    letter-spacing: -0.07em;
    line-height: .84;
  }
  .headline-line.secondary { font-size: clamp(51px, 15.1vw, 82px); }
  .gedung-sate-wrap {
    bottom: 62px;
    width: min(330px, 72vw);
    max-height: 61vh;
  }
  .kabayan-character { max-height: 61vh; }
  .explore-orb { top: 58%; }
  .hero-side-note {
    right: 18px;
    bottom: 160px;
    left: 18px;
    font-size: 14px;
    text-align: center;
  }
  .hero-actions {
    right: 14px;
    bottom: 24px;
    left: 14px;
    gap: 8px;
    transform: none;
  }
  .hero-button { flex: 1; min-height: 44px; padding-inline: 10px; font-size: 13px; }
  .corner-mark { display: none; }
}

@media (max-width: 420px) {
  .headline { top: 33%; }
  .headline-line { font-size: 62px; }
  .headline-line.secondary { font-size: 49px; }
  .gedung-sate-wrap { bottom: 68px; width: 78vw; }
  .hero-side-note { bottom: 154px; font-size: 13px; }
  .hero-button { font-size: 12px; }
}

@media (max-height: 720px) and (min-width: 681px) {
  :root { --header-h: 86px; }
  .header-inner { align-items: center; padding-top: 0; }
  .hero-intro { top: 100px; font-size: 16px; }
  .headline { top: 43%; }
  .headline-line { font-size: clamp(84px, 11.2vw, 148px); }
  .headline-line.secondary { font-size: clamp(68px, 9.2vw, 122px); }
  .gedung-sate-wrap { bottom: -62px; width: clamp(300px, 27vw, 410px); }
  .hero-side-note { bottom: 96px; }
  .category-signature { bottom: 104px; }
  .hero-actions { bottom: 18px; }
}


/* =========================================================
   Penyesuaian akhir hero Kabayan
   ========================================================= */
.kabayan-logo {
  line-height: 1;
  align-items: center;
}
.kabayan-logo-image {
  width: clamp(58px, 4.8vw, 78px);
  height: auto;
  display: block;
  object-fit: contain;
}
.kabayan-logo-word,
.logo-accent { display: none !important; }

/* Headline memakai warna biru yang diturunkan dari logo Kabayan. */
.headline[data-active="primary"] .primary {
  color: var(--brand-blue);
}
.headline[data-active="primary"] .secondary {
  color: transparent;
  -webkit-text-stroke-color: var(--brand-blue);
}
.headline[data-active="secondary"] .primary {
  color: transparent;
  -webkit-text-stroke-color: var(--brand-blue);
}
.headline[data-active="secondary"] .secondary {
  color: var(--brand-blue);
}

/* Karakter dinaikkan agar panah punya ruang sendiri di bawahnya. */
.gedung-sate-wrap {
  bottom: clamp(128px, 13.5vh, 154px);
  width: clamp(350px, 30vw, 500px);
}

/* Panah berada di bawah karakter, tidak lagi menimpa badan Kabayan. */
.explore-orb {
  top: auto;
  bottom: clamp(64px, 7.2vh, 82px);
  transform: translateX(-50%);
}
.explore-orb:hover,
.explore-orb:focus-visible {
  transform: translateX(-50%) rotate(45deg) scale(1.06);
}

/* Karena hanya satu CTA yang tersisa, tombol dibuat lebih ringkas. */
.hero-actions { bottom: 18px; }

@media (max-width: 1200px) {
  .gedung-sate-wrap { bottom: 128px; width: clamp(330px, 31vw, 470px); }
  .explore-orb { bottom: 68px; }
}

@media (max-width: 960px) {
  .kabayan-logo-image { width: 58px; }
  .gedung-sate-wrap { bottom: 126px; width: clamp(310px, 43vw, 430px); }
  .explore-orb { bottom: 66px; }
}

@media (max-width: 680px) {
  .kabayan-logo-image { width: 48px; }
  .gedung-sate-wrap {
    bottom: 142px;
    width: min(330px, 72vw);
  }
  .explore-orb { top: auto; bottom: 78px; }
  .hero-actions { bottom: 18px; }
}

@media (max-width: 420px) {
  .kabayan-logo-image { width: 44px; }
  .gedung-sate-wrap { bottom: 142px; width: 76vw; }
  .explore-orb { bottom: 78px; }
}

@media (max-height: 720px) and (min-width: 681px) {
  .gedung-sate-wrap { bottom: 110px; width: clamp(290px, 25vw, 390px); }
  .explore-orb { bottom: 52px; }
  .hero-actions { bottom: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="kabayan-logo" href="index.html" aria-label="Kabayan — Beranda">
      <img class="kabayan-logo-image" src="assets/img/kabayan-logo.png" alt="Logo Kabayan" />
    </a>

    <nav class="desktop-nav" aria-label="Navigasi utama">
      <a href="index.html" aria-current="page">Beranda</a>
      <a href="buku.html">Buku</a>
      <a href="formulir.html">Formulir</a>
      <a href="aplikasi.html">Aplikasi</a>
      <a href="kalkulator.html">Kalkulator</a>
      <a href="artikel.html">Artikel</a>
      <a class="hotnews-link" href="hotnews.html">Hot News</a>
      <a class="nav-cta" href="jelajahi.html">Jelajahi</a>
    </nav>

    <button class="mobile-toggle" id="mobileToggle" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="mobileMenu">☰</button>
  </div>
</header>

<nav class="mobile-menu" id="mobileMenu" aria-label="Navigasi mobile">
  <a href="index.html">Beranda</a>
  <a href="buku.html">Buku</a>
  <a href="formulir.html">Formulir</a>
  <a href="aplikasi.html">Aplikasi</a>
  <a href="kalkulator.html">Kalkulator</a>
  <a href="artikel.html">Artikel</a>
  <a href="hotnews.html">Hot News</a>
</nav>

<main>
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-inner">
<div class="headline" id="heroHeadline" data-active="primary">
        <h1 class="headline-line primary" id="hero-title" data-headline-state="primary">Katalog.</h1>
        <div class="headline-line secondary" data-headline-state="secondary" aria-label="Bahan Pelayanan">Bahan Pelayanan.</div>
      </div>
<div class="gedung-sate-wrap" id="gedungSateWrap" aria-hidden="true">
        <img class="kabayan-character" src="assets/img/kabayan-character.png" alt="Karakter Kabayan" />
      </div>

      <a class="explore-orb" href="jelajahi.html" aria-label="Jelajahi Kabayan">↗</a>

      <div class="hero-actions" aria-label="Aksi utama">
        <a class="hero-button primary" id="primaryHeroAction" href="jelajahi.html">Jelajahi Kabayan</a>
</div>

      <div class="corner-mark" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const headline = document.getElementById("heroHeadline");
  const headlineParts = headline ? [...headline.querySelectorAll("[data-headline-state]")] : [];
  const primaryAction = document.getElementById("primaryHeroAction");
  const character = document.getElementById("gedungSateWrap");
  const mobileToggle = document.getElementById("mobileToggle");
  const mobileMenu = document.getElementById("mobileMenu");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  function setHeadlineState(state) {
    if (!headline) return;
    headline.dataset.active = state === "secondary" ? "secondary" : "primary";
  }

  headlineParts.forEach((part) => {
    part.addEventListener("mouseenter", () => setHeadlineState(part.dataset.headlineState));
  });

  if (headline) {
    headline.addEventListener("mouseleave", () => setHeadlineState("primary"));
  }

  if (primaryAction) {
    primaryAction.addEventListener("mouseenter", () => setHeadlineState("primary"));
    primaryAction.addEventListener("focus", () => setHeadlineState("primary"));
  }

  /* Subtle pointer parallax pada karakter Kabayan, seperti feel interaktif Bazil. */
  if (character && !reduceMotion.matches && window.matchMedia("(pointer:fine)").matches) {
    window.addEventListener("pointermove", (event) => {
      const x = (event.clientX / window.innerWidth - .5) * 8;
      const y = (event.clientY / window.innerHeight - .5) * 5;
      character.style.transform = `translateX(calc(-50% + ${x.toFixed(2)}px)) translateY(${y.toFixed(2)}px)`;
    }, { passive: true });
  }

  if (mobileToggle && mobileMenu) {
    mobileToggle.addEventListener("click", () => {
      const isOpen = mobileMenu.classList.toggle("open");
      document.body.classList.toggle("menu-open", isOpen);
      mobileToggle.setAttribute("aria-expanded", String(isOpen));
      mobileToggle.setAttribute("aria-label", isOpen ? "Tutup menu" : "Buka menu");
      mobileToggle.textContent = isOpen ? "×" : "☰";
    });

    mobileMenu.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => {
        mobileMenu.classList.remove("open");
        document.body.classList.remove("menu-open");
        mobileToggle.setAttribute("aria-expanded", "false");
        mobileToggle.setAttribute("aria-label", "Buka menu");
        mobileToggle.textContent = "☰";
      });
    });
  }
})();
</script>
</body>
</html>
