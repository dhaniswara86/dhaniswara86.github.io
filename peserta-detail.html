<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Peserta | Kabayan Learning</title>
<link rel="stylesheet" href="assets/css/peserta-detail.css">
</head>

<body>

<header class="nav">
<div class="brand">◼ dhaniswara86</div>
<a href="evaluasi-dashboard.html">Dashboard Pengajar</a>
</header>

<main class="container">

<a class="back" href="evaluasi-dashboard.html">← Kembali ke dashboard</a>

<section class="hero">
<p>Kabayan Learning</p>
<h1 id="participant-name">Detail Peserta</h1>
<span id="class-name">Memuat kelas...</span>
</section>


<section class="summary-grid">

<div class="card">
<small>Progress</small>
<strong id="progress">-</strong>
<p id="progress-detail"></p>
</div>

<div class="card">
<small>Nilai rata-rata</small>
<strong id="average-score">-</strong>
<p>Hasil evaluasi</p>
</div>

<div class="card">
<small>Status</small>
<strong id="status">-</strong>
<p id="status-detail"></p>
</div>

</section>


<section class="panel">

<h2>Perjalanan Belajar</h2>
<div id="learning-progress">
Memuat...
</div>

</section>


<section class="panel">

<h2>Riwayat Evaluasi</h2>
<div id="history">
Memuat...
</div>

</section>


<section class="panel">

<h2>Insight Pengajar</h2>
<div id="insight">
Memuat...
</div>

</section>


<div class="action-panel">

<a class="action-button"
href="report.html?id=">
Download Laporan Belajar
</a>

<a class="action-button"
href="sertifikat.html?id=">
Cetak Sertifikat
</a>

</div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/kabayan-supabase-config.js"></script>
<script src="assets/js/dashboard-detail.js"></script>


<script>
document.addEventListener("DOMContentLoaded", function(){

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    document.querySelectorAll(".action-button")
    .forEach(function(btn){

        const url = new URL(btn.href);

        url.searchParams.set("id", id);

        btn.href = url.toString();

    });

});
</script>

</body>
</html>
