<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/kabayan-supabase-config.js"></script>

<script src="assets/js/dashboard-detail.js"></script>

<script src="assets/js/participant-action.js"></script>

<script src="assets/js/certificate-publish.js"></script>



<script>

document.addEventListener(
"DOMContentLoaded",
async function(){


const button =
document.getElementById(
"certificateButton"
);


if(!button)
return;



const params =
new URLSearchParams(
window.location.search
);



const participantId =
params.get("id");



if(!participantId)
return;



const client =
window.supabaseClient ||
supabase.createClient(

window.KABAYAN_SUPABASE_CONFIG.url,

window.KABAYAN_SUPABASE_CONFIG.publishableKey

);




const {
data,
error
}
=
await client

.from(
"certificate_records"
)

.select("id")

.eq(
"participant_id",
participantId
)

.maybeSingle();




if(error){

console.error(
"Certificate check:",
error
);

return;

}




if(data){


button.style.display =
"inline-flex";


button.href =
"sertifikat.html?id="
+
data.id;


}


});


</script>
