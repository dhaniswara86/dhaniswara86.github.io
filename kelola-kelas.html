<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Kelas | Kabayan Learning</title>
<link rel="stylesheet" href="assets/css/kelola-kelas.css">
</head>

<body>

<header class="header">
<div class="logo">Kabayan Learning</div>
<a href="ruang-belajar.html">Ruang Belajar</a>
</header>


<main class="container">

<section class="hero">

<p class="eyebrow">KELAS</p>

<h1 id="class-name">
Memuat kelas...
</h1>

<p id="class-description">
Kelola peserta, evaluasi, dan perkembangan pembelajaran.
</p>

<div class="class-code">
<span>Kode Kelas</span>
<strong id="class-code">-</strong>
</div>

</section>



<section class="stats">

<div>
<strong id="total-student">—</strong>
<span>Peserta</span>
</div>

<div>
<strong id="total-checkpoint">—</strong>
<span>Checkpoint</span>
</div>

<div>
<strong id="completed">—</strong>
<span>Selesai</span>
</div>

</section>



<section class="action-section">

<h2>Peserta Kelas</h2>

<p>
Kelola peserta yang mengikuti program pembelajaran ini.
</p>

<button>
+ Tambah Peserta
</button>

</section>



<section>

<h2>Daftar Peserta</h2>

<div id="participants" class="participant-list">
Memuat peserta...
</div>

</section>



</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/kabayan-supabase-config.js"></script>
<script src="assets/js/kelola-kelas.js"></script>

</body>
</html>
