<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — Kabayan Learning</title>
  <link rel="stylesheet" href="assets/css/lms.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-art">
      <div class="brand">Kabayan <span>Learning</span></div>
      <div>
        <div class="eyebrow" style="color:#a8d2ff">PPh Pasal 21</div>
        <h1>Belajar. Latihan. Kuasai.</h1>
        <p>Ruang belajar terstruktur untuk memahami PPh Pasal 21 melalui materi, checkpoint, evaluasi, dan sertifikat digital.</p>
      </div>
      <small style="color:rgba(255,255,255,.55)">Kabayan Learning</small>
    </section>

    <section class="login-panel">
      <div class="surface login-card">
        <div class="eyebrow">Ruang Belajar</div>
        <h2>Selamat datang</h2>
        <p>Masuk atau buat akun peserta.</p>

        <div class="tabs">
          <button class="tab-btn active" data-tab="login">Masuk</button>
          <button class="tab-btn" data-tab="signup">Daftar</button>
        </div>

        <div class="tab-panel active" id="tab-login">
          <form id="loginForm" class="form-grid">
            <label class="field">Email
              <input type="email" name="email" autocomplete="email" required>
            </label>
            <label class="field">Password
              <input type="password" name="password" autocomplete="current-password" minlength="6" required>
            </label>
            <button class="btn" type="submit">Masuk</button>
          </form>
        </div>

        <div class="tab-panel" id="tab-signup">
          <form id="signupForm" class="form-grid">
            <label class="field">Nama lengkap
              <input type="text" name="full_name" required>
            </label>
            <label class="field">Email
              <input type="email" name="email" autocomplete="email" required>
            </label>
            <label class="field">Password
              <input type="password" name="password" autocomplete="new-password" minlength="6" required>
            </label>
            <button class="btn" type="submit">Buat akun</button>
          </form>
        </div>

        <div id="status" class="form-status"></div>
      </div>
    </section>
  </main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>

  <script src="assets/js/login.js"></script>
  <script>
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(x => x.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(x => x.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });
  </script>
</body>
</html>
