<!doctype html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/><meta content="#f5f7fb" name="theme-color"/>
<title>Masuk — Kabayan Learning</title>
<link href="assets/css/lms.css" rel="stylesheet"/><link href="assets/css/lms-audit.css" rel="stylesheet"/>
</head>
<body class="login-page">
<main class="login-shell">
<section class="login-art">
<div class="brand">Kabayan <span>Learning</span></div>
<div>
<div class="eyebrow login-eyebrow-light">PPh Pasal 21</div>
<h1>Belajar. Latihan. Kuasai.</h1>
<p>Ruang belajar terstruktur untuk memahami PPh Pasal 21 melalui materi, checkpoint, evaluasi, dan sertifikat digital.</p>
</div>
<small class="login-footer-note">Kabayan Learning</small>
</section>
<section class="login-panel">
<div class="surface login-card">
<div class="eyebrow">Ruang Belajar</div>
<h2>Selamat datang</h2>
<p>Masuk atau buat akun peserta.</p>
<div class="tabs">
<button class="tab-btn active" data-tab="login" type="button">Masuk</button>
<button class="tab-btn" data-tab="signup" type="button">Daftar</button>
</div>
<div class="tab-panel active" id="tab-login">
<form class="form-grid" id="loginForm">
<label class="field">Email
              <input autocomplete="email" name="email" required="" type="email"/>
</label>
<label class="field">Password
              <input autocomplete="current-password" minlength="6" name="password" required="" type="password"/>
</label>
<button class="btn" type="submit">Masuk</button>
</form>
</div>
<div class="tab-panel" id="tab-signup">
<form class="form-grid" id="signupForm">
<label class="field">Nama lengkap
              <input name="full_name" required="" type="text"/>
</label>
<label class="field">Email
              <input autocomplete="email" name="email" required="" type="email"/>
</label>
<label class="field">Password
              <input autocomplete="new-password" minlength="6" name="password" required="" type="password"/>
</label>
<button class="btn" type="submit">Buat akun</button>
</form>
</div>
<div class="form-status" id="status"></div>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/login.js"></script>
<script>
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(x => x.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(x => x.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });
  </script>
</body>
</html>
