<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Verifikasi Sertifikat — Kabayan Learning</title>

  <link rel="stylesheet" href="assets/css/lms.css">
  <link rel="stylesheet" href="assets/css/verifikasi-sertifikat.css">
</head>

<body class="verify-page">

<header class="site-header">
  <nav class="nav">

    <a
      class="brand"
      href="index.html">
      Kabayan <span>Learning</span>
    </a>

  </nav>
</header>


<main class="verify-shell">

  <section class="verify-card">

    <div
      id="verifyIcon"
      class="verify-icon loading">
      …
    </div>


    <div class="verify-kicker">
      Verifikasi Sertifikat
    </div>


    <h1 id="verifyTitle">
      Memeriksa sertifikat…
    </h1>


    <p id="verifyDescription">
      Mohon tunggu sebentar.
    </p>


    <div
      id="verifyDetails"
      class="verify-details hidden">
    </div>


    <div
      id="verifyCodeBox"
      class="verify-code-box hidden">

      <span>Kode Verifikasi</span>

      <strong id="verifyCode">
        —
      </strong>

    </div>

  </section>


  <section class="verify-help">

    <strong>
      Tentang verifikasi
    </strong>

    <p>
      Halaman ini digunakan untuk memeriksa sertifikat yang diterbitkan
      oleh Kabayan Learning. Data yang ditampilkan berasal langsung dari
      catatan penerbitan sertifikat.
    </p>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/verifikasi-sertifikat.js"></script>

</body>
</html>
