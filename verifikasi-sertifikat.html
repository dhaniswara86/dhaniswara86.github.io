<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Sertifikat | Kabayan Learning</title>
<link rel="stylesheet" href="assets/css/verifikasi-sertifikat.css">
</head>

<body>

<main class="verification-card">

<div class="logo">
KABAYAN LEARNING
</div>

<div id="status-icon" class="status-icon">
✓
</div>

<h1 id="status-title">
Sertifikat Valid
</h1>

<p id="status-description">
Sertifikat ini terdaftar dalam sistem Kabayan Learning.
</p>


<section class="data">

<div>
<small>Nama Peserta</small>
<strong id="participant-name">-</strong>
</div>


<div>
<small>Program Pembelajaran</small>
<strong id="class-name">-</strong>
</div>


<div>
<small>Nomor Sertifikat</small>
<strong id="certificate-number">-</strong>
</div>


<div>
<small>Tanggal Terbit</small>
<strong id="issued-date">-</strong>
</div>

</section>


<div class="badge">
SERTIFIKAT TERDAFTAR
</div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/kabayan-supabase-config.js"></script>
<script src="assets/js/verifikasi-sertifikat.js"></script>

</body>
</html>
