<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Masuk Kelas | Kabayan Learning</title>

<link rel="stylesheet" href="assets/css/peserta.css">

</head>

<body>

<header class="header">
<div class="logo">
Kabayan Learning
</div>
</header>


<main class="container">

<section class="hero">

<p class="eyebrow">
PESERTA
</p>

<h1>
Masuk ke Ruang Belajar.
</h1>

<p>
Gunakan kode kelas dari pengajar
untuk memulai pembelajaran.
</p>

</section>


<section class="join-box">

<h2>
Bergabung dengan Kelas
</h2>


<div class="form">

<input
id="class-code"
placeholder="Kode Kelas"
>


<input
id="participant-name"
placeholder="Nama Anda"
>


<button id="join">
Mulai Belajar
</button>

</div>


<p id="message"></p>


</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/kabayan-supabase-config.js"></script>
<script src="assets/js/peserta.js"></script>


</body>
</html>
