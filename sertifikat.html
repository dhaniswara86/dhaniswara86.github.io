<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sertifikat Kabayan Learning</title>
<link rel="stylesheet" href="assets/css/sertifikat.css">
</head>

<body>

<div class="toolbar">
<button onclick="window.print()">🖨 Cetak Sertifikat</button>
</div>

<main class="certificate">

<div class="header">
    <div class="logo">KABAYAN LEARNING</div>
    <div class="subtitle">Program Pembelajaran Digital</div>
</div>

<h1>SERTIFIKAT</h1>

<div class="line"></div>

<p class="given">Diberikan kepada</p>

<h2 id="participant-name">Memuat...</h2>

<p class="description">
Atas keberhasilan menyelesaikan program pembelajaran
</p>

<div class="class-box">
<strong id="class-name">-</strong>

<div class="score">
Nilai Akhir
<br>
<b id="score">-</b>
</div>
</div>

<div class="bottom">

<div id="qr-code"></div>

<div class="certificate-info">
<p>
Nomor Sertifikat
</p>

<b id="certificate-number">-</b>

<p class="date">
Kabayan Learning
</p>
</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/kabayan-supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="assets/js/sertifikat.js"></script>

</body>
</html>
