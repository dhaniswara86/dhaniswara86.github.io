<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Pratinjau Cetak | Kabayan</title>
  <link rel="stylesheet" href="assets/form-engine/form.css?v=20260831-12">
  <link rel="stylesheet" href="assets/form-engine/schema-v2.css?v=20260831-20">
  <link rel="stylesheet" href="assets/form-engine/print.css?v=20260831-12" media="print">
  <link rel="stylesheet" href="assets/form-engine/cetak.css?v=20260831-12">

  <style id="warisStaticPrintStyles">
    /*
      Layout khusus Surat Pernyataan Pembagian Waris pada cetak.html.
      CSS ini harus berada di halaman cetak karena markup statis yang
      dikirim dari form.html tidak membawa stylesheet inline form.
    */
    .print-static-paper .waris-v3-editor {
      display: none !important;
    }

    .print-static-paper .waris-v3-print {
      display: block !important;
      margin-top: 22px;
      color: #000;
      font: inherit;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .print-static-paper .waris-v3-print.waris-v3-many {
      break-inside: auto;
      page-break-inside: auto;
    }

    .print-static-paper .waris-v3-place-date-grid,
    .print-static-paper .waris-v3-sign-grid {
      display: grid !important;
      grid-template-columns: minmax(0, 1fr) 66px minmax(0, 1fr) !important;
      column-gap: 22px !important;
      width: 100%;
      box-sizing: border-box;
    }

    .print-static-paper .waris-v3-place-date {
      grid-column: 3 !important;
      min-width: 0;
      min-height: 24px;
      margin: 0 0 6px;
      white-space: nowrap;
      text-align: left;
      line-height: 1.35;
    }

    .print-static-paper .waris-v3-sign-grid {
      align-items: start;
    }

    /*
      Jangan bergantung pada style="" hasil serialisasi.
      Posisi juga dikunci berdasarkan class/order agar Safari stabil.
    */
    .print-static-paper .waris-v3-sign-grid > .waris-v3-sign-title:first-child {
      grid-column: 1 !important;
      grid-row: 1 !important;
    }

    .print-static-paper .waris-v3-sign-grid > .waris-v3-sign-title:nth-child(2) {
      grid-column: 3 !important;
      grid-row: 1 !important;
    }

    .print-static-paper .waris-v3-left-list {
      grid-column: 1 !important;
      grid-row: 2 !important;
      min-width: 0;
      margin: 0;
    }

    .print-static-paper .waris-v3-stamp {
      grid-column: 2 !important;
      grid-row: 2 !important;
      align-self: start;
      width: 62px;
      height: 38px;
      display: flex !important;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      margin-top: 22px;
      border: 1px solid #000;
      font-size: 11px;
      line-height: 1;
    }

    .print-static-paper .waris-v3-primary-area {
      grid-column: 3 !important;
      grid-row: 2 !important;
      min-width: 0;
      min-height: 94px;
      display: flex !important;
      align-items: flex-end;
    }

    .print-static-paper .waris-v3-sign-title {
      margin: 0 !important;
      padding: 0 !important;
      font: inherit;
      font-weight: 400 !important;
      line-height: 1.35 !important;
    }

    .print-static-paper .waris-v3-print-heir {
      min-height: 94px;
      display: flex !important;
      align-items: flex-end;
      min-width: 0;
    }

    .print-static-paper .waris-v3-print-heir-name,
    .print-static-paper .waris-v3-primary-name {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      padding: 0 3px 3px;
      border-bottom: 1px dotted #000;
      text-align: center;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .print-static-paper .waris-v3-primary-name {
      width: 100%;
    }

    @media print {
      .print-static-paper .waris-v3-print {
        margin-top: 22px;
      }

      .print-static-paper .waris-v3-place-date-grid,
      .print-static-paper .waris-v3-sign-grid {
        grid-template-columns: minmax(0, 1fr) 66px minmax(0, 1fr) !important;
        column-gap: 22px !important;
      }
    }
  </style>

  <script src="assets/form-engine/cetak.js?v=20260831-15" defer></script>

  <style id="skbPphTanahBangunanStaticV1Styles">
    .print-static-paper .skb-v1-editor { display:none!important; }
    .print-static-paper .skb-v1-print { display:block!important; color:#000; font-family:Arial,Helvetica,sans-serif; font-size:10.5pt; line-height:1.35; }
    .print-static-paper .skb-v1-page { min-height:250mm; box-sizing:border-box; }
    .print-static-paper .skb-v1-page:not(:last-child) { break-after:page; page-break-after:always; }
    .print-static-paper .skb-v1-doc-title { margin:0 0 22px; text-align:center; font-size:13pt; line-height:1.3; }
    .print-static-paper .skb-v1-print p { margin:0 0 8px; }
    .print-static-paper .skb-v1-print-table { width:100%; border-collapse:collapse; margin:7px 0 11px; }
    .print-static-paper .skb-v1-print-table td { padding:2px 3px; vertical-align:top; }
    .print-static-paper .skb-v1-print-label { width:32%; }
    .print-static-paper .skb-v1-colon { width:10px; text-align:center; }
    .print-static-paper .skb-v1-line { min-height:18px; border-bottom:1px dotted #666; }
    .print-static-paper .skb-v1-role-list { margin:8px 0 10px 14px; display:grid; gap:5px; }
    .print-static-paper .skb-v1-print h3 { margin:12px 0 5px; font-size:10.5pt; }
    .print-static-paper .skb-v1-heir-table { width:100%; border-collapse:collapse; margin:6px 0 10px; font-size:9.5pt; }
    .print-static-paper .skb-v1-heir-table th,.print-static-paper .skb-v1-heir-table td { border:1px solid #555; padding:4px 5px; vertical-align:top; }
    .print-static-paper .skb-v1-heir-table th { font-weight:400; text-align:center; }
    .print-static-paper .skb-v1-attach-list { margin:5px 0 0 20px; padding:0; }
    .print-static-paper .skb-v1-attach-list li { margin-bottom:5px; padding-left:2px; }
    .print-static-paper .skb-v1-attach-sub { margin:5px 0 0 20px; padding-left:16px; list-style-type:lower-alpha; }
    .print-static-paper .skb-v1-declaration { display:grid; grid-template-columns:20px 1fr; gap:5px; margin-top:12px; }
    .print-static-paper .skb-v1-sign { width:48%; margin:22px 0 0 auto; text-align:center; }
    .print-static-paper .skb-v1-sign-place { margin-bottom:8px; }
    .print-static-paper .skb-v1-sign-space { min-height:55px; }
    .print-static-paper .skb-v1-sign-name { display:inline-block; min-width:180px; padding:0 8px 2px; border-bottom:1px dotted #555; }
    .print-static-paper .skb-v1-footnotes { margin-top:18px; font-size:8.4pt; line-height:1.3; }
    .print-static-paper .skb-v1-footnote { display:grid; grid-template-columns:34px 1fr; gap:5px; margin-bottom:5px; }
    @media print {
      .print-static-paper .skb-v1-page { min-height:250mm; }
      .print-static-paper .skb-v1-page:not(:last-child) { break-after:page; page-break-after:always; }
    }
  </style>

</head>
<body class="static-print-page">
  <header class="static-print-toolbar no-print">
    <div>
      <strong id="previewTitle">Pratinjau Cetak</strong>
      <span>Dokumen ini sudah diubah menjadi teks statis agar lebih aman dicetak melalui Safari.</span>
    </div>
    <div class="static-print-actions">
      <button class="static-button" id="backBtn" type="button">Kembali ke Formulir</button>
      <button class="static-button primary" id="nativePrintBtn" type="button" disabled>Cetak / Simpan PDF</button>
    </div>
  </header>

  <main class="static-print-main">
    <div class="static-print-message no-print" id="printMessage" role="alert" hidden></div>
    <div class="static-paper-wrap" id="printMount" aria-live="polite"></div>
  </main>

  <noscript>
    <p class="static-print-message">JavaScript harus diaktifkan untuk membuka pratinjau cetak.</p>
  </noscript>
</body>
</html>
