<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Gerbang masuk ruang internal Saung Kabayan untuk layanan PAP.">
  <meta name="theme-color" content="#ffffff">
  <title>Masuk | Saung Kabayan</title>

  <style>
    :root{
      --blue:#0b6fe8;
      --blue-2:#075fc9;
      --navy:#0f2340;
      --text:#5f7391;
      --line:#dce6f2;
      --soft:#f6faff;
      --white:#ffffff;
      --shadow:0 24px 70px rgba(24,62,112,.12);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff}
    body{
      min-height:100svh;
      color:var(--navy);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    a{color:inherit}
    button,input{font:inherit}

    .auth-page{
      position:relative;
      min-height:100svh;
      isolation:isolate;
      background:#fff;
    }

    /* Pale decorative shape behind the logo, inspired by the approved mockup. */
    .auth-page::before{
      content:"";
      position:fixed;
      z-index:-3;
      top:-200px;
      left:250px;
      width:470px;
      height:390px;
      border-radius:48% 52% 68% 32% / 55% 39% 61% 45%;
      background:linear-gradient(145deg,#eef6ff 0%,#f8fbff 72%);
      pointer-events:none;
    }

    .scene{
      position:fixed;
      z-index:-2;
      top:0;
      right:0;
      width:61vw;
      height:100svh;
      overflow:hidden;
      pointer-events:none;
      background:#eef7ff;
    }

    .scene img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:58% center;
    }

    /* The fade is the key to making the form and artwork feel like one composition. */
    .scene::before{
      content:"";
      position:absolute;
      z-index:2;
      inset:0 auto 0 0;
      width:30%;
      background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.96) 16%,rgba(255,255,255,.76) 43%,rgba(255,255,255,.25) 76%,rgba(255,255,255,0) 100%);
    }

    .scene::after{
      content:"";
      position:absolute;
      z-index:2;
      left:-110px;
      bottom:-190px;
      width:420px;
      height:500px;
      border-radius:50%;
      background:rgba(255,255,255,.9);
      filter:blur(1px);
    }

    .auth-shell{
      position:relative;
      z-index:1;
      width:100%;
      min-height:100svh;
      padding:48px clamp(38px,5.4vw,92px) 36px;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
    }

    .brand{
      display:inline-flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      position:relative;
      z-index:4;
      color:var(--navy);
    }

    .brand-mark{
      width:48px;
      height:48px;
      display:grid;
      place-items:center;
      color:var(--blue);
      flex:0 0 auto;
    }

    .brand-mark svg{width:100%;height:100%;display:block}
    .brand-name{
      font-size:20px;
      line-height:1.02;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .brand-name span{display:block}

    .login-wrap{
      width:min(510px,calc(42vw - 70px));
      margin-top:60px;
      position:relative;
      z-index:5;
    }

    .auth-card{
      width:100%;
      padding:38px 50px 28px;
      border:1px solid rgba(214,225,239,.95);
      border-radius:34px;
      background:rgba(255,255,255,.94);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .eyebrow{
      margin:0 0 20px;
      color:#7285a0;
      font-size:14px;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      font-size:clamp(42px,3.15vw,58px);
      line-height:.95;
      letter-spacing:-.055em;
      font-weight:850;
      color:var(--navy);
    }
    h1 .dot{color:var(--blue)}

    .intro{
      margin:16px 0 30px;
      max-width:360px;
      font-size:16px;
      line-height:1.5;
      color:var(--text);
    }

    .form{display:grid;gap:17px}
    .field{display:grid;gap:8px}
    .field label{
      font-size:14px;
      font-weight:750;
      color:#19304e;
    }

    .input-shell{
      height:58px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 15px;
      border:1px solid #d5e0ed;
      border-radius:15px;
      background:#fff;
      transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
    }
    .input-shell:focus-within{
      border-color:rgba(11,111,232,.65);
      box-shadow:0 0 0 4px rgba(11,111,232,.09);
    }
    .input-icon{
      width:21px;
      height:21px;
      flex:0 0 auto;
      color:#7890ae;
    }
    .input-icon svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    .input-shell input{
      width:100%;
      min-width:0;
      height:100%;
      border:0;
      outline:0;
      background:transparent;
      color:#142944;
      font-size:16px;
    }
    .input-shell input::placeholder{color:#9baabd}

    .password-toggle{
      border:0;
      background:transparent;
      color:#7c91ae;
      width:36px;
      height:36px;
      border-radius:50%;
      display:grid;
      place-items:center;
      cursor:pointer;
      flex:0 0 auto;
    }
    .password-toggle:hover{background:#f1f6fc;color:var(--blue)}
    .password-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    .form-status{
      min-height:20px;
      margin:-5px 0 -5px;
      font-size:13px;
      line-height:1.4;
      color:#b42318;
    }

    .submit{
      height:58px;
      margin-top:1px;
      border:0;
      border-radius:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      background:linear-gradient(135deg,var(--blue) 0%,#087af5 100%);
      color:white;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 12px 28px rgba(11,111,232,.24);
      transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
    }
    .submit:hover{transform:translateY(-1px);box-shadow:0 15px 34px rgba(11,111,232,.29);filter:saturate(1.05)}
    .submit:active{transform:translateY(0)}
    .submit .arrow{font-size:22px;line-height:1}

    .auth-links{
      display:grid;
      grid-template-columns:1fr 1px 1fr;
      align-items:center;
      gap:20px;
      margin-top:19px;
      padding-top:18px;
      border-top:1px solid #e2eaf3;
    }
    .auth-links .divider{width:1px;height:20px;background:#d5dfeb}
    .auth-links a{
      text-decoration:none;
      color:#086bd8;
      font-size:14px;
      font-weight:750;
      text-align:center;
    }
    .auth-links a:hover{text-decoration:underline}

    .access-note{
      margin-top:auto;
      padding-top:30px;
      display:flex;
      align-items:center;
      gap:10px;
      color:#6e819d;
      font-size:13px;
      line-height:1.4;
      position:relative;
      z-index:4;
    }
    .access-note svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    @media (max-width:1180px){
      .scene{width:58vw}
      .login-wrap{width:min(480px,40vw)}
      .auth-card{padding:34px 38px 26px}
      h1{font-size:46px}
    }

    @media (max-width:900px){
      body{overflow:auto}
      .auth-page::before{display:none}
      .scene{
        position:absolute;
        z-index:0;
        top:0;
        left:0;
        right:auto;
        width:100%;
        height:39svh;
        min-height:300px;
        border-radius:0 0 34px 34px;
        overflow:hidden;
      }
      .scene img{object-position:61% 46%}
      .scene::before{
        inset:auto 0 0 0;
        width:auto;
        height:55%;
        background:linear-gradient(0deg,#fff 0%,rgba(255,255,255,.72) 38%,rgba(255,255,255,0) 100%);
      }
      .scene::after{display:none}
      .auth-shell{
        z-index:1;
        min-height:100svh;
        padding:calc(39svh - 18px) 22px 34px;
      }
      .brand{
        position:absolute;
        top:22px;
        left:22px;
        z-index:10;
        padding:9px 12px;
        border-radius:17px;
        background:rgba(255,255,255,.86);
        backdrop-filter:blur(10px);
        box-shadow:0 10px 30px rgba(15,35,64,.08);
      }
      .brand-mark{width:38px;height:38px}
      .brand-name{font-size:16px}
      .login-wrap{
        width:min(560px,100%);
        margin:0 auto;
        z-index:6;
      }
      .auth-card{
        border-radius:28px;
        padding:31px clamp(24px,6vw,42px) 25px;
      }
      h1{font-size:clamp(42px,11vw,58px)}
      .access-note{
        width:min(560px,100%);
        margin:20px auto 0;
        padding-top:0;
      }
    }

    @media (max-width:520px){
      .scene{height:34svh;min-height:245px}
      .scene img{object-position:64% 48%}
      .auth-shell{padding-top:calc(34svh - 12px)}
      .brand{top:16px;left:16px;padding:7px 10px}
      .brand-mark{width:34px;height:34px}
      .brand-name{font-size:14px}
      .login-wrap{margin-top:-32px}
      .auth-card{padding:27px 20px 22px;border-radius:24px}
      .eyebrow{font-size:12px;margin-bottom:16px}
      h1{font-size:43px}
      .intro{font-size:15px;margin:14px 0 25px}
      .input-shell,.submit{height:55px}
      .auth-links{gap:12px}
      .auth-links a{font-size:13px}
      .access-note{font-size:12px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>
<body class="auth-page">

  <main class="auth-shell">
    <a class="brand" href="https://dhaniswara86.id/" aria-label="Saung Kabayan">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M7 26 32 7l25 19" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13 25h38v30H13z" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
          <path d="M24 55V38h16v17" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
          <path d="M18 19V11" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name"><span>Saung</span><span>Kabayan</span></span>
    </a>

    <section class="login-wrap" aria-label="Login Saung Kabayan">
      <div class="auth-card">
        <p class="eyebrow">Wilujeng sumping</p>
        <h1>Masuk ke<br>Saung<span class="dot">.</span></h1>
        <p class="intro">Gunakan akun yang telah memperoleh persetujuan dari admin.</p>

        <form class="form" id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
              </span>
              <input id="email" name="email" type="email" autocomplete="username" placeholder="nama@contoh.go.id" required>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3"/><path d="M5 10h14v10H5z"/></svg>
              </span>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" minlength="6" required>
              <button class="password-toggle" id="passwordToggle" type="button" aria-label="Tampilkan password" title="Tampilkan password">
                <svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </button>
            </div>
          </div>

          <p class="form-status" id="loginStatus" aria-live="polite"></p>

          <button class="submit" type="submit">
            <span>Masuk ke Saung</span>
            <span class="arrow" aria-hidden="true">→</span>
          </button>
        </form>

        <div class="auth-links">
          <a href="daftar.html">Ajukan akses</a>
          <span class="divider" aria-hidden="true"></span>
          <a href="lupa-password.html">Lupa password?</a>
        </div>
      </div>
    </section>

    <p class="access-note">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.8 2.8 8 7 10 4.2-2 7-5.2 7-10V6l-7-3Z"/><path d="m9.5 12 1.6 1.6 3.6-3.8"/></svg>
      <span>Akses terbatas untuk pengguna yang telah disetujui.</span>
    </p>
  </main>

  <aside class="scene" aria-hidden="true">
    <img src="assets/img/saung-kabayan-hero.webp" alt="">
  </aside>

  <script>
    // UI only: show/hide password. Login handling remains in assets/js/saung.js.
    (() => {
      const password = document.getElementById('password');
      const toggle = document.getElementById('passwordToggle');
      if (!password || !toggle) return;
      toggle.addEventListener('click', () => {
        const showing = password.type === 'text';
        password.type = showing ? 'password' : 'text';
        toggle.setAttribute('aria-label', showing ? 'Tampilkan password' : 'Sembunyikan password');
        toggle.setAttribute('title', showing ? 'Tampilkan password' : 'Sembunyikan password');
      });
    })();
  </script>

  <!-- Existing Supabase + login scripts retained from the original Saung Kabayan index. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/saung.js"></script>
</body>
</html>
