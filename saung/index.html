<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Gerbang masuk ruang internal Saung Kabayan.">
  <meta name="theme-color" content="#f7faff">
  <title>Masuk | Saung Kabayan</title>

  <style>
    :root{
      --blue:#126fe8;
      --blue-dark:#075fcf;
      --yellow:#F6C453;
      --yellow-dark:#E7AC2E;
      --navy:#10294d;
      --text:#637895;
      --line:#d7e3f0;
      --page:#f7faff;
      --white:#fff;
      --shadow:0 24px 70px rgba(29,63,112,.11);
    }

    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:var(--page)}
    body{
      height:100vh;
      height:100dvh;
      min-height:0;
      overflow:hidden;
      color:var(--navy);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,input{font:inherit}
    a{color:inherit}

    .page{
      width:100%;
      height:100vh;
      height:100dvh;
      min-height:0;
      display:grid;
      grid-template-columns:minmax(430px,38%) minmax(0,62%);
      background:var(--page);
      overflow:hidden;
    }

    /* LEFT / LOGIN */
    .left{
      position:relative;
      z-index:5;
      min-width:0;
      min-height:0;
      height:100%;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto;
      align-items:start;
      padding:clamp(20px,3vh,32px) clamp(26px,4.5vw,76px);
      overflow:hidden;
      background:
        radial-gradient(circle at 92% 6%,rgba(224,239,255,.86) 0 13%,rgba(247,250,255,0) 34%),
        linear-gradient(180deg,#fff 0%,#fbfdff 72%,#f7faff 100%);
    }

    /* Organic blend into the hero — no hard vertical split. */
    .left::after{
      content:"";
      position:absolute;
      z-index:-1;
      pointer-events:none;
      top:-8%;
      right:-145px;
      width:285px;
      height:116%;
      border-radius:50% 58% 54% 48% / 42% 50% 58% 56%;
      background:linear-gradient(90deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.94) 42%,rgba(255,255,255,.36) 78%,rgba(255,255,255,0) 100%);
      filter:blur(.2px);
    }

    .brand{
      position:relative;
      top:auto;
      left:auto;
      z-index:2;
      display:inline-flex;
      align-items:center;
      gap:13px;
      text-decoration:none;
      color:var(--navy);
    }
    .brand-mark{width:48px;height:48px;color:var(--blue);flex:0 0 auto}
    .brand-mark svg{width:100%;height:100%;display:block}
    .brand-name{font-size:20px;font-weight:850;line-height:1.03;letter-spacing:-.025em}
    .brand-name span{display:block}

    .login-card{
      min-height:0;
      width:100%;
      max-width:470px;
      align-self:center;
      margin:14px 0;
      padding:clamp(30px,3.2vw,46px) clamp(28px,3.2vw,44px) 28px;
      border:1px solid rgba(207,222,239,.96);
      border-radius:34px;
      background:rgba(255,255,255,.93);
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .eyebrow{
      margin:0 0 20px;
      font-size:14px;
      line-height:1;
      font-weight:850;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#7489a7;
    }
    h1{
      margin:0;
      font-size:clamp(44px,3.5vw,60px);
      line-height:.96;
      font-weight:880;
      letter-spacing:-.055em;
      color:var(--navy);
    }
    h1 .dot{color:var(--blue)}
    .intro{
      margin:16px 0 28px;
      max-width:350px;
      font-size:16px;
      line-height:1.5;
      color:var(--text);
    }

    .form{display:grid;gap:16px}
    .field{display:grid;gap:8px}
    .field label{font-size:14px;font-weight:780;color:#183252}
    .input-shell{
      min-width:0;
      height:58px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 15px;
      border:1px solid var(--line);
      border-radius:15px;
      background:#fff;
      transition:border-color .18s ease,box-shadow .18s ease;
    }
    .input-shell:focus-within{
      border-color:rgba(18,111,232,.66);
      box-shadow:0 0 0 4px rgba(18,111,232,.085);
    }
    .input-icon{width:21px;height:21px;color:#8096b3;flex:0 0 auto}
    .input-icon svg,.password-toggle svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .input-shell input{
      width:100%;min-width:0;height:100%;border:0;outline:0;background:transparent;
      color:#132d4c;font-size:16px;
    }
    .input-shell input::placeholder{color:#9badc2}
    .password-toggle{
      width:36px;height:36px;padding:8px;border:0;border-radius:50%;background:transparent;
      color:#7e94b0;cursor:pointer;flex:0 0 auto;
    }
    .password-toggle:hover{background:#f2f7fc;color:var(--blue)}

    .form-status{min-height:18px;margin:-4px 0 -4px;color:#b42318;font-size:13px;line-height:1.35}
    .submit{
      height:58px;border:0;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:14px;
      background:linear-gradient(135deg,#FFD66B 0%,var(--yellow) 56%,var(--yellow-dark) 100%);
      color:#10294d;font-size:16px;font-weight:850;cursor:pointer;
      box-shadow:0 13px 28px rgba(231,172,46,.24);
      transition:transform .18s ease,box-shadow .18s ease;
    }
    .submit:hover{transform:translateY(-1px);box-shadow:0 16px 34px rgba(231,172,46,.32);filter:brightness(1.015)}
    .submit:active{transform:translateY(0)}
    .submit .arrow{font-size:22px;line-height:1}

    .auth-links{
      display:grid;grid-template-columns:1fr 1px 1fr;gap:18px;align-items:center;
      margin-top:19px;padding-top:18px;border-top:1px solid #e2eaf3;
    }
    .auth-links .divider{width:1px;height:20px;background:#d7e1ec}
    .auth-links a{text-align:center;text-decoration:none;color:#096bd8;font-size:14px;font-weight:760}
    .auth-links a:hover{text-decoration:underline}

    .access-note{
      position:relative;
      left:auto;
      bottom:auto;
      align-self:end;
      max-width:430px;
      display:flex;align-items:center;gap:9px;
      color:#7487a2;font-size:13px;line-height:1.4;
    }
    .access-note svg{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    /* RIGHT / HERO */
    .hero{
      position:relative;
      min-width:0;
      min-height:0;
      height:100%;
      overflow:hidden;
      background:#ddebfa;
    }
    .hero-img{
      position:absolute;inset:0;
      width:100%;height:100%;display:block;
      object-fit:cover;
      object-position:56% center;
    }

    /* Soft continuation of the left background into the photo. */
    .hero::before{
      content:"";
      position:absolute;z-index:2;pointer-events:none;
      inset:0 auto 0 0;width:22%;
      background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.83) 26%,rgba(255,255,255,.36) 62%,rgba(255,255,255,0) 100%);
    }
    .hero::after{
      content:"";
      position:absolute;z-index:2;pointer-events:none;
      left:-120px;bottom:-170px;width:420px;height:410px;border-radius:50%;
      background:rgba(255,255,255,.78);
    }

    /* Smaller desktop / laptop */
    @media (max-width:1240px){
      .page{grid-template-columns:minmax(410px,41%) minmax(0,59%)}
      .left{padding-left:34px;padding-right:34px}
      .login-card{max-width:440px}
      .hero-img{object-position:59% center}
    }

    /* Laptop/desktop dengan viewport pendek: kompres vertikal tanpa memotong logo. */
    @media (max-height:900px) and (min-width:901px){
      .left{padding-top:18px;padding-bottom:18px}
      .brand-mark{width:42px;height:42px}
      .brand-name{font-size:18px}
      .login-card{margin:10px 0;padding:25px 34px 22px;max-width:445px;border-radius:30px}
      .eyebrow{margin-bottom:14px;font-size:12px}
      h1{font-size:44px}
      .intro{margin:11px 0 18px;font-size:14px}
      .form{gap:11px}
      .field{gap:6px}
      .field label{font-size:13px}
      .input-shell,.submit{height:50px}
      .auth-links{margin-top:12px;padding-top:12px}
      .access-note{font-size:12px}
      .access-note svg{width:18px;height:18px}
    }

    @media (max-height:740px) and (min-width:901px){
      .left{padding-top:12px;padding-bottom:12px}
      .brand-mark{width:36px;height:36px}
      .brand-name{font-size:16px}
      .login-card{margin:6px 0;padding:20px 30px 18px}
      .eyebrow{margin-bottom:11px}
      h1{font-size:39px}
      .intro{margin:8px 0 14px;font-size:13px}
      .form{gap:9px}
      .input-shell,.submit{height:46px}
      .auth-links{margin-top:9px;padding-top:9px}
      .access-note{font-size:11px}
    }

    /* Tablet/mobile */
    @media (max-width:900px){
      body{height:auto;min-height:100%;overflow:auto}
      .page{height:auto;min-height:100svh;display:flex;flex-direction:column;overflow:visible}
      .hero{order:0;min-height:310px;height:39svh}
      .hero-img{object-position:60% 45%}
      .hero::before{inset:auto 0 0 0;width:auto;height:48%;background:linear-gradient(0deg,#fff 0%,rgba(255,255,255,.58) 48%,rgba(255,255,255,0) 100%)}
      .hero::after{display:none}

      .left{order:1;height:auto;min-height:auto;display:flex;flex-direction:column;overflow:visible;padding:0 22px 34px;background:#fff}
      .left::after{display:none}
      .brand{
        z-index:8;top:-290px;left:22px;
        padding:8px 11px;border-radius:16px;
        background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        box-shadow:0 10px 30px rgba(16,41,77,.08)
      }
      .brand-mark{width:38px;height:38px}.brand-name{font-size:16px}
      .login-card{max-width:560px;margin:-34px auto 0;padding:32px clamp(24px,6vw,42px) 25px;border-radius:28px;position:relative;z-index:7}
      h1{font-size:clamp(43px,11vw,58px)}
      .access-note{position:relative;left:auto;bottom:auto;width:min(560px,100%);margin:20px auto 0}
    }

    @media (max-width:520px){
      .hero{height:34svh;min-height:250px}
      .hero-img{object-position:63% 47%}
      .left{padding-left:16px;padding-right:16px}
      .brand{left:16px;top:-235px;padding:7px 9px}.brand-mark{width:34px;height:34px}.brand-name{font-size:14px}
      .login-card{margin-top:-27px;padding:27px 20px 22px;border-radius:24px}
      .eyebrow{font-size:12px;margin-bottom:16px}
      h1{font-size:43px}
      .intro{font-size:15px;margin:14px 0 24px}
      .input-shell,.submit{height:55px}
      .auth-links{gap:11px}.auth-links a{font-size:13px}
      .access-note{font-size:12px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="left" aria-label="Login Saung Kabayan">
      <a class="brand" href="https://dhaniswara86.id/" aria-label="Saung Kabayan">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M7 26 32 7l25 19" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13 25h38v30H13z" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
            <path d="M24 55V38h16v17" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
            <path d="M18 19V11" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-name"><span>Saung</span><span>Kabayan</span></span>
      </a>

      <div class="login-card">
        <p class="eyebrow">Wilujeng sumping</p>
        <h1>Masuk ke<br>Saung<span class="dot">.</span></h1>
        <p class="intro">Gunakan akun yang telah memperoleh persetujuan dari admin.</p>

        <form class="form" id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
              </span>
              <input id="email" name="email" type="email" autocomplete="username" placeholder="nama@contoh.go.id" required>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3"/><path d="M5 10h14v10H5z"/></svg>
              </span>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" minlength="6" required>
              <button class="password-toggle" id="passwordToggle" type="button" aria-label="Tampilkan password" title="Tampilkan password">
                <svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </button>
            </div>
          </div>

          <p class="form-status" id="loginStatus" aria-live="polite"></p>

          <button class="submit" type="submit">
            <span>Masuk ke Saung</span>
            <span class="arrow" aria-hidden="true">→</span>
          </button>
        </form>

        <div class="auth-links">
          <a href="daftar.html">Permintaan Akses</a>
          <span class="divider" aria-hidden="true"></span>
          <a href="lupa-password.html">Lupa password?</a>
        </div>
      </div>

      <p class="access-note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.8 2.8 8 7 10 4.2-2 7-5.2 7-10V6l-7-3Z"/><path d="m9.5 12 1.6 1.6 3.6-3.8"/></svg>
        <span>Akses terbatas untuk pengguna yang telah disetujui.</span>
      </p>
    </section>

    <section class="hero" aria-label="Ilustrasi Saung Kabayan">
      <img class="hero-img" src="assets/img/saung-kabayan-hero.webp" alt="Kabayan bekerja di saung bambu">
    </section>
  </main>

  <script>
    // UI only: show / hide password. Login handling tetap menggunakan assets/js/saung.js.
    (() => {
      const password = document.getElementById('password');
      const toggle = document.getElementById('passwordToggle');
      if (!password || !toggle) return;
      toggle.addEventListener('click', () => {
        const isVisible = password.type === 'text';
        password.type = isVisible ? 'password' : 'text';
        toggle.setAttribute('aria-label', isVisible ? 'Tampilkan password' : 'Sembunyikan password');
        toggle.setAttribute('title', isVisible ? 'Tampilkan password' : 'Sembunyikan password');
      });
    })();
  </script>

  <!-- Script login existing Saung Kabayan -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/saung.js"></script>
</body>
</html>
