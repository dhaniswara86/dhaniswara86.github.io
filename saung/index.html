<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Gerbang masuk ruang internal Saung Kabayan.">
  <title>Masuk | Saung Kabayan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --ink: #10284d;
      --muted: #6e7f9f;
      --blue: #0b6ff5;
      --line: #d9e4f3;
      --yellow-a: #ffd762;
      --yellow-b: #f6c84e;
      --yellow-c: #edb633;
      --shadow: 0 24px 64px rgba(36, 72, 128, .12);
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #f7fbff;
    }

    body { overflow-x: hidden; }

    a { color: inherit; }
    button, input { font: inherit; }

    .page {
      min-height: 100svh;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(460px, 39%) minmax(0, 61%);
      background: #fff;
      overflow: hidden;
    }

    /* LEFT */
    .left {
      position: relative;
      z-index: 4;
      min-width: 0;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      padding: clamp(26px, 4vh, 54px) clamp(30px, 4vw, 72px) clamp(24px, 3vh, 36px);
      background:
        radial-gradient(720px 520px at 112% -4%, rgba(226,238,255,.88), rgba(226,238,255,0) 62%),
        linear-gradient(180deg, #fff 0%, #fbfdff 65%, #f8fbff 100%);
    }

    .left::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      top: -250px;
      right: -165px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.9);
      background: rgba(229,240,255,.55);
      pointer-events: none;
    }

    .left::after {
      content: "";
      position: absolute;
      left: -120px;
      bottom: -160px;
      width: 390px;
      height: 270px;
      border-radius: 50%;
      border: 1px solid rgba(137,181,238,.15);
      box-shadow: 0 0 0 18px rgba(255,255,255,.35);
      transform: rotate(-10deg);
      pointer-events: none;
    }

    .brand {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      width: fit-content;
      font-weight: 800;
      font-size: clamp(18px, 1.45vw, 25px);
      line-height: .98;
      letter-spacing: -.025em;
    }

    .brand svg {
      width: clamp(42px, 3.35vw, 58px);
      height: auto;
      flex: 0 0 auto;
    }

    .login-wrap {
      position: relative;
      z-index: 2;
      align-self: center;
      width: min(100%, 500px);
      margin-top: 8px;
    }

    .card {
      width: 100%;
      padding: clamp(28px, 3.6vh, 42px) clamp(26px, 3.25vw, 44px) clamp(24px, 3vh, 34px);
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(218,229,243,.92);
      border-radius: 32px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #7486a5;
      font-size: clamp(13px, .95vw, 17px);
      line-height: 1;
      letter-spacing: .21em;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 370px;
      font-size: clamp(48px, 4.2vw, 72px);
      line-height: .94;
      letter-spacing: -.055em;
      font-weight: 900;
      color: var(--ink);
    }

    h1 .dot { color: #f4c442; }

    .desc {
      margin: 18px 0 26px;
      max-width: 360px;
      color: var(--muted);
      font-size: clamp(15px, 1.16vw, 19px);
      line-height: 1.45;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      margin: 0 0 9px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
    }

    .input-shell {
      position: relative;
      display: flex;
      align-items: center;
      height: 58px;
      border: 1.4px solid var(--line);
      border-radius: 17px;
      background: rgba(255,255,255,.98);
      transition: .2s ease;
    }

    .input-shell:focus-within {
      border-color: rgba(11,111,245,.65);
      box-shadow: 0 0 0 4px rgba(11,111,245,.07);
    }

    .input-icon {
      position: absolute;
      left: 17px;
      width: 22px;
      height: 22px;
      color: #7f94b6;
      pointer-events: none;
    }

    .input-shell input {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 0 48px 0 50px;
      color: var(--ink);
      font-size: 16px;
    }

    .input-shell input::placeholder { color: #9aabc5; opacity: 1; }

    .eye {
      position: absolute;
      right: 14px;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #7f94b6;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .eye:hover { background: #f3f7fd; }
    .eye svg { width: 19px; height: 19px; }

    .form-status {
      min-height: 0;
      margin: 0;
      font-size: 13px;
      color: #b42318;
    }
    .form-status:not(:empty) { margin: 4px 0 10px; min-height: 18px; }

    .submit {
      width: 100%;
      height: 62px;
      margin-top: 10px;
      border: 0;
      border-radius: 17px;
      background: linear-gradient(135deg, var(--yellow-a) 0%, var(--yellow-b) 55%, var(--yellow-c) 100%);
      color: var(--ink);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(226,171,46,.28);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .submit:hover {
      transform: translateY(-1px);
      filter: saturate(1.03);
      box-shadow: 0 16px 30px rgba(226,171,46,.34);
    }

    .submit:active { transform: translateY(0); }

    .submit-inner {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .submit svg { width: 22px; height: 22px; }

    .auth-links {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
      padding-top: 17px;
      border-top: 1px solid #e3ebf6;
    }

    .auth-links .divider {
      width: 1px;
      height: 22px;
      background: #d9e3ef;
    }

    .auth-links a {
      text-decoration: none;
      color: #0867e8;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .auth-links a:last-child { text-align: right; }
    .auth-links a:hover { text-decoration: underline; }

    .access-note {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #7385a4;
      font-size: 13px;
      line-height: 1.35;
      max-width: 430px;
    }

    .access-note svg {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      color: #6984ad;
    }

    /* RIGHT HERO */
    .hero {
      position: relative;
      min-width: 0;
      min-height: 100svh;
      overflow: hidden;
      background: #dceeff;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0 auto 0 0;
      width: clamp(90px, 10vw, 185px);
      background: linear-gradient(90deg, #fbfdff 0%, rgba(251,253,255,.88) 18%, rgba(251,253,255,.48) 52%, rgba(251,253,255,0) 100%);
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: 2;
      left: -118px;
      bottom: -110px;
      width: 340px;
      height: 420px;
      border-radius: 46% 54% 45% 55% / 55% 46% 54% 45%;
      background: rgba(255,255,255,.72);
      transform: rotate(-18deg);
      pointer-events: none;
      filter: blur(.2px);
    }

    /* LAPTOP HEIGHT SAFETY */
    @media (max-height: 820px) and (min-width: 981px) {
      .left {
        padding-top: 18px;
        padding-bottom: 16px;
      }
      .brand { font-size: 18px; }
      .brand svg { width: 42px; }
      .card { padding: 24px 30px 22px; border-radius: 26px; }
      .eyebrow { margin-bottom: 13px; font-size: 12px; }
      h1 { font-size: 48px; }
      .desc { margin: 13px 0 18px; font-size: 14px; }
      .field { margin-bottom: 12px; }
      .field label { margin-bottom: 7px; font-size: 13px; }
      .input-shell { height: 50px; border-radius: 14px; }
      .input-shell input { font-size: 14px; }
      .submit { height: 52px; margin-top: 6px; border-radius: 14px; font-size: 15px; }
      .auth-links { margin-top: 13px; padding-top: 13px; }
      .access-note { font-size: 11.5px; }
    }

    @media (max-width: 1120px) and (min-width: 981px) {
      .page { grid-template-columns: minmax(420px, 44%) minmax(0, 56%); }
      .left { padding-left: 30px; padding-right: 30px; }
      h1 { font-size: 54px; }
    }

    /* MOBILE / TABLET */
    @media (max-width: 980px) {
      body { overflow-x: hidden; }
      .page {
        display: flex;
        flex-direction: column;
        min-height: 100svh;
        overflow: visible;
      }
      .hero {
        order: 1;
        min-height: 360px;
        height: 45svh;
      }
      .hero img { object-position: 58% 43%; }
      .hero::before {
        inset: auto 0 0 0;
        width: 100%;
        height: 110px;
        background: linear-gradient(180deg, rgba(251,253,255,0), #fbfdff 100%);
      }
      .hero::after { display: none; }
      .left {
        order: 2;
        min-height: auto;
        display: block;
        padding: 22px 18px 28px;
      }
      .left::before, .left::after { display: none; }
      .brand {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 5;
        padding: 10px 13px;
        border-radius: 18px;
        background: rgba(255,255,255,.88);
        box-shadow: 0 10px 30px rgba(24,63,114,.08);
        backdrop-filter: blur(9px);
      }
      .brand svg { width: 36px; }
      .brand { font-size: 16px; }
      .login-wrap {
        width: min(100%, 560px);
        margin: -70px auto 0;
      }
      .card { border-radius: 28px; }
      h1 { font-size: clamp(44px, 11vw, 58px); }
      .access-note {
        margin: 18px auto 0;
        width: min(100%, 560px);
      }
    }

    @media (max-width: 560px) {
      .hero { min-height: 300px; height: 39svh; }
      .hero img { object-position: 59% center; }
      .login-wrap { margin-top: -52px; }
      .card { padding: 26px 20px 22px; border-radius: 24px; }
      h1 { font-size: 46px; }
      .desc { font-size: 15px; }
      .auth-links { gap: 10px; }
      .auth-links a { font-size: 12.5px; }
      .auth-links .divider { height: 18px; }
      .access-note { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="left" aria-label="Masuk ke Saung Kabayan">
      <a class="brand" href="https://dhaniswara86.id/" aria-label="Saung Kabayan">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M10 28.5 32 11l22 17.5" stroke="#0B6FF5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 27v23h32V27" stroke="#0B6FF5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M25 50V36h14v14" stroke="#0B6FF5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7.5 29h49" stroke="#0B6FF5" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <span>Saung<br>Kabayan</span>
      </a>

      <div class="login-wrap">
        <div class="card">
          <p class="eyebrow">Wilujeng Sumping</p>
          <h1>Masuk ke<br>Saung<span class="dot">.</span></h1>
          <p class="desc">Gunakan akun yang telah memperoleh persetujuan dari admin.</p>

          <form id="loginForm">
            <div class="field">
              <label for="email">Email</label>
              <div class="input-shell">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2"/>
                  <path d="m4.5 7 7.5 6 7.5-6"/>
                </svg>
                <input id="email" name="email" type="email" autocomplete="username" placeholder="nama@contoh.go.id" required>
              </div>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="input-shell">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2"/>
                  <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                </svg>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" minlength="6" required>
                <button class="eye" id="togglePassword" type="button" aria-label="Tampilkan password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/>
                    <circle cx="12" cy="12" r="2.6"/>
                  </svg>
                </button>
              </div>
            </div>

            <p class="form-status" id="loginStatus" aria-live="polite"></p>

            <button class="submit" type="submit">
              <span class="submit-inner">Masuk ke Saung
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h13M14 7l5 5-5 5"/>
                </svg>
              </span>
            </button>
          </form>

          <div class="auth-links">
            <a href="daftar.html">Permintaan Akses</a>
            <span class="divider" aria-hidden="true"></span>
            <a href="lupa-password.html">Lupa password?</a>
          </div>
        </div>
      </div>

      <div class="access-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <path d="M12 3 5 6v5c0 4.6 2.7 8 7 10 4.3-2 7-5.4 7-10V6l-7-3Z"/>
          <path d="m9.4 12 1.7 1.7 3.7-4"/>
        </svg>
        <span>Akses terbatas untuk pengguna yang telah disetujui.</span>
      </div>
    </section>

    <section class="hero" aria-label="Ilustrasi Saung Kabayan">
      <img src="assets/img/saung-kabayan-hero.webp" alt="Kabayan bekerja di saung bambu dengan laptop, buku layanan, dan latar pegunungan">
    </section>
  </main>

  <script>
    (function () {
      const button = document.getElementById('togglePassword');
      const input = document.getElementById('password');
      if (button && input) {
        button.addEventListener('click', function () {
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          button.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
        });
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/saung.js"></script>
</body>
</html>
