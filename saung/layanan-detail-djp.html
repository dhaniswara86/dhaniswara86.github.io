  <footer><div class="container footer-inner"><span>Saung Kabayan · Katalog Bahan Pelayanan</span><span>Detail layanan DJP</span></div></footer>

  <script>
    (() => {
      "use strict";
      const root = document.getElementById("djpDetailRoot");
      const escapeHTML = value => String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
      const serviceId = new URLSearchParams(location.search).get("id") || "";
      const genericDocs = /dokumen pendukung sesuai ketentuan layanan/i;
      function requirementItems(item) {
        if (Array.isArray(item.requirements) && item.requirements.length) {
          return item.requirements.map(requirement => ({
            name: requirement.name || requirement.document || "Dokumen persyaratan",
            note: requirement.note || requirement.condition || "Pastikan dokumen masih berlaku dan dapat dibaca.",
            tag: requirement.status || (requirement.required === false ? "Kondisional" : "Wajib"),
            basis: requirement.basis || "",
            format: requirement.format || "",
            source: requirement.source || item.source || ""
          }));
        }
        const text = String(item.docs || "").trim();
        if (!text) return [];
        if (genericDocs.test(text)) return [{name:text,note:"Rincian per dokumen belum tersedia dalam basis data.",tag:"Perlu dirinci"}];
        return text.replace(/,\s+dan\s+/gi,", ").split(/,\s*/).map(name => ({name:name.trim(),note:"Periksa bentuk, masa berlaku, dan penandatangan sesuai ketentuan.",tag:"Disiapkan"})).filter(item => item.name);
      }

      function deadlineParts(sla) {
        const text = String(sla || "").trim();
        const entries = [...text.matchAll(/(\d+)\s*(hari kerja|hari kalender|hari|bulan|jam|tahun)/gi)];
        if (!entries.length) {
          if (/tidak (?:ditetapkan|ada)|belum ditetapkan/i.test(text)) return {value:"—",unit:"Tidak ditetapkan"};
          return {value:"Saat",unit:"Pelayanan"};
        }
        const units = [...new Set(entries.map(entry => entry[2].toLowerCase()))];
        if (units.length === 1) {
          const values = [...new Set(entries.map(entry => Number(entry[1])))].sort((a,b) => a-b);
          return {value:values.length === 1 ? String(values[0]) : `${values[0]}–${values.at(-1)}`,unit:units[0]};
        }
        return {value:entries[0][1],unit:entries[0][2].toLowerCase()};
      }

      function requirementGroup(tag) {
        const value = String(tag || "").toLowerCase();
        if (value.includes("wajib")) return "wajib";
        if (value.includes("kondisional") || value.includes("opsional")) return "kondisional";
        if (value.includes("prasyarat")) return "prasyarat";
        return "informasi";
      }

      const groupLabels = {wajib:"Dokumen wajib",kondisional:"Dokumen kondisional",prasyarat:"Prasyarat layanan",informasi:"Informasi pendukung"};
      const groupOrder = ["wajib","kondisional","prasyarat","informasi"];
      const sentenceCase = value => {
        const text = String(value || "").trim();
        return text ? text.charAt(0).toUpperCase() + text.slice(1) : text;
      };
      const showRequirementNote = note => {
        const text = String(note || "").trim();
        return text && !/^Periksa bentuk, masa berlaku, dan penandatangan sesuai ketentuan\.?$/i.test(text);
      };

      function renderError() {
        root.innerHTML = `<div class="page-error"><h1>Layanan tidak ditemukan.</h1><p>Kode layanan tidak tersedia atau tautan yang dibuka tidak lengkap.</p><a class="action-link primary" href="layanan-perpajakan-djp.html">Kembali ke matriks</a></div>`;
      }

      function render(item) {
        const requirements = requirementItems(item);
        const needsDetail = !Array.isArray(item.requirements) && genericDocs.test(item.docs || "");
        const verified = item.requirements_status === "verified-regulation";
        const deadline = item.calendar_value && item.calendar_unit ? {value:item.calendar_value,unit:item.calendar_unit} : deadlineParts(item.sla);
        const groupedRequirements = requirements.map((requirement,index) => ({requirement,index})).reduce((result,entry) => {
          const group = requirementGroup(entry.requirement.tag);
          (result[group] ||= []).push(entry);
          return result;
        },{});
        const pdfPath = `assets/docs/layanan/${encodeURIComponent(item.id)}/alur-proses.pdf`;
        const storageKey = `djp-checklist-${item.id}`;
        let checked = {};
        try { checked = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch (_) { checked = {}; }
        document.title = `${item.id} · ${item.name} | Saung Kabayan`;
        root.innerHTML = `
          <a class="back-link" href="layanan-perpajakan-djp.html">← Kembali ke matriks layanan</a>
          <article class="detail-hero">
            <div class="hero-grid">
              <div class="hero-copy">
                <div class="detail-kicker"><span class="detail-code">${escapeHTML(item.id)}</span><span class="detail-status">${escapeHTML(item.status)}</span></div>
                <h1>${escapeHTML(item.name)}</h1>
                <p class="detail-lead">Siapkan dokumen yang sesuai, periksa batas waktu layanan, dan gunakan sumber resmi sebagai rujukan pengajuan.</p>
              </div>
              <div class="hero-sla calendar-card" aria-label="Batas waktu penyelesaian ${escapeHTML(item.sla)}">
                <div class="calendar-top"><span>${escapeHTML(item.calendar_label || "Batas waktu")}</span><span class="calendar-rings" aria-hidden="true"><i></i><i></i></span></div>
                <div class="calendar-body"><strong class="calendar-value">${escapeHTML(deadline.value)}</strong><span class="calendar-unit">${escapeHTML(deadline.unit)}</span><small class="calendar-caption">Mulai dihitung: ${escapeHTML(item.start)}</small></div>
              </div>
            </div>
            <div class="summary-strip">
              <div class="summary-item"><span>Unit</span><strong>${escapeHTML(item.unit)}</strong></div>
              <div class="summary-item"><span>Saluran</span><strong>${escapeHTML(item.channel)}</strong></div>
              <div class="summary-item"><span>Produk layanan</span><strong>${escapeHTML(item.output)}</strong></div>
            </div>
          </article>

          ${item.filing_deadline ? `<section class="filing-deadline" aria-label="Batas waktu mengajukan upaya hukum"><span class="filing-deadline-icon" aria-hidden="true">⏱</span><div><span>Batas waktu mengajukan</span><strong>${escapeHTML(item.filing_deadline)}</strong></div><small>${escapeHTML(item.filing_deadline_basis || "Periksa regulasi yang berlaku")}</small></section>` : ""}

          <div class="detail-layout">
            <div class="detail-main">
              <section class="content-section" id="persyaratan">
                <div class="section-headline"><div><span class="section-eyebrow">Sebelum mengajukan</span><h2>Persyaratan dokumen</h2></div><span class="section-badge">${needsDetail ? "Perlu perincian" : verified ? `${requirements.length} butir · terverifikasi` : `${requirements.length} butir`}</span></div>
                ${requirements.length ? `<div class="requirements-overview">
                  <div class="progress-copy"><strong>Kesiapan dokumen</strong><span id="progressText">0 dari ${requirements.length} selesai</span></div><div class="progress-track" role="progressbar" aria-label="Kesiapan dokumen" aria-valuemin="0" aria-valuemax="${requirements.length}" aria-valuenow="0"><div class="progress-bar" id="progressBar"></div></div>
                  <p class="requirement-tip">Pastikan dokumen masih berlaku, dapat dibaca, dan ditandatangani oleh pihak yang berwenang. Buka rincian hanya ketika Anda memerlukan dasar hukum atau format dokumen.</p>
                </div>` : ""}
                <div class="requirement-list">${requirements.length ? groupOrder.filter(group => groupedRequirements[group]?.length).map((group,groupIndex) => `<details class="requirement-group" data-group="${group}" ${groupIndex === 0 ? "open" : ""}><summary><span class="group-dot" aria-hidden="true"></span><span class="group-title">${groupLabels[group]}</span><span class="group-count">${groupedRequirements[group].length} butir</span><span class="group-chevron" aria-hidden="true">⌄</span></summary><div class="requirement-group-body">${groupedRequirements[group].map(({requirement:req,index}) => {
                  const hasDetails = req.basis || req.format || req.source;
                  return `<article class="requirement" data-group="${group}"><label class="requirement-check" for="requirement-${index}" aria-label="Tandai ${escapeHTML(req.name)} telah disiapkan"><input id="requirement-${index}" type="checkbox" data-requirement="${index}" ${checked[index] ? "checked" : ""}></label><div class="requirement-content"><label class="requirement-title" for="requirement-${index}"><strong>${escapeHTML(sentenceCase(req.name))}</strong></label>${showRequirementNote(req.note) ? `<small>${escapeHTML(req.note)}</small>` : ""}${hasDetails ? `<details class="requirement-details"><summary>Lihat dasar dan format</summary><span class="requirement-basis">${req.basis ? `<span>Dasar: ${escapeHTML(req.basis)}</span>` : ""}${req.format ? `<span>Format: ${escapeHTML(req.format)}</span>` : ""}${req.source ? `<a href="${escapeHTML(req.source)}" target="_blank" rel="noopener">Buka regulasi ↗</a>` : ""}</span></details>` : ""}</div><em class="requirement-tag">${escapeHTML(req.tag)}</em></article>`;
                }).join("")}</div></details>`).join("") : `<div class="pdf-empty"><strong>Persyaratan belum tersedia.</strong><p>Daftar dokumen perlu ditambahkan setelah diverifikasi terhadap ketentuan layanan.</p></div>`}</div>
                <div class="data-notice"><b>i</b><span>${needsDetail ? "Basis data saat ini baru memuat persyaratan umum. Jangan menjadikan daftar ini sebagai satu-satunya dasar pemeriksaan sampai rincian dokumen diverifikasi." : verified ? `Rincian ini telah dicocokkan dengan ketentuan yang disebutkan pada setiap butir. Terakhir ditelaah ${escapeHTML(item.reviewed_at || "5 September 2026")}.` : "Checklist disusun dari ringkasan dokumen pada matriks. Pastikan kembali bentuk dokumen dan ketentuan teknis pada sumber resmi."}</span></div>
              </section>

              <section class="content-section" id="dokumen-alur">
                <div class="section-headline"><div><span class="section-eyebrow">Lampiran operasional</span><h2>PDF alur proses</h2></div><span class="section-badge" id="pdfStatus">Memeriksa…</span></div>
                <div class="pdf-empty" id="pdfEmpty"><span class="pdf-icon">PDF</span><strong>Alur proses belum dilampirkan.</strong><p>Unggah PDF menggunakan struktur nama di bawah. Halaman akan menampilkannya secara otomatis.</p><code class="pdf-path">${escapeHTML(pdfPath)}</code></div>
                <div class="pdf-ready" id="pdfReady"><div class="pdf-actions"><a class="action-link primary" id="pdfOpen" target="_blank" rel="noopener">Buka PDF ↗</a><a class="action-link" id="pdfDownload" download>Unduh PDF</a></div><iframe class="pdf-frame" id="pdfFrame" title="Pratinjau PDF alur proses"></iframe></div>
              </section>

              <section class="content-section" id="ketentuan">
                <div class="section-headline"><div><span class="section-eyebrow">Ketentuan layanan</span><h2>SLA dan dasar hukum</h2></div></div>
                <div class="legal-grid">${item.intake_sla ? `<div class="legal-block"><span>Layanan penerimaan berkas</span><p>${escapeHTML(item.intake_sla)}</p></div>` : ""}<div class="legal-block"><span>Jika SLA terlampaui</span><p>${escapeHTML(item.overdue)}</p></div><div class="legal-block"><span>Dasar hukum utama</span><p>${escapeHTML(item.basis)}</p></div></div>
              </section>
            </div>

            <aside class="detail-sidebar">
              <div class="side-card"><h2 class="side-heading"><span class="side-heading-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h10v4H7zM6 5H4v16h16V5h-2M8 12h8M8 16h6"/></svg></span>Ringkasan layanan</h2><span class="side-label">Pemohon</span><strong class="side-value">${escapeHTML(item.applicant)}</strong><div class="side-rule"></div><span class="side-label">Kategori</span><strong class="side-value">${escapeHTML(item.category)}</strong><div class="side-rule"></div><span class="side-label">Status persyaratan</span><strong class="side-value${verified ? " verified-line" : ""}">${verified ? "Terverifikasi terhadap regulasi" : needsDetail ? "Belum diperinci" : "Ringkasan awal"}</strong><div class="side-rule"></div><span class="side-label">Terakhir ditelaah</span><strong class="side-value">${escapeHTML(item.reviewed_at || "5 September 2026")}</strong></div>
              <div class="side-card"><span class="side-label">Navigasi cepat</span><div class="quick-nav"><a href="#persyaratan">Persyaratan dokumen</a><a href="#dokumen-alur">PDF alur proses</a><a href="#ketentuan">Dasar hukum</a></div></div>
              <div class="side-card"><span class="side-label">Sumber resmi</span><strong class="side-value">Buka regulasi untuk memeriksa ketentuan lengkap dan perubahan terakhir.</strong><a class="action-link" href="${escapeHTML(item.source)}" target="_blank" rel="noopener">Buka sumber resmi ↗</a></div>
              <div class="side-card"><span class="side-label">Catatan operasional</span><strong class="side-value">${escapeHTML(item.note)}</strong></div>
            </aside>
          </div>`;

        const checklistInputs = [...root.querySelectorAll("[data-requirement]")];
        const updateProgress = () => {
          const completed = checklistInputs.filter(input => input.checked).length;
          const percentage = checklistInputs.length ? Math.round((completed / checklistInputs.length) * 100) : 0;
          const progressText = document.getElementById("progressText");
          const progressBar = document.getElementById("progressBar");
          const progressTrack = progressBar?.parentElement;
          if (progressText) progressText.textContent = `${completed} dari ${checklistInputs.length} selesai · ${percentage}%`;
          if (progressBar) progressBar.style.width = `${percentage}%`;
          if (progressTrack) progressTrack.setAttribute("aria-valuenow",String(completed));
        };
        checklistInputs.forEach(input => input.addEventListener("change", () => {
          checked[input.dataset.requirement] = input.checked;
          localStorage.setItem(storageKey, JSON.stringify(checked));
          updateProgress();
        }));
        updateProgress();

        fetch(pdfPath,{method:"HEAD",cache:"no-store"}).then(response => {
          const status = document.getElementById("pdfStatus");
          if (!response.ok) { status.textContent = "Belum tersedia"; return; }
          document.getElementById("pdfEmpty").hidden = true;
          document.getElementById("pdfReady").classList.add("active");
          document.getElementById("pdfOpen").href = pdfPath;
          document.getElementById("pdfDownload").href = pdfPath;
          document.getElementById("pdfFrame").src = pdfPath;
          status.textContent = "Tersedia";
        }).catch(() => { document.getElementById("pdfStatus").textContent = "Belum tersedia"; });
      }

      fetch("assets/data/layanan-perpajakan-djp.json",{cache:"no-store"})
        .then(response => { if (!response.ok) throw new Error("Data layanan gagal dimuat"); return response.json(); })
        .then(services => { const item = services.find(entry => entry.id === serviceId); if (!item) return renderError(); render(item); })
        .catch(renderError);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/saung.js"></script>
</body>
</html>
