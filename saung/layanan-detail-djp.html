<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Persyaratan, batas waktu penyelesaian, dan dasar hukum layanan perpajakan DJP.">
  <title>Detail Layanan DJP | Saung Kabayan</title>
  <link rel="stylesheet" href="assets/css/saung.css">
  <style>
    .service-detail-page { min-height: 100vh; background: #f5f7fa; }
    .detail-shell { padding: 38px 0 88px; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--blue); font-size: 14px; font-weight: 700; text-decoration: none; }
    .detail-hero { margin-top: 25px; padding: clamp(26px,4vw,48px); border: 1px solid #dfe5ec; border-radius: 26px; background: linear-gradient(145deg,#fff 0%,#f7fbff 100%); box-shadow: 0 22px 60px rgba(24,39,75,.07); }
    .detail-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
    .detail-code,.detail-status { display: inline-flex; align-items: center; min-height: 29px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 760; }
    .detail-code { background: var(--blue-soft); color: var(--blue); }
    .detail-status { background: #eaf8ee; color: #167233; }
    .detail-hero h1 { max-width: 990px; margin: 18px 0 0; font-size: clamp(34px,5vw,62px); line-height: 1.01; letter-spacing: -.058em; }
    .detail-lead { max-width: 800px; margin: 18px 0 0; color: var(--muted); font-size: 16px; line-height: 1.65; }
    .summary-strip { display: grid; grid-template-columns: .8fr 1fr 1.2fr; margin-top: 33px; border-top: 1px solid #dfe5ec; border-bottom: 1px solid #dfe5ec; }
    .summary-item { min-width: 0; padding: 19px 18px 19px 0; }
    .summary-item + .summary-item { padding-left: 18px; border-left: 1px solid #dfe5ec; }
    .summary-item span,.section-eyebrow,.side-label { display: block; color: var(--muted); font-size: 11px; font-weight: 760; letter-spacing: .055em; text-transform: uppercase; }
    .summary-item strong { display: block; margin-top: 7px; font-size: 15px; line-height: 1.45; }
    .detail-layout { display: grid; grid-template-columns: minmax(0,1fr) 310px; align-items: start; gap: 24px; margin-top: 25px; }
    .detail-main { display: grid; gap: 18px; }
    .content-section { padding: clamp(23px,3vw,34px); border: 1px solid #e0e5eb; border-radius: 22px; background: #fff; }
    .section-headline { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 23px; }
    .section-headline h2 { margin: 5px 0 0; font-size: clamp(24px,3vw,34px); letter-spacing: -.045em; }
    .section-badge { flex: 0 0 auto; padding: 6px 9px; border-radius: 999px; background: #edf5ff; color: #0757ad; font-size: 11px; font-weight: 740; }
    .requirement-list { display: grid; gap: 10px; }
    .requirement { display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 13px; padding: 16px; border: 1px solid #e1e6ed; border-radius: 15px; background: #fbfcfe; cursor: pointer; transition: border-color .18s ease,background .18s ease; }
    .requirement:hover { border-color: #b7d2f1; background: #f7fbff; }
    .requirement input { width: 19px; height: 19px; margin: 1px 0 0; accent-color: var(--blue); }
    .requirement strong { display: block; font-size: 15px; line-height: 1.4; }
    .requirement small { display: block; margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .requirement-basis { display: flex; flex-wrap: wrap; gap: 7px 12px; margin-top: 9px; }
    .requirement-basis span,.requirement-basis a { color: #315676; font-size: 12px; font-weight: 650; line-height: 1.45; }
    .requirement-basis a { text-decoration: none; }
    .requirement-basis a:hover { text-decoration: underline; }
    .requirement-tag { padding: 4px 7px; border-radius: 999px; background: #eef1f5; color: #4d5968; font-size: 10px; font-weight: 750; text-transform: uppercase; }
    .requirement input:checked + span strong { color: #5c6570; text-decoration: line-through; }
    .data-notice { display: flex; gap: 11px; margin-top: 16px; padding: 14px 15px; border: 1px solid #eadca8; border-radius: 14px; background: #fffaf0; color: #665423; font-size: 13px; line-height: 1.55; }
    .data-notice b { flex: 0 0 auto; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: #ffe9a8; }
    .deadline-layout { display: grid; grid-template-columns: minmax(190px,235px) 1fr; align-items: stretch; gap: clamp(22px,4vw,42px); }
    .calendar-card { overflow: hidden; min-height: 235px; border: 1px solid #b9d5f4; border-radius: 22px; background: #f7fbff; box-shadow: 0 18px 42px rgba(16,99,190,.12); }
    .calendar-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 17px; background: var(--blue); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
    .calendar-rings { display: flex; gap: 7px; }
    .calendar-rings i { width: 8px; height: 8px; border: 2px solid #fff; border-radius: 50%; opacity: .9; }
    .calendar-body { display: grid; min-height: 181px; place-content: center; padding: 20px; text-align: center; }
    .calendar-value { color: #0867c8; font-size: clamp(62px,8vw,94px); font-weight: 820; line-height: .82; letter-spacing: -.07em; }
    .calendar-unit { margin-top: 14px; color: #24415e; font-size: 15px; font-weight: 780; letter-spacing: .05em; text-transform: uppercase; }
    .deadline-copy { display: flex; flex-direction: column; justify-content: center; }
    .deadline-copy h2 { margin: 7px 0 10px; font-size: clamp(27px,3vw,38px); letter-spacing: -.045em; }
    .deadline-full { margin: 0; color: #263747; font-size: 18px; font-weight: 740; line-height: 1.5; }
    .deadline-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
    .deadline-meta div { padding: 14px 15px; border: 1px solid #dce6f0; border-radius: 14px; background: #fbfdff; }
    .deadline-meta span { display: block; color: var(--muted); font-size: 11px; font-weight: 760; letter-spacing: .055em; text-transform: uppercase; }
    .deadline-meta strong { display: block; margin-top: 7px; font-size: 13px; line-height: 1.5; }
    .pdf-empty { padding: 27px; border: 1px dashed #b8c6d7; border-radius: 16px; background: #f8fafc; text-align: center; }
    .pdf-icon { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 12px; border-radius: 14px; background: #fff0ef; color: #b42318; font-weight: 800; }
    .pdf-empty strong { display: block; font-size: 17px; }
    .pdf-empty p { max-width: 560px; margin: 7px auto 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .pdf-path { display: inline-block; margin-top: 13px; padding: 7px 10px; border-radius: 8px; background: #eef1f5; color: #3f4c5b; font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; overflow-wrap: anywhere; }
    .pdf-ready { display: none; }
    .pdf-ready.active { display: block; }
    .pdf-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 15px; }
    .action-link { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 9px 14px; border: 1px solid #cfd8e3; border-radius: 11px; background: #fff; color: var(--blue); font-size: 13px; font-weight: 720; text-decoration: none; }
    .action-link.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    .pdf-frame { width: 100%; height: min(680px,72vh); border: 1px solid #dfe5ec; border-radius: 14px; background: #eef1f5; }
    .legal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .legal-block { padding: 17px; border-left: 3px solid #8bb9ed; background: #f7fafe; }
    .legal-block span { color: var(--muted); font-size: 11px; font-weight: 750; text-transform: uppercase; }
    .legal-block p { margin: 7px 0 0; font-size: 14px; line-height: 1.58; }
    .legal-block a { color: var(--blue); overflow-wrap: anywhere; }
    .detail-sidebar { position: sticky; top: calc(var(--nav-height) + 18px); display: grid; gap: 13px; }
    .side-card { padding: 21px; border: 1px solid #dfe5ec; border-radius: 18px; background: #fff; }
    .side-value { display: block; margin-top: 7px; font-size: 15px; line-height: 1.5; }
    .side-rule { height: 1px; margin: 17px 0; background: #e4e8ed; }
    .side-card .action-link { width: 100%; margin-top: 15px; }
    .page-error { padding: 70px 24px; border: 1px solid #dfe5ec; border-radius: 22px; background: #fff; text-align: center; }
    .page-error h1 { margin: 0; font-size: 34px; }
    .page-error p { margin: 10px 0 22px; color: var(--muted); }
    @media (max-width: 980px) {
      .summary-strip { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .summary-item:nth-child(3) { padding-left: 0; border-left: 0; border-top: 1px solid #dfe5ec; }
      .detail-layout { grid-template-columns: 1fr; }
      .detail-sidebar { position: static; grid-row: 1; grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 680px) {
      .detail-shell { padding-top: 25px; }
      .detail-hero { margin-top: 19px; padding: 23px 19px; border-radius: 20px; }
      .summary-strip { grid-template-columns: 1fr; }
      .summary-item,.summary-item + .summary-item { padding: 15px 0; border-top: 1px solid #dfe5ec; border-left: 0; }
      .summary-item:first-child { border-top: 0; }
      .detail-sidebar { grid-template-columns: 1fr; }
      .section-headline { display: block; }
      .section-badge { display: inline-flex; margin-top: 10px; }
      .requirement { grid-template-columns: auto 1fr; }
      .requirement-tag { grid-column: 2; width: fit-content; }
      .legal-grid { grid-template-columns: 1fr; }
      .deadline-layout { grid-template-columns: 1fr; }
      .calendar-card { width: min(100%,280px); }
      .deadline-meta { grid-template-columns: 1fr; }
      .pdf-frame { height: 520px; }
    }
  </style>
</head>
<body class="service-detail-page" data-protected="true">
  <div class="access-notice"><strong>Ruang internal</strong> · panduan kerja layanan administrasi perpajakan</div>
  <nav class="site-nav" aria-label="Navigasi utama">
    <div class="nav-inner">
      <a class="nav-brand" href="saung.html"><img src="assets/img/LogoASD.svg" alt="Dhaniswara86"><span class="nav-brand-divider"></span><span class="nav-brand-name">Saung <b>Kabayan</b></span></a>
      <div class="desktop-menu"><a href="saung.html">Beranda</a><a href="layanan-perpajakan-djp.html" aria-current="page">Matriks Layanan</a><a href="saung.html#pustaka">Pustaka</a><a href="admin.html" data-admin-only>Admin</a></div>
      <div class="nav-actions"><span class="user-chip"><span class="user-avatar" data-user-initial>A</span><span data-user-name>Anggota Saung</span></span><button class="icon-button" type="button" data-logout aria-label="Keluar"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg></button><button class="icon-button menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="mobileMenu" aria-label="Buka menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
    </div>
  </nav>
  <div class="mobile-menu" id="mobileMenu"><a href="saung.html">Beranda</a><a href="layanan-perpajakan-djp.html">Matriks Layanan</a><a href="saung.html#pustaka">Pustaka</a><a href="admin.html" data-admin-only>Admin</a><button type="button" data-logout>Keluar</button></div>

  <main>
    <div class="container detail-shell" id="djpDetailRoot" aria-live="polite">
      <div id="detailLoading">Memuat detail layanan…</div>
    </div>
  </main>

  <footer><div class="container footer-inner"><span>Saung Kabayan · Katalog Bahan Pelayanan</span><span>Detail layanan DJP</span></div></footer>

  <script>
    (() => {
      "use strict";
      const root = document.getElementById("djpDetailRoot");
      const escapeHTML = value => String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
      const serviceId = new URLSearchParams(location.search).get("id") || "";
      const genericDocs = /dokumen pendukung sesuai ketentuan layanan/i;
      function requirementItems(item) {
        if (Array.isArray(item.requirements) && item.requirements.length) {
          return item.requirements.map(requirement => ({
            name: requirement.name || requirement.document || "Dokumen persyaratan",
            note: requirement.note || requirement.condition || "Pastikan dokumen masih berlaku dan dapat dibaca.",
            tag: requirement.status || (requirement.required === false ? "Kondisional" : "Wajib"),
            basis: requirement.basis || "",
            format: requirement.format || "",
            source: requirement.source || item.source || ""
          }));
        }
        const text = String(item.docs || "").trim();
        if (!text) return [];
        if (genericDocs.test(text)) return [{name:text,note:"Rincian per dokumen belum tersedia dalam basis data.",tag:"Perlu dirinci"}];
        return text.replace(/,\s+dan\s+/gi,", ").split(/,\s*/).map(name => ({name:name.trim(),note:"Periksa bentuk, masa berlaku, dan penandatangan sesuai ketentuan.",tag:"Disiapkan"})).filter(item => item.name);
      }

      function deadlineParts(sla) {
        const text = String(sla || "").trim();
        const entries = [...text.matchAll(/(\d+)\s*(hari kerja|hari kalender|hari|bulan|jam|tahun)/gi)];
        if (!entries.length) {
          if (/tidak (?:ditetapkan|ada)|belum ditetapkan/i.test(text)) return {value:"—",unit:"Tidak ditetapkan"};
          return {value:"Saat",unit:"Pelayanan"};
        }
        const units = [...new Set(entries.map(entry => entry[2].toLowerCase()))];
        if (units.length === 1) {
          const values = [...new Set(entries.map(entry => Number(entry[1])))].sort((a,b) => a-b);
          return {value:values.length === 1 ? String(values[0]) : `${values[0]}–${values.at(-1)}`,unit:units[0]};
        }
        return {value:entries[0][1],unit:entries[0][2].toLowerCase()};
      }

      function renderError() {
        root.innerHTML = `<div class="page-error"><h1>Layanan tidak ditemukan.</h1><p>Kode layanan tidak tersedia atau tautan yang dibuka tidak lengkap.</p><a class="action-link primary" href="layanan-perpajakan-djp.html">Kembali ke matriks</a></div>`;
      }

      function render(item) {
        const requirements = requirementItems(item);
        const needsDetail = !Array.isArray(item.requirements) && genericDocs.test(item.docs || "");
        const verified = item.requirements_status === "verified-regulation";
        const deadline = deadlineParts(item.sla);
        const pdfPath = `assets/docs/layanan/${encodeURIComponent(item.id)}/alur-proses.pdf`;
        const storageKey = `djp-checklist-${item.id}`;
        let checked = {};
        try { checked = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch (_) { checked = {}; }
        document.title = `${item.id} · ${item.name} | Saung Kabayan`;
        root.innerHTML = `
          <a class="back-link" href="layanan-perpajakan-djp.html">← Kembali ke matriks layanan</a>
          <article class="detail-hero">
            <div class="detail-kicker"><span class="detail-code">${escapeHTML(item.id)}</span><span class="detail-status">${escapeHTML(item.status)}</span></div>
            <h1>${escapeHTML(item.name)}</h1>
            <p class="detail-lead">Panduan ringkas untuk menyiapkan permohonan, memeriksa batas waktu penyelesaian, dan membuka dokumen alur proses apabila tersedia.</p>
            <div class="summary-strip">
              <div class="summary-item"><span>Unit</span><strong>${escapeHTML(item.unit)}</strong></div>
              <div class="summary-item"><span>Saluran</span><strong>${escapeHTML(item.channel)}</strong></div>
              <div class="summary-item"><span>Produk layanan</span><strong>${escapeHTML(item.output)}</strong></div>
            </div>
          </article>

          <div class="detail-layout">
            <div class="detail-main">
              <section class="content-section" id="persyaratan">
                <div class="section-headline"><div><span class="section-eyebrow">Sebelum mengajukan</span><h2>Persyaratan dokumen</h2></div><span class="section-badge">${needsDetail ? "Perlu perincian" : verified ? `${requirements.length} butir · terverifikasi` : `${requirements.length} butir`}</span></div>
                <div class="requirement-list">${requirements.length ? requirements.map((req,index) => `<label class="requirement"><input type="checkbox" data-requirement="${index}" ${checked[index] ? "checked" : ""}><span><strong>${escapeHTML(req.name)}</strong><small>${escapeHTML(req.note)}</small>${req.basis || req.format ? `<span class="requirement-basis">${req.basis ? `<span>Dasar: ${escapeHTML(req.basis)}</span>` : ""}${req.format ? `<span>Format: ${escapeHTML(req.format)}</span>` : ""}${req.source ? `<a href="${escapeHTML(req.source)}" target="_blank" rel="noopener">Buka regulasi ↗</a>` : ""}</span>` : ""}</span><em class="requirement-tag">${escapeHTML(req.tag)}</em></label>`).join("") : `<div class="pdf-empty"><strong>Persyaratan belum tersedia.</strong><p>Daftar dokumen perlu ditambahkan setelah diverifikasi terhadap ketentuan layanan.</p></div>`}</div>
                <div class="data-notice"><b>i</b><span>${needsDetail ? "Basis data saat ini baru memuat persyaratan umum. Jangan menjadikan daftar ini sebagai satu-satunya dasar pemeriksaan sampai rincian dokumen diverifikasi." : verified ? `Rincian ini telah dicocokkan dengan ketentuan yang disebutkan pada setiap butir. Terakhir ditelaah ${escapeHTML(item.reviewed_at || "5 September 2026")}.` : "Checklist disusun dari ringkasan dokumen pada matriks. Pastikan kembali bentuk dokumen dan ketentuan teknis pada sumber resmi."}</span></div>
              </section>

              <section class="content-section" id="batas-waktu">
                <div class="deadline-layout">
                  <div class="calendar-card" aria-label="Batas waktu penyelesaian ${escapeHTML(item.sla)}">
                    <div class="calendar-top"><span>Batas waktu</span><span class="calendar-rings" aria-hidden="true"><i></i><i></i></span></div>
                    <div class="calendar-body"><strong class="calendar-value">${escapeHTML(deadline.value)}</strong><span class="calendar-unit">${escapeHTML(deadline.unit)}</span></div>
                  </div>
                  <div class="deadline-copy">
                    <span class="section-eyebrow">Jangka waktu layanan</span>
                    <h2>Berapa lama prosesnya?</h2>
                    <p class="deadline-full">${escapeHTML(item.sla)}</p>
                    <div class="deadline-meta">
                      <div><span>Mulai dihitung</span><strong>${escapeHTML(item.start)}</strong></div>
                      <div><span>Jika melewati batas</span><strong>${escapeHTML(item.overdue)}</strong></div>
                    </div>
                  </div>
                </div>
              </section>

              <section class="content-section" id="dokumen-alur">
                <div class="section-headline"><div><span class="section-eyebrow">Lampiran operasional</span><h2>PDF alur proses</h2></div><span class="section-badge" id="pdfStatus">Memeriksa…</span></div>
                <div class="pdf-empty" id="pdfEmpty"><span class="pdf-icon">PDF</span><strong>Alur proses belum dilampirkan.</strong><p>Unggah PDF menggunakan struktur nama di bawah. Halaman akan menampilkannya secara otomatis.</p><code class="pdf-path">${escapeHTML(pdfPath)}</code></div>
                <div class="pdf-ready" id="pdfReady"><div class="pdf-actions"><a class="action-link primary" id="pdfOpen" target="_blank" rel="noopener">Buka PDF ↗</a><a class="action-link" id="pdfDownload" download>Unduh PDF</a></div><iframe class="pdf-frame" id="pdfFrame" title="Pratinjau PDF alur proses"></iframe></div>
              </section>

              <section class="content-section" id="ketentuan">
                <div class="section-headline"><div><span class="section-eyebrow">Ketentuan layanan</span><h2>SLA dan dasar hukum</h2></div></div>
                <div class="legal-grid"><div class="legal-block"><span>Jika SLA terlampaui</span><p>${escapeHTML(item.overdue)}</p></div><div class="legal-block"><span>Dasar hukum utama</span><p>${escapeHTML(item.basis)}</p></div></div>
              </section>
            </div>

            <aside class="detail-sidebar">
              <div class="side-card"><span class="side-label">Pemohon</span><strong class="side-value">${escapeHTML(item.applicant)}</strong><div class="side-rule"></div><span class="side-label">Kategori</span><strong class="side-value">${escapeHTML(item.category)}</strong><div class="side-rule"></div><span class="side-label">Status persyaratan</span><strong class="side-value">${verified ? "Terverifikasi terhadap regulasi" : needsDetail ? "Belum diperinci" : "Ringkasan awal"}</strong><div class="side-rule"></div><span class="side-label">Terakhir ditelaah</span><strong class="side-value">${escapeHTML(item.reviewed_at || "5 September 2026")}</strong></div>
              <div class="side-card"><span class="side-label">Sumber resmi</span><strong class="side-value">Buka regulasi untuk memeriksa ketentuan lengkap dan perubahan terakhir.</strong><a class="action-link" href="${escapeHTML(item.source)}" target="_blank" rel="noopener">Buka sumber resmi ↗</a></div>
              <div class="side-card"><span class="side-label">Catatan operasional</span><strong class="side-value">${escapeHTML(item.note)}</strong></div>
            </aside>
          </div>`;

        root.querySelectorAll("[data-requirement]").forEach(input => input.addEventListener("change", () => {
          checked[input.dataset.requirement] = input.checked;
          localStorage.setItem(storageKey, JSON.stringify(checked));
        }));

        fetch(pdfPath,{method:"HEAD",cache:"no-store"}).then(response => {
          const status = document.getElementById("pdfStatus");
          if (!response.ok) { status.textContent = "Belum tersedia"; return; }
          document.getElementById("pdfEmpty").hidden = true;
          document.getElementById("pdfReady").classList.add("active");
          document.getElementById("pdfOpen").href = pdfPath;
          document.getElementById("pdfDownload").href = pdfPath;
          document.getElementById("pdfFrame").src = pdfPath;
          status.textContent = "Tersedia";
        }).catch(() => { document.getElementById("pdfStatus").textContent = "Belum tersedia"; });
      }

      fetch("assets/data/layanan-perpajakan-djp.json",{cache:"no-store"})
        .then(response => { if (!response.ok) throw new Error("Data layanan gagal dimuat"); return response.json(); })
        .then(services => { const item = services.find(entry => entry.id === serviceId); if (!item) return renderError(); render(item); })
        .catch(renderError);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/saung.js"></script>
</body>
</html>
