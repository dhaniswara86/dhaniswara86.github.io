<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Logo Saung Kabayan</title>
  <desc id="desc">Logo Saung Kabayan dengan ikon rumah saung berwarna biru dan wordmark Saung Kabayan.</desc>
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E86FF"/>
      <stop offset="100%" stop-color="#126FE8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#126FE8" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="40" fill="white"/>

  <g transform="translate(52 58)" filter="url(#softShadow)">
    <rect x="0" y="0" width="250" height="244" rx="44" fill="#F5F9FF"/>

    <!-- Roof / saung frame -->
    <path d="M42 118L125 52L208 118" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62 112V188C62 194.627 67.3726 200 74 200H176C182.627 200 188 194.627 188 188V112" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Open saung pavilion lines -->
    <path d="M88 200V143H162V200" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 202H205" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M86 89H164" stroke="url(#blueGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M74 153H176" stroke="url(#blueGrad)" stroke-width="10" stroke-linecap="round" opacity="0.28"/>

    <!-- decorative dot -->
    <circle cx="198" cy="45" r="8" fill="#126FE8"/>
  </g>

  <g transform="translate(352 88)">
    <text x="0" y="78" fill="#11284D" font-family="Inter, Montserrat, Poppins, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5">Saung</text>
    <text x="0" y="164" fill="#11284D" font-family="Inter, Montserrat, Poppins, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5">Kabayan</text>
    <rect x="2" y="194" width="120" height="9" rx="4.5" fill="#126FE8" opacity="0.18"/>
  </g>
</svg>
