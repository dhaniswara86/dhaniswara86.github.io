<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Permintaan akses pengguna Saung Kabayan.">
  <meta name="theme-color" content="#f8fbff">
  <title>Permintaan Akses | Saung Kabayan</title>

  <style>
    :root{
      --navy:#10294d;
      --navy-2:#183252;
      --muted:#6f819e;
      --blue:#126fe8;
      --blue-dark:#075fcf;
      --yellow:#F6C453;
      --yellow-dark:#E7AC2E;
      --line:#d8e3ef;
      --page:#f8fbff;
      --white:#fff;
      --danger:#b42318;
      --shadow:0 24px 70px rgba(29,63,112,.11);
    }

    *,*::before,*::after{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:var(--page);
    }

    body{
      color:var(--navy);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      overflow-x:hidden;
    }

    button,input,textarea{font:inherit}
    a{color:inherit}

    .page{
      width:100%;
      min-height:100svh;
      display:grid;
      grid-template-columns:minmax(500px,39%) minmax(0,61%);
      background:#fff;
    }

    /* LEFT */
    .left{
      position:relative;
      z-index:5;
      min-width:0;
      min-height:100svh;
      padding:clamp(22px,3vh,34px) clamp(28px,4.5vw,76px) clamp(28px,4vh,44px);
      background:
        radial-gradient(circle at 105% 0%,rgba(224,239,255,.88) 0 14%,rgba(248,251,255,0) 37%),
        linear-gradient(180deg,#fff 0%,#fbfdff 70%,#f8fbff 100%);
    }

    .left::after{
      content:"";
      position:absolute;
      pointer-events:none;
      z-index:-1;
      top:-4%;
      right:-145px;
      width:290px;
      height:108%;
      border-radius:48% 54% 46% 55% / 44% 49% 56% 50%;
      background:linear-gradient(90deg,
        rgba(255,255,255,.99) 0%,
        rgba(255,255,255,.94) 44%,
        rgba(255,255,255,.48) 74%,
        rgba(255,255,255,0) 100%);
    }

    .brand{
      display:inline-flex;
      align-items:center;
      gap:13px;
      text-decoration:none;
      width:max-content;
      color:var(--navy);
    }

    .brand-mark{
      width:48px;
      height:48px;
      color:var(--blue);
      flex:0 0 auto;
    }

    .brand-mark svg{width:100%;height:100%;display:block}

    .brand-name{
      font-size:20px;
      font-weight:850;
      line-height:1.03;
      letter-spacing:-.025em;
    }

    .brand-name span{display:block}

    .form-wrap{
      width:min(100%,520px);
      margin:clamp(24px,3.8vh,38px) 0 0;
    }

    .card{
      width:100%;
      padding:clamp(28px,3vw,42px) clamp(26px,3.2vw,42px) 28px;
      border:1px solid rgba(207,222,239,.96);
      border-radius:32px;
      background:rgba(255,255,255,.94);
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .eyebrow{
      margin:0 0 17px;
      color:#7489a7;
      font-size:13px;
      line-height:1;
      font-weight:850;
      letter-spacing:.19em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      max-width:390px;
      font-size:clamp(42px,3.6vw,58px);
      line-height:.97;
      font-weight:880;
      letter-spacing:-.05em;
      color:var(--navy);
    }

    h1 .dot{color:var(--yellow-dark)}

    .intro{
      margin:13px 0 22px;
      max-width:390px;
      color:var(--muted);
      font-size:15px;
      line-height:1.48;
    }

    .form{
      display:grid;
      gap:13px;
    }

    .field{
      display:grid;
      gap:7px;
    }

    .field label{
      color:var(--navy-2);
      font-size:13px;
      font-weight:780;
    }

    .input-shell,
    .textarea-shell{
      min-width:0;
      display:flex;
      align-items:center;
      gap:11px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      transition:border-color .18s ease,box-shadow .18s ease;
    }

    .input-shell{
      height:52px;
      padding:0 14px;
    }

    .textarea-shell{
      align-items:flex-start;
      min-height:82px;
      padding:13px 14px;
    }

    .input-shell:focus-within,
    .textarea-shell:focus-within{
      border-color:rgba(18,111,232,.66);
      box-shadow:0 0 0 4px rgba(18,111,232,.08);
    }

    .input-icon{
      width:20px;
      height:20px;
      flex:0 0 auto;
      color:#8297b3;
    }

    .textarea-shell .input-icon{margin-top:1px}

    .input-icon svg,
    .password-toggle svg{
      width:100%;
      height:100%;
      display:block;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .input-shell input,
    .textarea-shell textarea{
      width:100%;
      min-width:0;
      border:0;
      outline:0;
      background:transparent;
      color:#132d4c;
      font-size:15px;
    }

    .input-shell input{height:100%}

    .textarea-shell textarea{
      min-height:54px;
      padding:0;
      resize:vertical;
      line-height:1.45;
    }

    .input-shell input::placeholder,
    .textarea-shell textarea::placeholder{color:#9badc2}

    .password-toggle{
      width:34px;
      height:34px;
      padding:7px;
      border:0;
      border-radius:50%;
      background:transparent;
      color:#7e94b0;
      cursor:pointer;
      flex:0 0 auto;
    }

    .password-toggle:hover{
      background:#f2f7fc;
      color:var(--blue);
    }

    .form-help{
      margin:-1px 0 0;
      display:flex;
      align-items:center;
      gap:7px;
      color:#7487a2;
      font-size:12px;
      line-height:1.4;
    }

    .form-help svg{
      width:16px;
      height:16px;
      flex:0 0 auto;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .form-status{
      min-height:0;
      margin:0;
      color:var(--danger);
      font-size:12px;
      line-height:1.35;
    }

    .form-status:not(:empty){
      min-height:16px;
      margin-top:1px;
    }

    .submit{
      width:100%;
      height:54px;
      margin-top:2px;
      border:0;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      background:linear-gradient(135deg,#FFD66B 0%,var(--yellow) 56%,var(--yellow-dark) 100%);
      color:var(--navy);
      font-size:15px;
      font-weight:850;
      cursor:pointer;
      box-shadow:0 13px 28px rgba(231,172,46,.25);
      transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
    }

    .submit:hover{
      transform:translateY(-1px);
      box-shadow:0 16px 34px rgba(231,172,46,.32);
      filter:brightness(1.015);
    }

    .submit:active{transform:translateY(0)}

    .submit .arrow{
      font-size:21px;
      line-height:1;
    }

    .back-link{
      margin-top:18px;
      display:flex;
      justify-content:center;
    }

    .back-link a{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:#096bd8;
      text-decoration:none;
      font-size:13px;
      font-weight:760;
    }

    .back-link a:hover{text-decoration:underline}

    .back-link svg{
      width:18px;
      height:18px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.9;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* RIGHT HERO */
    .hero{
      position:sticky;
      top:0;
      align-self:start;
      min-width:0;
      height:100svh;
      overflow:hidden;
      background:#dcecff;
    }

    .hero-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:50% center;
    }

    .hero::before{
      content:"";
      position:absolute;
      z-index:2;
      pointer-events:none;
      inset:0 auto 0 0;
      width:24%;
      background:linear-gradient(90deg,
        #fff 0%,
        rgba(255,255,255,.82) 28%,
        rgba(255,255,255,.36) 62%,
        rgba(255,255,255,0) 100%);
    }

    .hero::after{
      content:"";
      position:absolute;
      z-index:2;
      pointer-events:none;
      left:-135px;
      bottom:-185px;
      width:450px;
      height:430px;
      border-radius:50%;
      background:rgba(255,255,255,.77);
    }

    /* Medium desktop */
    @media (max-width:1280px){
      .page{grid-template-columns:minmax(465px,42%) minmax(0,58%)}
      .left{padding-left:34px;padding-right:34px}
      .form-wrap{max-width:485px}
      .hero-img{object-position:52% center}
    }

    /* Short desktop/laptop: reduce form density but keep all fields visible with page scroll. */
    @media (max-height:820px) and (min-width:901px){
      .left{padding-top:18px;padding-bottom:24px}
      .brand-mark{width:40px;height:40px}
      .brand-name{font-size:17px}
      .form-wrap{margin-top:18px}
      .card{padding:24px 30px 22px;border-radius:28px}
      .eyebrow{margin-bottom:12px;font-size:11px}
      h1{font-size:40px}
      .intro{margin:9px 0 16px;font-size:13px}
      .form{gap:9px}
      .field{gap:5px}
      .field label{font-size:12px}
      .input-shell{height:45px}
      .textarea-shell{min-height:68px;padding-top:10px;padding-bottom:10px}
      .textarea-shell textarea{min-height:44px}
      .submit{height:48px}
      .back-link{margin-top:13px}
    }

    /* Tablet/mobile */
    @media (max-width:900px){
      .page{
        display:flex;
        flex-direction:column;
        min-height:100svh;
      }

      .hero{
        position:relative;
        order:0;
        width:100%;
        height:39svh;
        min-height:310px;
      }

      .hero-img{object-position:50% 40%}

      .hero::before{
        inset:auto 0 0 0;
        width:auto;
        height:52%;
        background:linear-gradient(0deg,#fff 0%,rgba(255,255,255,.58) 48%,rgba(255,255,255,0) 100%);
      }

      .hero::after{display:none}

      .left{
        order:1;
        min-height:auto;
        padding:0 22px 34px;
        background:#fff;
      }

      .left::after{display:none}

      .brand{
        position:relative;
        z-index:8;
        margin-top:-36px;
        padding:8px 11px;
        border-radius:16px;
        background:rgba(255,255,255,.9);
        backdrop-filter:blur(10px);
        -webkit-backdrop-filter:blur(10px);
        box-shadow:0 10px 30px rgba(16,41,77,.08);
      }

      .brand-mark{width:38px;height:38px}
      .brand-name{font-size:16px}

      .form-wrap{
        width:min(100%,620px);
        margin:18px auto 0;
      }

      .card{
        padding:30px clamp(22px,6vw,40px) 24px;
        border-radius:28px;
      }

      h1{font-size:clamp(42px,10vw,56px)}
    }

    @media (max-width:520px){
      .hero{
        height:34svh;
        min-height:260px;
      }

      .hero-img{object-position:50% 43%}

      .left{
        padding-left:16px;
        padding-right:16px;
      }

      .brand{
        margin-top:-30px;
        padding:7px 9px;
      }

      .brand-mark{width:34px;height:34px}
      .brand-name{font-size:14px}

      .form-wrap{margin-top:14px}

      .card{
        padding:25px 19px 21px;
        border-radius:24px;
      }

      .eyebrow{font-size:11px;margin-bottom:14px}
      h1{font-size:42px}
      .intro{font-size:14px;margin:11px 0 19px}
      .input-shell{height:50px}
      .textarea-shell{min-height:76px}
      .submit{height:52px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        scroll-behavior:auto!important;
        transition:none!important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="left" aria-label="Permintaan akses Saung Kabayan">
      <a class="brand" href="index.html" aria-label="Kembali ke Saung Kabayan">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M9 27 32 9l23 18" stroke="currentColor" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 25v28h34V25" stroke="currentColor" stroke-width="5.2" stroke-linejoin="round"/>
            <path d="M23 53V37h18v16" stroke="currentColor" stroke-width="5.2" stroke-linejoin="round"/>
            <path d="M11 53h42" stroke="currentColor" stroke-width="5.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-name"><span>Saung</span><span>Kabayan</span></span>
      </a>

      <div class="form-wrap">
        <div class="card">
          <p class="eyebrow">Permohonan Pengguna</p>
          <h1>Ajukan akses<span class="dot">.</span></h1>
          <p class="intro">Pastikan data sesuai agar admin dapat melakukan verifikasi.</p>

          <form class="form" id="requestForm">

            <div class="field">
              <label for="name">Nama lengkap</label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                </span>
                <input id="name" name="name" autocomplete="name" placeholder="Masukkan nama lengkap Anda" required>
              </div>
            </div>

            <div class="field">
              <label for="requestEmail">Email kedinasan</label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
                </span>
                <input id="requestEmail" name="email" type="email" autocomplete="email" placeholder="nama@contoh.go.id" required>
              </div>
            </div>

            <div class="field">
              <label for="unit">Unit atau bagian</label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M4 21V7l8-4 8 4v14"/><path d="M8 10h1M8 14h1M8 18h1M15 10h1M15 14h1M15 18h1M3 21h18"/></svg>
                </span>
                <input id="unit" name="unit" placeholder="Contoh: Seksi Pelayanan" required>
              </div>
            </div>

            <div class="field">
              <label for="reason">Keperluan akses</label>
              <div class="textarea-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 11h6M9 15h6"/></svg>
                </span>
                <textarea id="reason" name="reason" placeholder="Jelaskan secara singkat kebutuhan akses Anda" required></textarea>
              </div>
            </div>

            <div class="field">
              <label for="requestPassword">Buat password</label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3"/><rect x="5" y="10" width="14" height="11" rx="2"/></svg>
                </span>
                <input id="requestPassword" name="password" type="password" autocomplete="new-password" minlength="10" placeholder="Minimal 10 karakter" required>
                <button class="password-toggle" type="button" data-toggle-password="requestPassword" aria-label="Tampilkan password">
                  <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                </button>
              </div>
            </div>

            <div class="field">
              <label for="passwordConfirmation">Ulangi password</label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3"/><rect x="5" y="10" width="14" height="11" rx="2"/></svg>
                </span>
                <input id="passwordConfirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="10" placeholder="Masukkan ulang password" required>
                <button class="password-toggle" type="button" data-toggle-password="passwordConfirmation" aria-label="Tampilkan ulang password">
                  <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                </button>
              </div>
            </div>

            <p class="form-help">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>
              Admin tidak dapat melihat password Anda.
            </p>

            <p class="form-status" id="requestStatus" aria-live="polite"></p>

            <button class="submit" type="submit">
              Kirim Permohonan <span class="arrow" aria-hidden="true">→</span>
            </button>

          </form>

          <div class="back-link">
            <a href="index.html">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h10"/></svg>
              Kembali ke halaman masuk
            </a>
          </div>
        </div>
      </div>
    </section>

    <section class="hero" aria-label="Ilustrasi Saung Kabayan">
      <img class="hero-img" src="assets/img/saung-kabayan-daftar-hero.webp" alt="Kabayan di saung sedang memeriksa permintaan akses">
    </section>

  </main>

  <script>
    document.querySelectorAll("[data-toggle-password]").forEach(function(button){
      button.addEventListener("click", function(){
        var input = document.getElementById(button.getAttribute("data-toggle-password"));
        if (!input) return;
        var isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        button.setAttribute("aria-label", isPassword ? "Sembunyikan password" : "Tampilkan password");
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/saung.js"></script>
</body>
</html>
