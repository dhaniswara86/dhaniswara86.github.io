  <title>Hot News | Kabayan</title>

  <link
    rel="stylesheet"

</head>

      <p>

        </div>

        <span id="hotnewsCount"></span>

      <div
        class="hotnews-grid"

      ></div>

  <!-- Tempel footer Kabayan di sini -->
