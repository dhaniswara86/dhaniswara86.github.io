<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kabayan — Verifikasi Sertifikat</title>
<style>
:root{--ink:#111;--yellow:#ffc91b;--bg:#f6f6f2;--line:#e5e5df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding:64px 24px}.rule{height:3px;background:#111;margin-bottom:18px}
.kicker{font-size:13px;font-weight:800;letter-spacing:.08em}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px;margin-top:28px}
.num{display:inline-grid;place-items:center;width:92px;height:92px;border-radius:18px;background:var(--yellow);font-size:34px;font-weight:900}
h1{font-size:52px;line-height:1;letter-spacing:-.05em;margin:26px 0 12px}.muted{color:#6b6b68;line-height:1.6}
.code{margin-top:18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f6f6f2;border-radius:12px;padding:14px;word-break:break-all}
.note{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;font-size:13px;color:#6b6b68;line-height:1.6}
</style></head><body><div class="wrap"><div class="rule"></div><div class="kicker">KABAYAN / VERIFIKASI SERTIFIKAT</div>
<div class="card"><div class="num">01</div><h1>Sertifikat.<br>Terverifikasi.</h1><p class="muted">Kode verifikasi yang dibaca dari QR:</p>
<div class="code" id="code">—</div><div class="note">Mode prototipe. Versi produksi akan mencocokkan kode ini dengan database sertifikat dan menampilkan nama, nomor, kegiatan, tanggal, serta status valid/tidak valid.</div></div></div>
<script>const p=new URLSearchParams(location.search);document.getElementById('code').textContent=p.get('id')||'Kode tidak tersedia';</script></body></html>
