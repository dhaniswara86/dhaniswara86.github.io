<!doctype html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/><meta content="#f5f7fb" name="theme-color"/>
<title>Kuis Modul — Kabayan Learning</title>
<link href="assets/css/lms.css" rel="stylesheet"/><link href="assets/css/lms-audit.css" rel="stylesheet"/>
</head>
<body class="quiz-page">
<header class="site-header">
<nav class="nav">
<a class="brand" href="peserta-dashboard.html">Kabayan <span>Learning</span></a>
<div class="nav-actions">
<span class="muted" id="quizProgressMini"></span>
<button class="btn ghost small" onclick="KabayanAuth.signOut()" type="button">Keluar</button>
</div>
</nav>
</header>
<main class="quiz-shell">
<section class="surface quiz-loading" id="quizLoading">
<div class="eyebrow">Kuis Modul</div>
<h1>Menyiapkan soal…</h1>
<p class="muted">Jawaban Anda akan tersimpan otomatis.</p>
</section>
<section class="quiz-workspace hidden" id="quizWorkspace">
<div class="quiz-workspace-head">
<div>
<div class="eyebrow" id="quizAttemptLabel">Percobaan</div>
<h1 id="quizTitle"></h1>
<p id="quizDescription"></p>
</div>
<div class="quiz-score-rule">
<span>Nilai lulus</span>
<strong id="quizPassScore">70</strong>
</div>
</div>
<div class="quiz-progress-track">
<div class="quiz-progress-fill" id="quizProgressBar"></div>
</div>
<article class="surface quiz-question-stage">
<div class="quiz-question-meta">
<span id="questionNumber">Soal 1</span>
<span id="saveStatus">Belum dijawab</span>
</div>
<h2 id="questionText"></h2>
<div class="quiz-option-list" id="optionList"></div>
<div class="quiz-navigation">
<button class="btn ghost" id="prevQuestionBtn" type="button">← Sebelumnya</button>
<button class="btn secondary" id="nextQuestionBtn" type="button">Berikutnya →</button>
<button class="btn hidden" id="submitQuizBtn" type="button">Kirim jawaban</button>
</div>
</article>
<div class="quiz-question-navigator" id="questionNavigator"></div>
</section>
<section class="hidden" id="quizResult"></section>
<section class="surface quiz-loading hidden" id="quizError">
<div class="eyebrow">Kuis Tidak Dapat Dibuka</div>
<h1>Belum dapat memulai kuis.</h1>
<p class="muted" id="quizErrorMessage"></p>
<a class="btn" href="peserta-dashboard.html" id="backToClassBtn">Kembali ke kelas</a>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/kuis-modul.js"></script>
</body>
</html>
