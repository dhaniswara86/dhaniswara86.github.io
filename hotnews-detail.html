<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Baca informasi dan pembaruan perpajakan terkini di Kabayan Hot News."
  >

  <title>Hot News | Kabayan</title>

  <link
    rel="stylesheet"
    href="assets/css/hotnews.css"
  >
</head>

<body>
  <!-- =========================================
       HEADER KABAYAN
       Untuk sementara dapat menggunakan header
       sederhana ini.
       ========================================= -->

  <header class="kabayan-header">
    <div class="kabayan-header-inner">
      <a
        class="kabayan-brand"
        href="index.html"
      >
        Kabayan
      </a>

      <nav
        class="kabayan-navigation"
        aria-label="Navigasi utama"
      >
        <a href="index.html">
          Beranda
        </a>

        <a href="hotnews.html">
          Hot News
        </a>
      </nav>
    </div>
  </header>

  <!-- =========================================
       ISI DETAIL ARTIKEL
       Konten akan dimasukkan oleh JavaScript.
       ========================================= -->

  <main class="hotnews-detail-page">
    <article
      id="hotnews-article"
      class="hotnews-article"
    >
      <div class="hotnews-loading">
        <p>Memuat artikel...</p>
      </div>
    </article>
  </main>

  <!-- =========================================
       FOOTER
       ========================================= -->

  <footer class="kabayan-footer">
    <div class="kabayan-footer-inner">
      <p>
        Kabayan — Informasi Perpajakan yang Lebih Mudah Dipahami
      </p>
    </div>
  </footer>

  <!-- Data artikel harus dimuat terlebih dahulu. -->
  <script src="assets/js/hotnews-data.js"></script>

  <!-- Script untuk menampilkan detail artikel. -->
  <script src="assets/js/hotnews-detail.js"></script>
</body>
</html>
