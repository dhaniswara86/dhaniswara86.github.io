<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, follow"
  >

  <title>Mengalihkan Artikel | Kabayan</title>

  <style>
    :root {
      --primary: #173b67;
      --text: #172b45;
      --muted: #667085;
      --background: #f6f8fb;
      --white: #ffffff;
      --accent: #d6a63c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      padding: 24px;

      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);
      background: var(--background);
    }

    .redirect-card {
      width: min(520px, 100%);
      padding: 36px;

      border: 1px solid rgba(23, 59, 103, 0.12);
      border-radius: 24px;

      text-align: center;

      background: var(--white);

      box-shadow:
        0 18px 50px rgba(23, 43, 70, 0.09);
    }

    .redirect-mark {
      display: inline-flex;
      width: 54px;
      height: 54px;
      margin-bottom: 20px;

      align-items: center;
      justify-content: center;

      border-radius: 17px;

      font-size: 0.82rem;
      font-weight: 800;

      color: #ffffff;
      background: var(--primary);
    }

    h1 {
      margin: 0 0 12px;

      font-size: 1.7rem;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 22px;

      line-height: 1.7;

      color: var(--muted);
    }

    a {
      display: inline-flex;
      min-height: 44px;
      padding: 0 18px;

      align-items: center;
      justify-content: center;

      border-radius: 999px;

      font-size: 0.9rem;
      font-weight: 750;

      color: #ffffff;
      background: var(--primary);

      text-decoration: none;
    }

    a:hover {
      background: #102f55;
    }

    .loading-line {
      width: 100%;
      height: 4px;
      margin-top: 25px;
      overflow: hidden;

      border-radius: 999px;

      background: rgba(23, 59, 103, 0.1);
    }

    .loading-line::after {
      display: block;
      width: 40%;
      height: 100%;

      border-radius: inherit;

      background: var(--accent);

      animation: loading 1.1s infinite ease-in-out;

      content: "";
    }

    @keyframes loading {
      from {
        transform: translateX(-110%);
      }

      to {
        transform: translateX(250%);
      }
    }
  </style>

  <script>
    (function () {
      "use strict";

      /*
       * Daftar pengalihan dari ID lama
       * menuju alamat artikel permanen.
       *
       * Setiap artikel lama dapat ditambahkan
       * ke dalam objek ini.
       */
      const articleRedirects = {
        "coretax-role-baru-pph21-hanya-induk":
          "/hotnews/2026/08/coretax-role-baru-pph21-hanya-induk/"
      };

      const parameters =
        new URLSearchParams(
          window.location.search
        );

      const articleId =
        parameters.get("id");

      const destination =
        articleRedirects[articleId] ||
        "/hotnews.html";

      /*
       * location.replace digunakan agar halaman
       * pengalihan tidak memenuhi riwayat browser.
       */
      window.location.replace(
        destination
      );
    })();
  </script>
</head>

<body>
  <main class="redirect-card">
    <div
      class="redirect-mark"
      aria-hidden="true"
    >
      ASD
    </div>

    <h1>
      Mengalihkan ke artikel
    </h1>

    <p>
      Artikel Hot News telah dipindahkan ke alamat
      permanen dalam arsip Kabayan.
    </p>

    <a href="hotnews.html">
      Buka Kabayan Hot News
    </a>

    <div
      class="loading-line"
      aria-hidden="true"
    ></div>
  </main>
</body>
</html>
