<!doctype html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/><meta content="#f5f7fb" name="theme-color"/>
<title>Kelas — Kabayan Learning</title>
<link href="assets/css/lms.css" rel="stylesheet"/>
<link href="assets/css/evaluasi-akhir.css" rel="stylesheet"/><link href="assets/css/lms-audit.css" rel="stylesheet"/>
</head>
<body class="learning-class-page">
<header class="site-header">
<nav class="nav">
<a class="brand" href="peserta-dashboard.html">Kabayan <span>Learning</span></a>
<div class="nav-actions">
<a class="btn ghost small" href="peserta-dashboard.html">← Kelas Saya</a>
<button class="btn ghost small" onclick="KabayanAuth.signOut()" type="button">Keluar</button>
</div>
</nav>
</header>
<main class="page">
<section class="hero">
<div>
<div class="eyebrow">Kelas Saya</div>
<h1 id="className">Memuat kelas…</h1>
<p id="classDescription"></p>
</div>
<div class="surface progress-card">
<div class="progress-top">
<div>
<div class="eyebrow">Progress</div>
<div class="muted" id="progressText">0 checkpoint selesai</div>
</div>
<div class="progress-percent" id="progressPercent">0%</div>
</div>
<div class="progress-track">
<div class="progress-fill" id="progressBar"></div>
</div>
</div>
</section>
<div id="moduleList"></div>
</main>
<dialog class="lesson-reader-dialog" id="lessonModal">
<div class="dialog-body lesson-reader">
<div class="lesson-reader-top">
<div>
<div class="eyebrow">Checkpoint</div>
<h2 id="lessonTitle"></h2>
<div class="lesson-meta" id="lessonMeta"></div>
</div>
<button aria-label="Tutup" class="icon-close" onclick="document.getElementById('lessonModal').close()" type="button">×</button>
</div>
<article class="lesson-content" id="lessonContent"></article>
<div class="dialog-actions">
<button class="btn ghost" onclick="document.getElementById('lessonModal').close()" type="button">Tutup</button>
<button class="btn" id="completeLessonBtn" type="button">Tandai selesai</button>
</div>
</div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/kelas-belajar.js"></script>
</body>
</html>
