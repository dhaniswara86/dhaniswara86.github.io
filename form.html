<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kabayan Form Engine">
  <title>Formulir | Kabayan</title>
  <link rel="stylesheet" href="assets/form-engine/form.css?v=20260830-2">
</head>
<body id="top">
  <header class="site-nav no-print">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html" aria-label="Kabayan — Kembali ke beranda">
        <img class="brand-logo" src="images/LogoASD.svg" alt="Logo dhaniswara86">
        <span>| <strong>dhaniswara86</strong></span>
      </a>

      <nav aria-label="Navigasi utama" class="desktop-menu">
        <a href="index.html">Beranda</a>
        <a href="buku.html">Buku</a>
        <a href="formulir.html" aria-current="page">Formulir</a>
        <a href="aplikasi.html">Aplikasi</a>
        <a href="kalkulator.html">Kalkulator</a>
        <a href="artikel.html">Artikel</a>
        <a class="nav-hotnews" href="hotnews.html">
          <span aria-hidden="true" class="nav-hotnews-icon">🔥</span>
          <span>Hot News</span>
        </a>
      </nav>

      <div class="nav-actions">
        <button aria-expanded="false" aria-label="Buka menu" class="menu-toggle" id="menuToggle" type="button">
          ☰
        </button>
      </div>
    </div>
  </header>

  <nav class="mobile-menu no-print" id="mobileMenu">
    <a href="index.html">Beranda</a>
    <a href="buku.html">Buku</a>
    <a href="formulir.html">Formulir</a>
    <a href="aplikasi.html">Aplikasi</a>
    <a href="kalkulator.html">Kalkulator</a>
    <a href="artikel.html">Artikel</a>
    <a class="nav-hotnews" href="hotnews.html">
      <span aria-hidden="true" class="nav-hotnews-icon">🔥</span>
      <span>Hot News</span>
    </a>
  </nav>

  <main>
    <section class="hero no-print">
      <div class="hero-inner">
        <span class="eyebrow">Formulir interaktif</span>
        <h1 id="heroTitle">Memuat formulir...</h1>
        <p id="heroDescription"></p>
      </div>
    </section>

    <section class="workspace">
      <div class="workspace-inner">
        <header class="toolbar no-print">
          <div>
            <h2 id="toolbarTitle">Formulir</h2>
            <p>Data diproses hanya pada perangkat Anda.</p>
          </div>
          <div class="actions">
            <a class="back" href="formulir.html">Kembali</a>
            <button class="btn reset" id="resetBtn" type="button">Kosongkan</button>
            <button class="btn print" id="printBtn" type="button">Buat Pratinjau Cetak</button>
          </div>
        </header>

        <div class="note no-print" id="formNotice" hidden></div>

        <div class="paper-wrap">
          <form class="paper" id="dynamicForm" autocomplete="off" novalidate>
            <div id="errorBox" class="error-box no-print" role="alert" aria-live="assertive"></div>
            <div id="formRoot" aria-live="polite">
              <p class="loading-message no-print">Memuat formulir...</p>
            </div>
          </form>
        </div>

        <section class="guide no-print" id="formGuide" hidden></section>
      </div>
    </section>
  </main>

  <noscript>
    <p class="noscript-message">JavaScript harus diaktifkan untuk membuka formulir interaktif ini.</p>
  </noscript>

  <script>
    const menuToggle = document.getElementById("menuToggle");
    const mobileMenu = document.getElementById("mobileMenu");

    if (menuToggle && mobileMenu) {
      menuToggle.addEventListener("click", () => {
        const isActive = mobileMenu.classList.toggle("active");
        document.body.classList.toggle("menu-open", isActive);
        menuToggle.setAttribute("aria-expanded", String(isActive));
        menuToggle.textContent = isActive ? "×" : "☰";
      });

      document.querySelectorAll(".mobile-menu a").forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.remove("active");
          document.body.classList.remove("menu-open");
          menuToggle.setAttribute("aria-expanded", "false");
          menuToggle.textContent = "☰";
        });
      });
    }
  </script>
  <script src="assets/form-engine/engine.js?v=20260830-2"></script>
</body>
</html>
