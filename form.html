  <style id="warisSignatureV3Styles">
    /* Komponen khusus Surat Pernyataan Pembagian Waris.
       Tidak mengubah renderer formulir lain. */
    .waris-v3-signature {
      margin-top: 30px;
    }

    .waris-v3-editor {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #d2d2d7;
      border-radius: 18px;
      background: #fafafa;
    }

    .waris-v3-editor-title {
      margin: 0 0 16px;
      font-size: 17px;
      font-weight: 700;
    }

    .waris-v3-date-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .waris-v3-field {
      display: grid;
      gap: 7px;
    }

    .waris-v3-field > span,
    .waris-v3-heir-label {
      color: #515154;
      font-size: 13px;
      font-weight: 600;
    }

    .waris-v3-field input,
    .waris-v3-heir-input {
      width: 100%;
      min-height: 44px;
      box-sizing: border-box;
      padding: 9px 11px;
      border: 1px solid #c7c7cc;
      border-radius: 10px;
      background: #fff;
      color: #1d1d1f;
      font: inherit;
    }

    .waris-v3-field input:focus,
    .waris-v3-heir-input:focus {
      border-color: #0071e3;
      outline: 3px solid rgba(0, 113, 227, .12);
    }

    .waris-v3-field input[aria-invalid="true"],
    .waris-v3-heir-input[aria-invalid="true"] {
      border-color: #c62828;
      outline: 3px solid rgba(198, 40, 40, .10);
    }

    .waris-v3-editor-columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 22px;
    }

    .waris-v3-editor-column {
      min-width: 0;
      padding: 16px;
      border-radius: 14px;
      background: #fff;
    }

    .waris-v3-editor-column h3 {
      margin: 0 0 14px;
      font-size: 16px;
    }

    .waris-v3-heir-list {
      display: grid;
      gap: 10px;
    }

    .waris-v3-heir-item {
      position: relative;
      padding: 12px;
      border: 1px solid #e1e1e6;
      border-radius: 12px;
    }

    .waris-v3-heir-label {
      display: block;
      margin-bottom: 7px;
    }

    .waris-v3-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 5px 9px;
      border: 0;
      border-radius: 999px;
      background: #f2f2f7;
      color: #6e6e73;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .waris-v3-actions {
      margin-top: 11px;
    }

    .waris-v3-add {
      padding: 9px 14px;
      border: 0;
      border-radius: 999px;
      background: #0071e3;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
    }

    .waris-v3-add:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    /* Preview dokumen disembunyikan di layar pengisian.
       Saat cetak, editor hilang dan preview ini yang tampil. */
    .waris-v3-print {
      display: none;
    }

    @media (max-width: 720px) {
      .waris-v3-date-fields,
      .waris-v3-editor-columns {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      .waris-v3-editor {
        display: none !important;
      }

      .waris-v3-print {
        display: block !important;
        margin-top: 22px;
        color: #000;
        font: inherit;
      }

      .waris-v3-place-date-grid,
      .waris-v3-sign-grid {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) 66px minmax(0, 1fr) !important;
        column-gap: 22px !important;
      }

      .waris-v3-place-date {
        grid-column: 3 !important;
        min-height: 24px;
        margin-bottom: 4px;
        white-space: nowrap;
      }

      .waris-v3-sign-grid {
        align-items: start;
      }

      .waris-v3-sign-title {
        margin: 0 !important;
        line-height: 1.35 !important;
        font-weight: 400 !important;
      }

      .waris-v3-left,
      .waris-v3-right {
        min-width: 0;
      }

      .waris-v3-left { grid-column: 1; }
      .waris-v3-right { grid-column: 3; }

      .waris-v3-left-list {
        margin-top: 0;
      }

      .waris-v3-print-heir {
        min-height: 94px;
        display: flex;
        align-items: flex-end;
      }

      .waris-v3-print-heir-name,
      .waris-v3-primary-name {
        min-width: 180px;
        padding: 0 3px 3px;
        border-bottom: 1px dotted #000;
        text-align: center;
        line-height: 1.2;
      }

      .waris-v3-primary-area {
        min-height: 94px;
        display: flex;
        align-items: flex-end;
      }

      .waris-v3-primary-name {
        width: 100%;
      }

      .waris-v3-stamp {
        grid-column: 2;
        grid-row: 2;
        width: 62px;
        height: 38px;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        margin-top: 22px;
        border: 1px solid #000;
        font-size: 11px;
      }

      /* Sampai 3 ahli waris, jaga blok tetap satu kesatuan seperti contoh resmi.
         Jika lebih banyak, browser boleh memecah ke halaman berikutnya. */
      .waris-v3-print:not(.waris-v3-many) {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>


  <style id="skbPphTanahBangunanV3Styles">
    /* =========================================================
       Permohonan SKB PPh Tanah/Bangunan — editor bergaya surat + logic Petunjuk Pengisian.
       Mengikuti bahasa visual renderer letter-classic (Hibah):
       naskah langsung, label : garis isian, tanpa kartu dashboard.
       ========================================================= */
    .skb-v1-editor {
      display: block;
      margin: 0;
      color: #1d1d1f;
      font-size: 16px;
      line-height: 1.55;
    }

    .skb-v1-editor-title {
      max-width: 680px;
      margin: 0 auto 34px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.3;
      text-align: center;
    }

    .skb-v1-card {
      margin: 0 0 22px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .skb-v1-card h2 {
      margin: 0 0 9px;
      color: #1d1d1f;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: normal;
      line-height: 1.5;
    }

    .skb-v1-card h2:empty { display: none; }

    .skb-v1-card > p {
      margin: -3px 0 10px;
      color: #6e6e73;
      font-size: 12px;
      line-height: 1.45;
    }

    .skb-v1-letter-paragraph {
      margin: 0 0 10px;
    }

    .skb-v1-grid,
    .skb-v1-grid.three {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }

    .skb-v1-field,
    .skb-v1-static-line {
      display: grid;
      grid-template-columns: minmax(190px, 34%) 14px minmax(0, 1fr);
      column-gap: 7px;
      align-items: start;
      min-width: 0;
      margin: 0;
      padding: 0;
    }

    .skb-v1-field::after {
      content: ":";
      grid-column: 2;
      grid-row: 1;
      padding-top: 5px;
      color: #1d1d1f;
    }

    .skb-v1-field > span {
      grid-column: 1;
      grid-row: 1;
      padding-top: 5px;
      color: #1d1d1f;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.4;
    }

    .skb-v1-field input,
    .skb-v1-field textarea,
    .skb-v1-field select {
      grid-column: 3;
      grid-row: 1;
      width: 100%;
      min-width: 0;
      min-height: 34px;
      box-sizing: border-box;
      padding: 4px 5px 3px;
      border: 0;
      border-bottom: 1px solid #b5b5ba;
      border-radius: 0;
      background: transparent;
      color: #1d1d1f;
      font: inherit;
      outline: none;
    }

    .skb-v1-field textarea {
      min-height: 54px;
      padding-top: 5px;
      resize: vertical;
    }

    .skb-v1-field input:focus,
    .skb-v1-field textarea:focus,
    .skb-v1-field select:focus {
      border-bottom-color: #0071e3;
      box-shadow: 0 1px 0 #0071e3;
    }

    .skb-v1-field input[aria-invalid="true"],
    .skb-v1-field textarea[aria-invalid="true"] {
      border-bottom-color: #c62828;
      box-shadow: 0 1px 0 #c62828;
    }

    .skb-v1-static-line > span:first-child {
      grid-column: 1;
      padding-top: 5px;
    }

    .skb-v1-static-colon {
      grid-column: 2;
      padding-top: 5px;
      text-align: center;
    }

    .skb-v1-static-value {
      grid-column: 3;
      min-height: 34px;
      padding: 5px 5px 3px;
      border-bottom: 1px solid transparent;
    }

    .skb-v1-group-title {
      margin: 10px 0 4px;
      color: #1d1d1f;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
    }

    .skb-v1-options {
      display: grid;
      gap: 5px;
      margin: 3px 0 13px 32px;
    }

    .skb-v1-option {
      display: inline-flex;
      align-items: flex-start;
      gap: 8px;
      color: #1d1d1f;
      font-size: 15px;
      line-height: 1.45;
    }

    .skb-v1-option input,
    .skb-v1-attachment input {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      margin: 3px 0 0;
      accent-color: #0071e3;
    }

    .skb-v1-condition-control {
      margin: 3px 0 8px;
      padding: 8px 10px;
      border-left: 3px solid #0071e3;
      background: #f5f9ff;
      color: #424245;
      font-size: 13px;
    }

    .skb-v1-toggle-box {
      margin: 4px 0 16px 24px;
      padding: 4px 0 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .skb-v1-table-editor {
      margin: 14px 0 20px;
      overflow-x: auto;
    }

    .skb-v1-table-editor > div:first-child {
      margin-bottom: 7px;
    }

    .skb-v1-table-editor > div:first-child > div:not(.skb-v1-group-title) {
      color: #6e6e73;
      font-size: 12px;
    }

    .skb-v1-table-editor table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      border-spacing: 0;
      background: #fff;
    }

    .skb-v1-table-editor th,
    .skb-v1-table-editor td {
      border: 1px solid #b8b8bd;
      padding: 5px 6px;
      vertical-align: middle;
    }

    .skb-v1-table-editor th {
      background: #fafafa;
      color: #1d1d1f;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
    }

    .skb-v1-table-editor td { padding: 2px 5px; }

    .skb-v1-table-editor input {
      width: 100%;
      min-height: 34px;
      padding: 4px 3px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #1d1d1f;
      font: inherit;
      outline: none;
    }

    .skb-v1-table-editor input:focus {
      box-shadow: inset 0 -2px 0 #0071e3;
    }

    .skb-v1-row-no {
      width: 44px;
      color: #515154;
      font-size: 13px;
      text-align: center;
    }

    .skb-v1-remove-row,
    .skb-v1-add-row {
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
    }

    .skb-v1-remove-row {
      padding: 6px 9px;
      background: #f2f2f7;
      color: #6e6e73;
    }

    .skb-v1-add-row {
      margin-top: 9px;
      padding: 8px 13px;
      background: #0071e3;
      color: #fff;
    }

    .skb-v1-add-row:disabled { opacity: .5; cursor: not-allowed; }

    .skb-v1-attachments {
      display: grid;
      gap: 7px;
      margin-top: 6px;
    }

    .skb-v1-attachment {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      color: #1d1d1f;
      font-size: 14px;
      line-height: 1.45;
    }

    .skb-v1-subattachments {
      display: grid;
      gap: 6px;
      margin: 6px 0 0 30px;
    }

    .skb-v1-sign-editor {
      width: min(360px, 100%);
      margin: 22px 0 0 auto;
    }

    .skb-v1-print { display: none; }

    @media (max-width: 700px) {
      .skb-v1-editor { font-size: 15px; }
      .skb-v1-editor-title { font-size: 18px; margin-bottom: 26px; }

      .skb-v1-field,
      .skb-v1-static-line {
        grid-template-columns: 1fr;
        margin-bottom: 9px;
      }

      .skb-v1-field::after,
      .skb-v1-static-colon { display: none; }

      .skb-v1-field > span,
      .skb-v1-field input,
      .skb-v1-field textarea,
      .skb-v1-static-line > span:first-child,
      .skb-v1-static-value {
        grid-column: 1;
      }

      .skb-v1-field > span,
      .skb-v1-static-line > span:first-child {
        padding-top: 0;
        color: #515154;
        font-size: 13px;
        font-weight: 600;
      }

      .skb-v1-field input,
      .skb-v1-field textarea,
      .skb-v1-static-value {
        grid-row: 2;
      }

      .skb-v1-options { margin-left: 0; }
      .skb-v1-toggle-box { margin-left: 0; }
      .skb-v1-sign-editor { width: 100%; }
    }



    /* Logic-aware controls derived from Petunjuk Pengisian IX.1. */
    .skb-v1-reason-help {
      margin: 7px 0 0 calc(34% + 28px);
      color: #6e6e73;
      font-size: 12px;
      line-height: 1.45;
    }

    .skb-v1-logic-note {
      margin: 8px 0 18px calc(34% + 28px);
      padding: 9px 12px;
      border-left: 3px solid #0071e3;
      background: #f5f9ff;
      color: #424245;
      font-size: 12px;
      line-height: 1.45;
    }

    .skb-v1-conditional-section[hidden],
    .skb-v1-field[hidden],
    .skb-v1-attachment[hidden],
    .skb-v1-subattachments[hidden] {
      display: none !important;
    }

    .skb-v1-required-badge {
      display: inline-flex;
      margin-left: 7px;
      padding: 1px 7px;
      border-radius: 999px;
      background: #fff1f0;
      color: #b42318;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.7;
      white-space: nowrap;
    }

    .skb-v1-attachment.is-required {
      font-weight: 600;
    }

    .skb-v1-other-toggle {
      margin: 11px 0 0 25px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #0071e3;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
    }

    .skb-v1-other-toggle:hover { text-decoration: underline; }

    .skb-v1-reason-select select {
      line-height: 1.45;
    }

    .skb-v1-table-editor .skb-v1-group-title {
      font-weight: 600;
    }

    .skb-v1-section-divider {
      height: 1px;
      margin: 25px 0 21px;
      background: #e5e5ea;
    }

    @media (max-width: 700px) {
      .skb-v1-reason-help,
      .skb-v1-logic-note {
        margin-left: 0;
      }
    }

    @media print {
      .skb-v1-editor { display: none !important; }
      .skb-v1-print { display: block !important; color:#000; font-family:Arial,Helvetica,sans-serif; font-size:10.5pt; line-height:1.35; }
      .skb-v1-page { min-height:250mm; box-sizing:border-box; }
      .skb-v1-page:not(:last-child) { break-after:page; page-break-after:always; }
      .skb-v1-doc-title { margin:0 0 22px; text-align:center; font-size:13pt; line-height:1.3; }
      .skb-v1-print p { margin:0 0 8px; }
      .skb-v1-print-table { width:100%; border-collapse:collapse; margin:7px 0 11px; }
      .skb-v1-print-table td { padding:2px 3px; vertical-align:top; }
      .skb-v1-print-label { width:32%; }
      .skb-v1-colon { width:10px; text-align:center; }
      .skb-v1-line { min-height:18px; border-bottom:1px dotted #666; }
      .skb-v1-role-list { margin:8px 0 10px 14px; display:grid; gap:5px; }
      .skb-v1-box { display:inline-block; width:13px; margin-right:6px; text-align:center; }
      .skb-v1-print h3 { margin:12px 0 5px; font-size:10.5pt; }
      .skb-v1-heir-table { width:100%; border-collapse:collapse; margin:6px 0 10px; font-size:9.5pt; }
      .skb-v1-heir-table th,.skb-v1-heir-table td { border:1px solid #555; padding:4px 5px; vertical-align:top; }
      .skb-v1-heir-table th { font-weight:400; text-align:center; }
      .skb-v1-attach-list { margin:5px 0 0 20px; padding:0; }
      .skb-v1-attach-list li { margin-bottom:5px; padding-left:2px; }
      .skb-v1-attach-sub { margin:5px 0 0 20px; padding-left:16px; list-style-type:lower-alpha; }
      .skb-v1-declaration { display:grid; grid-template-columns:20px 1fr; gap:5px; margin-top:12px; }
      .skb-v1-sign { width:48%; margin:22px 0 0 auto; text-align:center; }
      .skb-v1-sign-place { margin-bottom:8px; }
      .skb-v1-sign-space { min-height:55px; }
      .skb-v1-sign-name { display:inline-block; min-width:180px; padding:0 8px 2px; border-bottom:1px dotted #555; }
      .skb-v1-footnotes { margin-top:18px; font-size:8.4pt; line-height:1.3; }
      .skb-v1-footnote { display:grid; grid-template-columns:34px 1fr; gap:5px; margin-bottom:5px; }
      .skb-v1-footnote ol { margin:4px 0 0 18px; padding:0; }
    }
  </style>

  <script>
    const menuToggle = document.getElementById("menuToggle");
    const mobileMenu = document.getElementById("mobileMenu");

    if (menuToggle && mobileMenu) {
      menuToggle.addEventListener("click", () => {

  <script id="warisSignatureV3Extension">
    (() => {
      "use strict";

      const FORM_ID = "surat-pernyataan-pembagian-waris";
      const activeId = new URLSearchParams(location.search).get("id");
      if (activeId !== FORM_ID) return;

      const MAX_HEIRS = 20;
      const MONTHS_ID = [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
      ];

      const root = document.getElementById("formRoot");
      const printButton = document.getElementById("printBtn");
      const resetButton = document.getElementById("resetBtn");
      let serial = 0;

      const clearErrorBox = () => {
        const box = document.getElementById("errorBox");
        if (!box) return;
        box.textContent = "";
        box.style.display = "";
      };

      const setError = (message, input) => {
        const box = document.getElementById("errorBox");
        if (box) {
          box.textContent = message;
          box.style.display = "block";
        }
        if (input) {
          input.setAttribute("aria-invalid", "true");
          input.focus({ preventScroll: true });
          input.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      };

      const formatDateId = (iso) => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return "";
        const [y, m, d] = iso.split("-").map(Number);
        if (!y || !m || !d || m < 1 || m > 12 || y < 1900 || y > 2100) return "";
        const check = new Date(Date.UTC(y, m - 1, d));
        if (check.getUTCFullYear() !== y || check.getUTCMonth() !== m - 1 || check.getUTCDate() !== d) return "";
        return `${d} ${MONTHS_ID[m - 1]} ${y}`;
      };

      const createInputField = (labelText, input) => {
        const label = document.createElement("label");
        label.className = "waris-v3-field";

        label.append(text, input);
        return label;

      const buildComponent = () => {
        if (!root || root.dataset.warisV3Ready === "true") return false;

        /* Tanda render engine selesai: field isi utama sudah tersedia. */
        if (!document.getElementById("namaPewaris")) return false;

        const date = document.createElement("input");
        date.type = "date";
        date.min = "1900-01-01";
        date.max = "2100-12-31";
        date.id = "warisTanggalTtd";
        date.name = "warisTanggalTtd";

        dateFields.append(
          createInputField("Tempat", place),
          createInputField("Tanggal", date)
        );

        const columns = document.createElement("div");
        columns.className = "waris-v3-editor-columns";

        const left = document.createElement("div");
        left.className = "waris-v3-editor-column";
        const leftTitle = document.createElement("h3");
        leftTitle.textContent = "Mengetahui,";
        const list = document.createElement("div");
        list.className = "waris-v3-heir-list";
        list.id = "warisHeirListV3";
        const actions = document.createElement("div");
        actions.className = "waris-v3-actions";
        const add = document.createElement("button");
        add.type = "button";
        add.className = "waris-v3-add";
        add.textContent = "+ Tambah Ahli Waris";
        actions.appendChild(add);
        left.append(leftTitle, list, actions);

        const right = document.createElement("div");
        right.className = "waris-v3-editor-column";
        const rightTitle = document.createElement("h3");
        rightTitle.textContent = "Yang membuat pernyataan,";
        const primary = document.createElement("input");
        primary.type = "text";
        primary.id = "warisNamaUtama";
        primary.name = "warisNamaUtama";
        primary.placeholder = "Nama lengkap";
        primary.autocomplete = "off";
        right.append(
          rightTitle,
          createInputField("Nama ahli waris yang membuat pernyataan", primary)
        );

        columns.append(left, right);
        editor.append(editorTitle, dateFields, columns);

        /* Struktur cetak dibuat terpisah total dari input editor dan engine. */
        const printView = document.createElement("div");
        printView.className = "waris-v3-print";

        const placeDateGrid = document.createElement("div");
        placeDateGrid.className = "waris-v3-place-date-grid";
        const placeDateText = document.createElement("div");
        placeDateText.className = "waris-v3-place-date";
        placeDateGrid.appendChild(placeDateText);

        const signGrid = document.createElement("div");
        signGrid.className = "waris-v3-sign-grid";

        const printLeft = document.createElement("div");
        printLeft.className = "waris-v3-left";
        const printLeftTitle = document.createElement("p");
        printLeftTitle.className = "waris-v3-sign-title";
        printLeftTitle.textContent = "Mengetahui,";
        const printHeirs = document.createElement("div");
        printHeirs.className = "waris-v3-left-list";
        printLeft.append(printLeftTitle, printHeirs);

        const printRight = document.createElement("div");
        printRight.className = "waris-v3-right";
        const printRightTitle = document.createElement("p");
        printRightTitle.className = "waris-v3-sign-title";
        printRightTitle.textContent = "Yang membuat pernyataan,";
        const primaryArea = document.createElement("div");
        primaryArea.className = "waris-v3-primary-area";
        const primaryName = document.createElement("div");
        primaryName.className = "waris-v3-primary-name";
        primaryArea.appendChild(primaryName);
        printRight.append(printRightTitle, primaryArea);

        const stamp = document.createElement("div");
        stamp.className = "waris-v3-stamp";
        stamp.textContent = "Meterai";

        /* Judul berada pada grid row yang sama; isi tanda tangan di row berikutnya. */
        printLeftTitle.style.gridColumn = "1";
        printLeftTitle.style.gridRow = "1";
        printRightTitle.style.gridColumn = "3";
        printRightTitle.style.gridRow = "1";
        printHeirs.style.gridColumn = "1";
        printHeirs.style.gridRow = "2";
        primaryArea.style.gridColumn = "3";
        primaryArea.style.gridRow = "2";

        signGrid.append(printLeftTitle, printRightTitle, printHeirs, stamp, primaryArea);

        const heirInputs = () => [...list.querySelectorAll(".waris-v3-heir-input")];

        const renumber = () => {
          const inputs = heirInputs();
          inputs.forEach((input, index) => {

          });
          add.disabled = inputs.length >= MAX_HEIRS;
        };

        const syncPrint = () => {
          const formatted = formatDateId(date.value);
          placeDateText.textContent = [place.value.trim(), formatted]
            .filter(Boolean)
            .join(", ");

          printHeirs.replaceChildren();
          heirInputs().forEach((input) => {
            const row = document.createElement("div");
            row.className = "waris-v3-print-heir";
            const name = document.createElement("div");
            name.className = "waris-v3-print-heir-name";
            name.textContent = input.value.trim();
            row.appendChild(name);
            printHeirs.appendChild(row);
          });

          primaryName.textContent = primary.value.trim();
          printView.classList.toggle("waris-v3-many", heirInputs().length > 3);
        };

        const addHeir = (value = "") => {
          if (heirInputs().length >= MAX_HEIRS) return null;
          serial += 1;

          const item = document.createElement("div");
          item.className = "waris-v3-heir-item";

          const label = document.createElement("label");
          label.className = "waris-v3-heir-label";

          const input = document.createElement("input");
          input.type = "text";
          input.className = "waris-v3-heir-input";
          input.id = `warisAhliWaris_${serial}`;
          input.name = "warisAhliWaris[]";
          input.autocomplete = "off";
          input.value = value;
          label.htmlFor = input.id;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "waris-v3-remove";
          remove.textContent = "Hapus";
          remove.addEventListener("click", () => {
            item.remove();
            renumber();
            syncPrint();
          });

          input.addEventListener("input", () => {
            input.removeAttribute("aria-invalid");
            syncPrint();
          });

          item.append(label, input, remove);
          list.appendChild(item);
          renumber();
          syncPrint();
          return input;
        };

        add.addEventListener("click", () => {
          const input = addHeir();
          input?.focus();
        });

        [place, date, primary].forEach((input) => {
          input.addEventListener("input", () => {
            input.removeAttribute("aria-invalid");
            syncPrint();
          });
          input.addEventListener("change", syncPrint);
        });

        addHeir();
        syncPrint();

        if (resetButton) {
          resetButton.addEventListener("click", () => {
            setTimeout(() => {
              place.value = "";
              date.value = "";
              primary.value = "";
              serial = 0;
              list.replaceChildren();
              addHeir();
              clearErrorBox();
              syncPrint();
            }, 0);
          });
        }

        if (printButton) {
          /* Capture: validasi custom dijalankan sebelum handler print milik engine. */
          printButton.addEventListener("click", (event) => {
            clearErrorBox();

            const checks = [
              [place, "Isi tempat penandatanganan."],
              [date, "Isi tanggal penandatanganan."],
              [primary, "Isi nama ahli waris yang membuat pernyataan."]
            ];

            for (const [input, message] of checks) {
              if (!input.value.trim()) {
                event.preventDefault();
                event.stopImmediatePropagation();
                setError(message, input);
                return;
              }
            }

            if (!formatDateId(date.value)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              setError("Tanggal penandatanganan tidak valid.", date);
              return;
            }

            const emptyHeir = heirInputs().find((input) => !input.value.trim());
            if (emptyHeir) {
              event.preventDefault();
              event.stopImmediatePropagation();
              setError("Isi nama seluruh ahli waris pada bagian Mengetahui.", emptyHeir);
              return;
            }

            syncPrint();
          }, true);
        }

        root.dataset.warisV3Ready = "true";
        return true;
      };

      if (!buildComponent() && root) {
        const observer = new MutationObserver(() => {
          if (buildComponent()) observer.disconnect();
        });
        observer.observe(root, { childList: true, subtree: true });
      }
    })();
  </script>

    function syncAttachmentLogic() {
      const required = requiredAttachmentIds();
      const code = reasonCode();
      const all = new Map([...attachmentLabels, ...subLabels]);
      all.forEach((label, id) => {
        const isRequired = required.has(id);
        label.classList.toggle("is-required", isRequired);
        const badge = label.querySelector(".skb-v1-required-badge");
        if (badge) badge.hidden = !isRequired;
        label.hidden = !(isRequired || showOtherAttachments);
      });

      const att10Visible = code === "g" || showOtherAttachments || checked("skbAtt10");
      subWrap.hidden = !att10Visible;

      // Nomor 45 adalah kelompok dokumen. Jika sublampiran dicentang, parent ikut dicentang.
      const anySub = [...subLabels.keys()].some((id) => checked(id));
      if (anySub && byId("skbAtt10")) byId("skbAtt10").checked = true;
    }

    function syncLogic() {
      const code = reasonCode();
      const data = reason();
      const role = roleValue();

      setEnabled(c5, code === "c");
      setEnabled(reportSection, code === "g");
      setEnabled(bookSection, code === "d");

      const showPosition = role === "Wakil dari Wajib Pajak";
      applicantPositionField.hidden = !showPosition;
      const positionInput = byId("skbPemohonJabatan");
      if (positionInput) positionInput.disabled = !showPosition;

      objectDecisionField.hidden = code !== "d";
      const objectDecisionInput = byId("skbNomorKeputusan");
      if (objectDecisionInput) {
        objectDecisionInput.disabled = code !== "d";
        objectDecisionInput.value = code === "d" ? val("skbNomorSk") : "";
      }

      if (data) {
        const parts = [];
        if (data.waris) parts.push("Data ahli waris dan pemberi waris wajib diisi.");
        if (data.nilaiBuku) parts.push("Nomor dan tanggal Surat Keputusan penggunaan nilai buku wajib diisi.");
        if (data.pelaporan) parts.push("Tahun pelaporan/pelunasan wajib diisi.");
        const count = data.attachments.length;
        parts.push(`${count} jenis lampiran utama ditandai wajib sesuai petunjuk pengisian.`);
        if (code === "g") parts.push("Untuk dokumen kelengkapan nomor 10, sublampiran a-c wajib dan sekurang-kurangnya salah satu dari d/e harus tersedia.");
        reasonLogic.textContent = parts.join(" ");
      } else {
        reasonLogic.textContent = "Pilih alasan permohonan untuk menampilkan bagian dan lampiran yang relevan.";
      }

      syncAttachmentLogic();
      syncPrint();
    }

    function clearError() {
      const b = byId("errorBox");
      if (b) { b.textContent = ""; b.style.display = ""; }
      root?.querySelectorAll('[aria-invalid="true"]').forEach((n) => n.removeAttribute("aria-invalid"));
    }

    function fail(msg, node) {
      const b = byId("errorBox");
      if (b) { b.textContent = msg; b.style.display = "block"; }
      if (node) {
        node.setAttribute("aria-invalid", "true");
        node.focus({preventScroll:true});
        node.scrollIntoView({behavior:"smooth", block:"center"});
      }
    }

    function validateAttachments(event) {
      const code = reasonCode();
      const required = requiredAttachmentIds();
      for (const id of required) {
        if (!checked(id)) {
          event.preventDefault(); event.stopImmediatePropagation();
          fail("Centang seluruh lampiran yang wajib sesuai alasan permohonan.", byId(id));
          return false;
        }
      }
      if (code === "g" && !(checked("skbAtt10d") || checked("skbAtt10e"))) {
        event.preventDefault(); event.stopImmediatePropagation();
        fail("Untuk alasan pelaporan/pelunasan, lampirkan sekurang-kurangnya salah satu: bukti pembayaran/penyetoran PPh atau surat keterangan penelitian formal.", byId("skbAtt10d"));
        return false;
      }
      return true;
    }

      if (!root || root.dataset.skbV3Ready === "true") return false;
      if (!root.textContent.includes("Lengkapi data permohonan pada bagian di bawah ini.")) return false;
      root.replaceChildren(editor, printView);
      root.dataset.skbV3Ready = "true";

      const money = byId("skbNilaiPengalihan");
      money?.addEventListener("input", () => { money.value = formatMoney(money.value); syncPrint(); });
      const year = byId("skbTahunPelunasan");
      year?.addEventListener("input", () => { year.value = year.value.replace(/\D/g, "").slice(0, 4); syncPrint(); });

      root.querySelectorAll("input,textarea,select").forEach((node) => {
        node.addEventListener("input", () => {
          node.removeAttribute("aria-invalid");
          if (node.id === "skbNomorSk" && reasonCode() === "d") byId("skbNomorKeputusan").value = node.value;
          if (node.id === "skbPemohonNama") {
            const signName = byId("skbNamaTtd");
            if (signName && (!signName.value || signName.value === lastApplicantName)) signName.value = node.value;
            lastApplicantName = node.value;
          }
          syncAttachmentLogic();
          syncPrint();
        });
        node.addEventListener("change", () => {
          node.removeAttribute("aria-invalid");
          if (node.id === "skbAlasanKode" || node.name === "skbPeran") syncLogic();
          else { syncAttachmentLogic(); syncPrint(); }
        });
      });

      document.querySelectorAll('input[name="skbPeran"]').forEach((node) => node.addEventListener("change", syncLogic));
      byId("skbAlasanKode")?.addEventListener("change", syncLogic);

      resetButton?.addEventListener("click", () => setTimeout(() => {
        root.querySelectorAll("input,textarea,select").forEach((node) => {
          if (node.type === "radio" || node.type === "checkbox") node.checked = false;
          else node.value = "";
          node.removeAttribute("aria-invalid");
        });
        tableA._rows().slice(1).forEach((r) => r.remove());
        tableB._rows().slice(1).forEach((r) => r.remove());
        tableA._rows()[0]?.querySelectorAll("input").forEach((n) => n.value = "");
        tableB._rows()[0]?.querySelectorAll("input").forEach((n) => n.value = "");
        showOtherAttachments = false;
        showOtherButton.textContent = "Tampilkan lampiran lainnya";
        lastApplicantName = "";
        clearError();
        syncLogic();
      }, 0));

      printButton?.addEventListener("click", (event) => {
        clearError();
        const req = [
          "skbNomor","skbLampiran","skbKpp","skbPemohonNama","skbPemohonNpwp","skbWpNama","skbWpNpwp","skbWpAlamat","skbWpKlu","skbAlasanKode",
          "skbNop","skbNib","skbAlamatObjek","skbLuasTanah","skbLuasBangunan","skbNilaiPengalihan","skbLawanNama","skbLawanId","skbLawanAlamat",
          "skbTempatTtd","skbTanggalTtd","skbNamaTtd"
        ];
        for (const id of req) {
          const node = byId(id);
          if (!node?.value.trim()) {
            event.preventDefault(); event.stopImmediatePropagation();
            fail(`Lengkapi ${node?.closest("label")?.querySelector("span")?.textContent || "field wajib"}.`, node);
            return;
          }
        }

        if (!roleValue()) {
          event.preventDefault(); event.stopImmediatePropagation();
          fail("Pilih pihak yang mengajukan permohonan.", document.querySelector('input[name="skbPeran"]'));
          return;
        }

        if (roleValue() === "Wakil dari Wajib Pajak" && !val("skbPemohonJabatan")) {
          event.preventDefault(); event.stopImmediatePropagation();
          fail("Jabatan wajib diisi untuk pihak yang bertindak sebagai Wakil dari Wajib Pajak.", byId("skbPemohonJabatan"));
          return;
        }

        if (!fmtDate(val("skbTanggalTtd"))) {
          event.preventDefault(); event.stopImmediatePropagation();
          fail("Tanggal penandatanganan tidak valid.", byId("skbTanggalTtd"));
          return;
        }

        const code = reasonCode();
        if (code === "g" && !/^\d{4}$/.test(val("skbTahunPelunasan"))) {
          event.preventDefault(); event.stopImmediatePropagation();
          fail("Isi tahun pelaporan/pelunasan dengan 4 digit.", byId("skbTahunPelunasan"));
          return;
        }

        if (code === "d" && (!val("skbNomorSk") || !fmtDate(val("skbTanggalSk")))) {
          event.preventDefault(); event.stopImmediatePropagation();
          fail("Lengkapi nomor dan tanggal Surat Keputusan penggunaan nilai buku.", !val("skbNomorSk") ? byId("skbNomorSk") : byId("skbTanggalSk"));
          return;
        }

        if (code === "c") {
          const rows = [...tableA._rows(), ...tableB._rows()];
          const filled = rows.filter((r) => [...r.querySelectorAll("input")].some((n) => n.value.trim()));
          if (!filled.length) {
            event.preventDefault(); event.stopImmediatePropagation();
            fail("Tambahkan sekurang-kurangnya satu ahli waris.", tableA._rows()[0]?.querySelector("input"));
            return;
          }
          for (const row of filled) {
            for (const node of row.querySelectorAll("input")) {
              if (!node.value.trim()) {
                event.preventDefault(); event.stopImmediatePropagation();
                fail("Lengkapi NIK/NPWP, nama, dan alamat ahli waris pada baris yang digunakan.", node);
                return;
              }
            }
          }
          for (const id of ["skbPemberiNama","skbPemberiId","skbPemberiAlamat"]) {
            const node = byId(id);
            if (!node.value.trim()) {
              event.preventDefault(); event.stopImmediatePropagation();
              fail("Lengkapi Data Pemberi Waris.", node);
              return;
            }
          }
        }

        if (!validateAttachments(event)) return;

        if (!checked("skbDeclaration")) {
          event.preventDefault(); event.stopImmediatePropagation();
          fail("Centang pernyataan kebenaran data dan dokumen.", byId("skbDeclaration"));
          return;
        }
        syncPrint();
      }, true);

      syncLogic();
      syncPrint();
      return true;
    }

    if (!install() && root) {
      const observer = new MutationObserver(() => { if (install()) observer.disconnect(); });
      observer.observe(root, {childList:true, subtree:true});
    }
  })();
  </script>

</body>
</html>
