  <style id="warisSignatureV3Styles">
    /* Komponen khusus Surat Pernyataan Pembagian Waris.
       Tidak mengubah renderer formulir lain. */
    .waris-v3-signature {
      margin-top: 30px;
    }

    .waris-v3-editor {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #d2d2d7;
      border-radius: 18px;
      background: #fafafa;
    }

    .waris-v3-editor-title {
      margin: 0 0 16px;
      font-size: 17px;
      font-weight: 700;
    }

    .waris-v3-date-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .waris-v3-field {
      display: grid;
      gap: 7px;
    }

    .waris-v3-field > span,
    .waris-v3-heir-label {
      color: #515154;
      font-size: 13px;
      font-weight: 600;
    }

    .waris-v3-field input,
    .waris-v3-heir-input {
      width: 100%;
      min-height: 44px;
      box-sizing: border-box;
      padding: 9px 11px;
      border: 1px solid #c7c7cc;
      border-radius: 10px;
      background: #fff;
      color: #1d1d1f;
      font: inherit;
    }

    .waris-v3-field input:focus,
    .waris-v3-heir-input:focus {
      border-color: #0071e3;
      outline: 3px solid rgba(0, 113, 227, .12);
    }

    .waris-v3-field input[aria-invalid="true"],
    .waris-v3-heir-input[aria-invalid="true"] {
      border-color: #c62828;
      outline: 3px solid rgba(198, 40, 40, .10);
    }

    .waris-v3-editor-columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 22px;
    }

    .waris-v3-editor-column {
      min-width: 0;
      padding: 16px;
      border-radius: 14px;
      background: #fff;
    }

    .waris-v3-editor-column h3 {
      margin: 0 0 14px;
      font-size: 16px;
    }

    .waris-v3-heir-list {
      display: grid;
      gap: 10px;
    }

    .waris-v3-heir-item {
      position: relative;
      padding: 12px;
      border: 1px solid #e1e1e6;
      border-radius: 12px;
    }

    .waris-v3-heir-label {
      display: block;
      margin-bottom: 7px;
    }

    .waris-v3-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 5px 9px;
      border: 0;
      border-radius: 999px;
      background: #f2f2f7;
      color: #6e6e73;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .waris-v3-actions {
      margin-top: 11px;
    }

    .waris-v3-add {
      padding: 9px 14px;
      border: 0;
      border-radius: 999px;
      background: #0071e3;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
    }

    .waris-v3-add:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    /* Preview dokumen disembunyikan di layar pengisian.
       Saat cetak, editor hilang dan preview ini yang tampil. */
    .waris-v3-print {
      display: none;
    }

    @media (max-width: 720px) {
      .waris-v3-date-fields,
      .waris-v3-editor-columns {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      .waris-v3-editor {
        display: none !important;
      }

      .waris-v3-print {
        display: block !important;
        margin-top: 22px;
        color: #000;
        font: inherit;
      }

      .waris-v3-place-date-grid,
      .waris-v3-sign-grid {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) 66px minmax(0, 1fr) !important;
        column-gap: 22px !important;
      }

      .waris-v3-place-date {
        grid-column: 3 !important;
        min-height: 24px;
        margin-bottom: 4px;
        white-space: nowrap;
      }

      .waris-v3-sign-grid {
        align-items: start;
      }

      .waris-v3-sign-title {
        margin: 0 !important;
        line-height: 1.35 !important;
        font-weight: 400 !important;
      }

      .waris-v3-left,
      .waris-v3-right {
        min-width: 0;
      }

      .waris-v3-left { grid-column: 1; }
      .waris-v3-right { grid-column: 3; }

      .waris-v3-left-list {
        margin-top: 0;
      }

      .waris-v3-print-heir {
        min-height: 94px;
        display: flex;
        align-items: flex-end;
      }

      .waris-v3-print-heir-name,
      .waris-v3-primary-name {
        min-width: 180px;
        padding: 0 3px 3px;
        border-bottom: 1px dotted #000;
        text-align: center;
        line-height: 1.2;
      }

      .waris-v3-primary-area {
        min-height: 94px;
        display: flex;
        align-items: flex-end;
      }

      .waris-v3-primary-name {
        width: 100%;
      }

      .waris-v3-stamp {
        grid-column: 2;
        grid-row: 2;
        width: 62px;
        height: 38px;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        margin-top: 22px;
        border: 1px solid #000;
        font-size: 11px;
      }

      /* Sampai 3 ahli waris, jaga blok tetap satu kesatuan seperti contoh resmi.
         Jika lebih banyak, browser boleh memecah ke halaman berikutnya. */
      .waris-v3-print:not(.waris-v3-many) {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>

  <script>
    const menuToggle = document.getElementById("menuToggle");
    const mobileMenu = document.getElementById("mobileMenu");

    if (menuToggle && mobileMenu) {
      menuToggle.addEventListener("click", () => {
        const isActive = mobileMenu.classList.toggle("active");
        document.body.classList.toggle("menu-open", isActive);
        menuToggle.setAttribute("aria-expanded", String(isActive));
        menuToggle.textContent = isActive ? "×" : "☰";
      });

      document.querySelectorAll(".mobile-menu a").forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.remove("active");
          document.body.classList.remove("menu-open");
          menuToggle.setAttribute("aria-expanded", "false");
          menuToggle.textContent = "☰";
        });
      });
    }

  <script id="warisSignatureV3Extension">
    (() => {
      "use strict";

      const FORM_ID = "surat-pernyataan-pembagian-waris";
      const activeId = new URLSearchParams(location.search).get("id");
      if (activeId !== FORM_ID) return;

      const MAX_HEIRS = 20;
      const MONTHS_ID = [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
      ];

      const root = document.getElementById("formRoot");
      const printButton = document.getElementById("printBtn");
      const resetButton = document.getElementById("resetBtn");
      let serial = 0;

      const clearErrorBox = () => {
        const box = document.getElementById("errorBox");
        if (!box) return;
        box.textContent = "";
        box.style.display = "";
      };

      const setError = (message, input) => {
        const box = document.getElementById("errorBox");
        if (box) {
          box.textContent = message;
          box.style.display = "block";
        }
        if (input) {
          input.setAttribute("aria-invalid", "true");
          input.focus({ preventScroll: true });
          input.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      };

      const formatDateId = (iso) => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return "";
        const [y, m, d] = iso.split("-").map(Number);
        if (!y || !m || !d || m < 1 || m > 12 || y < 1900 || y > 2100) return "";
        const check = new Date(Date.UTC(y, m - 1, d));
        if (check.getUTCFullYear() !== y || check.getUTCMonth() !== m - 1 || check.getUTCDate() !== d) return "";
        return `${d} ${MONTHS_ID[m - 1]} ${y}`;
      };

      const createInputField = (labelText, input) => {
        const label = document.createElement("label");
        label.className = "waris-v3-field";
        const text = document.createElement("span");
        text.textContent = labelText;
        label.append(text, input);
        return label;
      };

      const buildComponent = () => {
        if (!root || root.dataset.warisV3Ready === "true") return false;

        /* Tanda render engine selesai: field isi utama sudah tersedia. */
        if (!document.getElementById("namaPewaris")) return false;

        const section = document.createElement("section");
        section.className = "waris-v3-signature";
        section.id = "warisSignatureV3";

        const editor = document.createElement("div");
        editor.className = "waris-v3-editor no-print";

        const editorTitle = document.createElement("p");
        editorTitle.className = "waris-v3-editor-title";
        editorTitle.textContent = "Tanda tangan seluruh ahli waris";

        const dateFields = document.createElement("div");
        dateFields.className = "waris-v3-date-fields";

        const place = document.createElement("input");
        place.type = "text";
        place.id = "warisTempatTtd";
        place.name = "warisTempatTtd";
        place.placeholder = "Contoh: Bandung";
        place.autocomplete = "off";

        const date = document.createElement("input");
        date.type = "date";
        date.min = "1900-01-01";
        date.max = "2100-12-31";
        date.id = "warisTanggalTtd";
        date.name = "warisTanggalTtd";

        dateFields.append(
          createInputField("Tempat", place),
          createInputField("Tanggal", date)
        );

        const columns = document.createElement("div");
        columns.className = "waris-v3-editor-columns";

        const left = document.createElement("div");
        left.className = "waris-v3-editor-column";
        const leftTitle = document.createElement("h3");
        leftTitle.textContent = "Mengetahui,";
        const list = document.createElement("div");
        list.className = "waris-v3-heir-list";
        list.id = "warisHeirListV3";
        const actions = document.createElement("div");
        actions.className = "waris-v3-actions";
        const add = document.createElement("button");
        add.type = "button";
        add.className = "waris-v3-add";
        add.textContent = "+ Tambah Ahli Waris";
        actions.appendChild(add);
        left.append(leftTitle, list, actions);

        const right = document.createElement("div");
        right.className = "waris-v3-editor-column";
        const rightTitle = document.createElement("h3");
        rightTitle.textContent = "Yang membuat pernyataan,";
        const primary = document.createElement("input");
        primary.type = "text";
        primary.id = "warisNamaUtama";
        primary.name = "warisNamaUtama";
        primary.placeholder = "Nama lengkap";
        primary.autocomplete = "off";
        right.append(
          rightTitle,
          createInputField("Nama ahli waris yang membuat pernyataan", primary)
        );

        columns.append(left, right);
        editor.append(editorTitle, dateFields, columns);

        /* Struktur cetak dibuat terpisah total dari input editor dan engine. */
        const printView = document.createElement("div");
        printView.className = "waris-v3-print";

        const placeDateGrid = document.createElement("div");
        placeDateGrid.className = "waris-v3-place-date-grid";
        const placeDateText = document.createElement("div");
        placeDateText.className = "waris-v3-place-date";
        placeDateGrid.appendChild(placeDateText);

        const signGrid = document.createElement("div");
        signGrid.className = "waris-v3-sign-grid";

        const printLeft = document.createElement("div");
        printLeft.className = "waris-v3-left";
        const printLeftTitle = document.createElement("p");
        printLeftTitle.className = "waris-v3-sign-title";
        printLeftTitle.textContent = "Mengetahui,";
        const printHeirs = document.createElement("div");
        printHeirs.className = "waris-v3-left-list";
        printLeft.append(printLeftTitle, printHeirs);

        const printRight = document.createElement("div");
        printRight.className = "waris-v3-right";
        const printRightTitle = document.createElement("p");
        printRightTitle.className = "waris-v3-sign-title";
        printRightTitle.textContent = "Yang membuat pernyataan,";
        const primaryArea = document.createElement("div");
        primaryArea.className = "waris-v3-primary-area";
        const primaryName = document.createElement("div");
        primaryName.className = "waris-v3-primary-name";
        primaryArea.appendChild(primaryName);
        printRight.append(printRightTitle, primaryArea);

        const stamp = document.createElement("div");
        stamp.className = "waris-v3-stamp";
        stamp.textContent = "Meterai";

        /* Judul berada pada grid row yang sama; isi tanda tangan di row berikutnya. */
        printLeftTitle.style.gridColumn = "1";
        printLeftTitle.style.gridRow = "1";
        printRightTitle.style.gridColumn = "3";
        printRightTitle.style.gridRow = "1";
        printHeirs.style.gridColumn = "1";
        printHeirs.style.gridRow = "2";
        primaryArea.style.gridColumn = "3";
        primaryArea.style.gridRow = "2";

        signGrid.append(printLeftTitle, printRightTitle, printHeirs, stamp, primaryArea);
        printView.append(placeDateGrid, signGrid);
        section.append(editor, printView);
        root.appendChild(section);

        const heirInputs = () => [...list.querySelectorAll(".waris-v3-heir-input")];

        const renumber = () => {
          const inputs = heirInputs();
          inputs.forEach((input, index) => {
            const item = input.closest(".waris-v3-heir-item");
            const label = item?.querySelector(".waris-v3-heir-label");
            const remove = item?.querySelector(".waris-v3-remove");
            if (label) label.textContent = `Nama ahli waris ${index + 1}`;
            input.placeholder = `Nama ahli waris ${index + 1}`;
            input.setAttribute("aria-label", `Nama ahli waris ${index + 1}`);
            if (remove) remove.hidden = inputs.length <= 1;
          });
          add.disabled = inputs.length >= MAX_HEIRS;
        };

        const syncPrint = () => {
          const formatted = formatDateId(date.value);
          placeDateText.textContent = [place.value.trim(), formatted]
            .filter(Boolean)
            .join(", ");

          printHeirs.replaceChildren();
          heirInputs().forEach((input) => {
            const row = document.createElement("div");
            row.className = "waris-v3-print-heir";
            const name = document.createElement("div");
            name.className = "waris-v3-print-heir-name";
            name.textContent = input.value.trim();
            row.appendChild(name);
            printHeirs.appendChild(row);
          });

          primaryName.textContent = primary.value.trim();
          printView.classList.toggle("waris-v3-many", heirInputs().length > 3);
        };

        const addHeir = (value = "") => {
          if (heirInputs().length >= MAX_HEIRS) return null;
          serial += 1;

          const item = document.createElement("div");
          item.className = "waris-v3-heir-item";

          const label = document.createElement("label");
          label.className = "waris-v3-heir-label";

          const input = document.createElement("input");
          input.type = "text";
          input.className = "waris-v3-heir-input";
          input.id = `warisAhliWaris_${serial}`;
          input.name = "warisAhliWaris[]";
          input.autocomplete = "off";
          input.value = value;
          label.htmlFor = input.id;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "waris-v3-remove";
          remove.textContent = "Hapus";
          remove.addEventListener("click", () => {
            item.remove();
            renumber();
            syncPrint();
          });

          input.addEventListener("input", () => {
            input.removeAttribute("aria-invalid");
            syncPrint();
          });

          item.append(label, input, remove);
          list.appendChild(item);
          renumber();
          syncPrint();
          return input;
        };

        add.addEventListener("click", () => {
          const input = addHeir();
          input?.focus();
        });

        [place, date, primary].forEach((input) => {
          input.addEventListener("input", () => {
            input.removeAttribute("aria-invalid");
            syncPrint();
          });
          input.addEventListener("change", syncPrint);
        });

        addHeir();
        syncPrint();

        if (resetButton) {
          resetButton.addEventListener("click", () => {
            setTimeout(() => {
              place.value = "";
              date.value = "";
              primary.value = "";
              serial = 0;
              list.replaceChildren();
              addHeir();
              clearErrorBox();
              syncPrint();
            }, 0);
          });
        }

        if (printButton) {
          /* Capture: validasi custom dijalankan sebelum handler print milik engine. */
          printButton.addEventListener("click", (event) => {
            clearErrorBox();

            const checks = [
              [place, "Isi tempat penandatanganan."],
              [date, "Isi tanggal penandatanganan."],
              [primary, "Isi nama ahli waris yang membuat pernyataan."]
            ];

            for (const [input, message] of checks) {
              if (!input.value.trim()) {
                event.preventDefault();
                event.stopImmediatePropagation();
                setError(message, input);
                return;
              }
            }

            if (!formatDateId(date.value)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              setError("Tanggal penandatanganan tidak valid.", date);
              return;
            }

            const emptyHeir = heirInputs().find((input) => !input.value.trim());
            if (emptyHeir) {
              event.preventDefault();
              event.stopImmediatePropagation();
              setError("Isi nama seluruh ahli waris pada bagian Mengetahui.", emptyHeir);
              return;
            }

            syncPrint();
          }, true);
        }

        root.dataset.warisV3Ready = "true";
        return true;
      };

      if (!buildComponent() && root) {
        const observer = new MutationObserver(() => {
          if (buildComponent()) observer.disconnect();
        });
        observer.observe(root, { childList: true, subtree: true });
      }
    })();
  </script>

      if (y < 1900 || y > 2100 || m<1 || m>12 || dt.getUTCFullYear()!==y || dt.getUTCMonth()!==m-1 || dt.getUTCDate()!==d) return "";
      return `${d} ${MONTHS[m-1]} ${y}`;
    };

      "Salinan keputusan Direktur Jenderal Pajak mengenai persetujuan penggunaan nilai buku atas pengalihan harta dalam rangka penggabungan, peleburan, atau pemekaran usaha",
      "Daftar pengalihan hak atas tanah dan/atau bangunan atau perjanjian pengikatan jual beli atas tanah dan/atau bangunan beserta perubahannya terhadap badan yang melakukan pengalihan harta dalam rangka penggabungan, peleburan, atau pemekaran usaha yang telah ditetapkan oleh Menteri untuk menggunakan nilai buku",
      "Salinan dokumen perjanjian bangun guna serah, bangun serah guna, atau pemanfaatan barang milik negara berupa tanah dan/atau bangunan",
      "Salinan dokumen yang menunjukkan bahwa orang pribadi atau badan bukan merupakan subjek pajak",
      "Dokumen kelengkapan berupa"
    ];
    const subTexts = [
      "Salinan Surat Pemberitahuan Tahunan Pajak Penghasilan",
      "Objek tanah dan/atau bangunan yang diajukan permohonan Surat Keterangan Bebas",
      "Daftar seluruh pengalihan hak atas tanah dan/atau bangunan yang telah dilaporkan dalam Surat Pemberitahuan Tahunan Pajak Penghasilan dan/atau Pajak Penghasilan yang telah dilunasi",
      "Salinan bukti pembayaran atau penyetoran Pajak Penghasilan berupa salinan Surat Setoran Pajak atau Sarana Administrasi Lain yang Disamakan dengan Surat Setoran Pajak",
      "Salinan surat keterangan penelitian formal bukti pemenuhan kewajiban penyetoran Pajak Penghasilan atas penghasilan dari pengalihan hak atas tanah dan/atau bangunan atau perjanjian pengikatan jual beli atas tanah dan/atau bangunan beserta perubahannya"
    ];
    const c9=card("Untuk kelengkapan permohonan SKB, bersama ini kami lampirkan sebagai berikut:");
    const attWrap=el("div","skb-v1-attachments");
    attachmentTexts.forEach((t,i)=>{
      const lab=el("label","skb-v1-attachment");
      const inp=document.createElement("input");
      inp.type="checkbox"; inp.id=`skbAtt${i+1}`;
      lab.append(inp,document.createTextNode(`${i+1}. ${t}`));
      attWrap.appendChild(lab);
    });
    const subWrap=el("div","skb-v1-subattachments");
    subTexts.forEach((t,i)=>{
      const lab=el("label","skb-v1-attachment");
      const inp=document.createElement("input");
      inp.type="checkbox"; inp.id=`skbAtt10${String.fromCharCode(97+i)}`;
      lab.append(inp,document.createTextNode(`${String.fromCharCode(97+i)}. ${t}`));
      subWrap.appendChild(lab);
    });
    c9.append(attWrap,subWrap);

    const c10=card("");
    const declaration=optionCheck("skbDeclaration","Dengan ini kami menyatakan bahwa data dan dokumen yang kami sampaikan adalah benar dan/atau sesuai dengan kondisi sebenarnya, apabila diketahui terdapat ketidakbenaran atas data dan dokumen yang kami sampaikan kami bersedia menerima segala sanksi dan konsekuensinya sesuai dengan ketentuan perundang-undangan.");
    c10.appendChild(declaration);
    const g10=el("div","skb-v1-grid skb-v1-sign-editor");
    g10.append(
      field("skbTempatTtd","Tempat","text",{required:true}),
      field("skbTanggalTtd","Tanggal","date",{required:true,min:"1900-01-01",max:"2100-12-31"}),
      field("skbNamaTtd","Nama penandatangan","text",{required:true})
    );
    c10.appendChild(g10);

    editor.append(editorTitle,c1,c2,c3,c4,c5,c6,c7,c8,c9,c10);

    const printView=el("div","skb-v1-print");
    const p1=el("section","skb-v1-page"), p2=el("section","skb-v1-page"), p3=el("section","skb-v1-page");
    printView.append(p1,p2,p3);

    function setEnabled(container, yes) {
      container.querySelectorAll("input,textarea,select,button").forEach(node=>{ node.disabled=!yes; });
      container.style.opacity = yes ? "1" : ".55";
    }

    function roleValue() { return document.querySelector('input[name="skbPeran"]:checked')?.value || ""; }
    function attachmentMark(id) { return box(checked(id)); }

    function syncPrint() {
      p1.replaceChildren(); p2.replaceChildren(); p3.replaceChildren();
      const title=el("h1","skb-v1-doc-title","PERMOHONAN SURAT KETERANGAN BEBAS PAJAK PENGHASILAN ATAS PENGHASILAN DARI PENGALIHAN HAK ATAS TANAH DAN/ATAU BANGUNAN"); p1.appendChild(title);
      p1.append(printTable([["Nomor",val("skbNomor")],["Lampiran",val("skbLampiran")],["Hal","Permohonan Surat Keterangan Bebas Pajak Penghasilan atas Penghasilan dari Pengalihan Hak atas Tanah dan/atau Bangunan"]]));
      const kpp=el("p","",`Yth. Kepala Kantor Pelayanan Pajak ${val("skbKpp")}`); p1.appendChild(kpp);
      p1.append(el("p","","Yang bertanda tangan di bawah ini:"), printTable([["Nama",val("skbPemohonNama")],["NPWP",val("skbPemohonNpwp")],["Jabatan",val("skbPemohonJabatan")]]));
      p1.appendChild(el("p","","Bertindak selaku:"));
      const rl=el("div","skb-v1-role-list"); ["Wajib Pajak","Wakil dari Wajib Pajak","Kuasa dari Wajib Pajak"].forEach(r=>rl.appendChild(el("div","",`${box(roleValue()===r)} ${r}`))); p1.appendChild(rl);
      p1.append(printTable([["Nama",val("skbWpNama")],["NPWP",val("skbWpNpwp")],["Alamat",val("skbWpAlamat")],["KLU",val("skbWpKlu")]]));
      p1.appendChild(el("p","",`mengajukan permohonan untuk memperoleh Surat Keterangan Bebas (SKB) Pajak Penghasilan atas Penghasilan dari Pengalihan Hak atas Tanah dan/atau Bangunan dengan alasan: ${val("skbAlasan")}`));
      p1.appendChild(el("h3","","Data Penerima dan Pemberi Waris:**)"));
      p1.appendChild(el("p","","A. Pihak penerima pengalihan hak atas tanah dan/atau bangunan – Ahli Waris dengan NIK Telah Diaktivasi atau Ber-NPWP")); p1.appendChild(inheritancePrintTable("A"));
      p1.appendChild(el("p","","B. Pihak penerima pengalihan hak atas tanah dan/atau bangunan – Ahli Waris dengan NIK Belum Diaktivasi atau Non-NPWP")); p1.appendChild(inheritancePrintTable("B"));
      p1.appendChild(el("h3","","Data Pemberi Waris:")); p1.appendChild(printTable([["Nama",val("skbPemberiNama")],["NPWP/NIK",val("skbPemberiId")],["Alamat",val("skbPemberiAlamat")]]));

      p2.appendChild(el("p","",`Penghasilan atas pengalihan hak atas tanah dan/atau bangunan tersebut telah dilaporkan dalam SPT Tahunan Pajak Penghasilan (PPh) dan/atau PPh atas penghasilan tersebut telah dilunasi tahun ${checked("skbPelaporanAktif") ? val("skbTahunPelunasan") : ""}. ***)`));
      p2.appendChild(el("p","","Terlampir objek tanah dan/atau bangunan yang diajukan permohonan surat keterangan bebas dan daftar seluruh pengalihan hak atas tanah dan/atau bangunan yang telah dilaporkan dalam surat pemberitahuan tahunan pajak penghasilan dan/atau pajak penghasilan yang telah dilunasi."));
      p2.appendChild(el("p","",`Nomor Surat Keputusan Persetujuan Penggunaan Nilai Buku Atas Pengalihan Harta Dalam Rangka Penggabungan/Peleburan/Pengambilalihan Usaha ${checked("skbNilaiBukuAktif") ? val("skbNomorSk") : ""} tanggal ${checked("skbNilaiBukuAktif") ? fmtDate(val("skbTanggalSk")) : ""}; file dokumen surat keputusan dan data objek pajak sebagaimana terlampir. ****)`));
      p2.appendChild(el("h3","","Dengan data Objek Pajak sebagai berikut:"));
      p2.appendChild(printTable([["Nomor Objek Pajak (NOP)",val("skbNop")],["Nomor Identifikasi Bidang Tanah (NIB)",val("skbNib")],["Alamat Tanah dan/atau Bangunan",val("skbAlamatObjek")],["Nomor Keputusan",val("skbNomorKeputusan")],["Luas tanah dan/atau bangunan (Meter Persegi)",[val("skbLuasTanah"),val("skbLuasBangunan")].join(" / ")],["Nilai Pengalihan",val("skbNilaiPengalihan") ? `Rp${val("skbNilaiPengalihan")}` : ""]]));
      p2.appendChild(el("h3","","Dengan lawan transaksi sebagai berikut:")); p2.appendChild(printTable([["Nama",val("skbLawanNama")],["NPWP/NIK",val("skbLawanId")],["Alamat",val("skbLawanAlamat")]]));
      p2.appendChild(el("p","","Untuk kelengkapan permohonan SKB, bersama ini kami lampirkan sebagai berikut:"));
      const ol=el("ol","skb-v1-attach-list");
      attachmentTexts.slice(0,9).forEach((t,i)=>{const li=el("li","",`${attachmentMark(`skbAtt${i+1}`)} ${t}`); ol.appendChild(li);});
      const li10=el("li","",`${attachmentMark("skbAtt10")} ${attachmentTexts[9]}:`); const subol=el("ol","skb-v1-attach-sub");
      subTexts.slice(0,3).forEach((t,i)=>subol.appendChild(el("li","",`${attachmentMark(`skbAtt10${String.fromCharCode(97+i)}`)} ${t}`))); li10.appendChild(subol); ol.appendChild(li10); p2.appendChild(ol);

      const cont=el("ol","skb-v1-attach-sub"); cont.start=4;
      subTexts.slice(3).forEach((t,j)=>cont.appendChild(el("li","",`${attachmentMark(`skbAtt10${String.fromCharCode(100+j)}`)} ${t}`))); p3.appendChild(cont);
      const dec=el("div","skb-v1-declaration"); dec.append(el("div","",box(checked("skbDeclaration"))),el("div","","Dengan ini kami menyatakan bahwa data dan dokumen yang kami sampaikan adalah benar dan/atau sesuai dengan kondisi sebenarnya, apabila diketahui terdapat ketidakbenaran atas data dan dokumen yang kami sampaikan kami bersedia menerima segala sanksi dan konsekuensinya sesuai dengan ketentuan perundang-undangan.")); p3.appendChild(dec);
      const sign=el("div","skb-v1-sign"); sign.append(el("div","skb-v1-sign-place",[val("skbTempatTtd"),fmtDate(val("skbTanggalTtd"))].filter(Boolean).join(", ")),el("div","",roleValue()||"Wajib Pajak/Wakil/Kuasa"),el("div","skb-v1-sign-space"),el("div","skb-v1-sign-name",val("skbNamaTtd"))); p3.appendChild(sign);
      const notes=el("div","skb-v1-footnotes");
      const note=(mark,content)=>{const n=el("div","skb-v1-footnote");n.append(el("div","",mark),el("div","",content));return n;};
      notes.append(note("*)","Beri tanda (√) pada kotak yang disediakan sesuai dengan pihak yang mengajukan permohonan."),note("**)","Hanya diisi jika alasan pengajuan permohonan adalah terkait pengalihan harta berupa tanah dan/atau bangunan karena waris."));
      const n3=note("***)","Hanya diisi jika alasan pengajuan permohonan adalah terkait pengalihan hak atas tanah dan/atau bangunan telah dilaporkan dalam SPT Tahunan Pajak Penghasilan (PPh) dan/atau PPh atas penghasilan tersebut telah dilunasi dan atas pengalihan hak tersebut belum dibuatkan akta, keputusan, perjanjian, kesepakatan, atau risalah lelang oleh pejabat yang berwenang. Digunakan untuk alasan pengecualian pengenaan Pajak Penghasilan berdasarkan Peraturan Pemerintah Nomor 34 Tahun 2016 atas penghasilan dari pengalihan hak atas tanah dan/atau bangunan sebelum tanggal 7 September 2016; atau pengecualian pengenaan Pajak Penghasilan berdasarkan Peraturan Pemerintah Nomor 40 Tahun 2016 atas penghasilan dari pengalihan hak atas tanah dan/atau bangunan sebelum tanggal 17 Oktober 2016."); notes.appendChild(n3);
      notes.append(note("****)","Hanya diisi jika alasan pengajuan permohonan adalah terkait pengalihan harta berupa tanah dan/atau bangunan dalam rangka penggabungan, peleburan, atau pemekaran usaha yang telah ditetapkan oleh Menteri untuk menggunakan nilai buku."),note("*****)","Hanya diisi untuk 1 (satu) objek pengalihan tanah dan/atau bangunan yang diajukan permohonan Surat Keterangan Bebas."),note("******)","Coret yang tidak perlu.")); p3.appendChild(notes);
    }

    function clearError(){ const b=byId("errorBox"); if(b){b.textContent="";b.style.display="";} }
    function fail(msg,node){ const b=byId("errorBox"); if(b){b.textContent=msg;b.style.display="block";} if(node){node.setAttribute("aria-invalid","true");node.focus({preventScroll:true});node.scrollIntoView({behavior:"smooth",block:"center"});} }

    function install() {
      if (!root || root.dataset.skbV2Ready === "true") return false;
      if (!root.textContent.includes("Lengkapi data permohonan pada bagian di bawah ini.")) return false;
      root.replaceChildren(editor,printView);
      root.dataset.skbV2Ready="true";

      const money=byId("skbNilaiPengalihan"); money?.addEventListener("input",()=>{ const pos=money.selectionStart; money.value=formatMoney(money.value); syncPrint(); });
      const year=byId("skbTahunPelunasan"); year?.addEventListener("input",()=>{year.value=year.value.replace(/\D/g,"").slice(0,4);syncPrint();});
      root.querySelectorAll("input,textarea,select").forEach(n=>{ n.addEventListener("input",()=>{n.removeAttribute("aria-invalid");syncPrint();}); n.addEventListener("change",syncPrint); });
      document.querySelectorAll('input[name="skbPeran"]').forEach(n=>n.addEventListener("change",syncPrint));
      const syncConditions=()=>{ setEnabled(warisBox,checked("skbWarisAktif")); setEnabled(reportGrid,checked("skbPelaporanAktif")); setEnabled(bookGrid,checked("skbNilaiBukuAktif")); syncPrint(); };
      byId("skbWarisAktif")?.addEventListener("change",syncConditions); byId("skbPelaporanAktif")?.addEventListener("change",syncConditions); byId("skbNilaiBukuAktif")?.addEventListener("change",syncConditions); syncConditions();

      resetButton?.addEventListener("click",()=>setTimeout(()=>{root.querySelectorAll("input,textarea").forEach(n=>{ if(n.type==="radio"||n.type==="checkbox") n.checked=false; else n.value=""; n.removeAttribute("aria-invalid"); }); tableA._rows().slice(1).forEach(r=>r.remove()); tableB._rows().slice(1).forEach(r=>r.remove()); tableA._rows()[0]?.querySelectorAll("input").forEach(n=>n.value=""); tableB._rows()[0]?.querySelectorAll("input").forEach(n=>n.value=""); syncConditions(); clearError();},0));

      printButton?.addEventListener("click",event=>{
        clearError();
        const req=["skbKpp","skbPemohonNama","skbPemohonNpwp","skbPemohonJabatan","skbWpNama","skbWpNpwp","skbWpAlamat","skbWpKlu","skbAlasan","skbNop","skbNib","skbAlamatObjek","skbLuasTanah","skbLuasBangunan","skbNilaiPengalihan","skbLawanNama","skbLawanId","skbLawanAlamat","skbTempatTtd","skbTanggalTtd","skbNamaTtd"];
        for(const id of req){ const n=byId(id); if(!n?.value.trim()){event.preventDefault();event.stopImmediatePropagation();fail(`Lengkapi ${n?.closest("label")?.querySelector("span")?.textContent || "field wajib"}.`,n);return;} }
        if(!roleValue()){event.preventDefault();event.stopImmediatePropagation();fail("Pilih pihak yang mengajukan permohonan.",document.querySelector('input[name="skbPeran"]'));return;}
        if(!fmtDate(val("skbTanggalTtd"))){event.preventDefault();event.stopImmediatePropagation();fail("Tanggal penandatanganan tidak valid.",byId("skbTanggalTtd"));return;}
        if(checked("skbPelaporanAktif") && !/^\d{4}$/.test(val("skbTahunPelunasan"))){event.preventDefault();event.stopImmediatePropagation();fail("Isi tahun pelaporan/pelunasan dengan 4 digit.",byId("skbTahunPelunasan"));return;}
        if(checked("skbNilaiBukuAktif") && (!val("skbNomorSk") || !fmtDate(val("skbTanggalSk")))){event.preventDefault();event.stopImmediatePropagation();fail("Lengkapi nomor dan tanggal Surat Keputusan penggunaan nilai buku.",!val("skbNomorSk")?byId("skbNomorSk"):byId("skbTanggalSk"));return;}
        if(checked("skbWarisAktif")){
          const rows=[...tableA._rows(),...tableB._rows()]; const filled=rows.filter(r=>[...r.querySelectorAll("input")].some(n=>n.value.trim()));
          if(!filled.length){event.preventDefault();event.stopImmediatePropagation();fail("Tambahkan sekurang-kurangnya satu ahli waris.",tableA._rows()[0]?.querySelector("input"));return;}
          for(const r of filled){for(const n of r.querySelectorAll("input")){if(!n.value.trim()){event.preventDefault();event.stopImmediatePropagation();fail("Lengkapi NIK/NPWP, nama, dan alamat ahli waris pada baris yang digunakan.",n);return;}}}
          for(const id of ["skbPemberiNama","skbPemberiId","skbPemberiAlamat"]){const n=byId(id);if(!n.value.trim()){event.preventDefault();event.stopImmediatePropagation();fail("Lengkapi Data Pemberi Waris.",n);return;}}
        }
        if(!checked("skbDeclaration")){event.preventDefault();event.stopImmediatePropagation();fail("Centang pernyataan kebenaran data dan dokumen.",byId("skbDeclaration"));return;}
        syncPrint();
      },true);
      syncPrint(); return true;
    }
    if(!install() && root){const obs=new MutationObserver(()=>{if(install())obs.disconnect();});obs.observe(root,{childList:true,subtree:true});}
  })();
  </script>
